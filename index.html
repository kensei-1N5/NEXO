const vaultDBName='nexo-vault-v1';let vaultKey=null,vaultBusy=false,recipeTimerHandle=null,recipeSeconds=0,vaultAwayAt=0,vaultLockTimer=null;const vaultGraceMs=60000;
function vaultLock(){vaultKey=null;vaultBusy=false;vaultAwayAt=0;if(vaultLockTimer){clearTimeout(vaultLockTimer);vaultLockTimer=null}}
function vaultPause(){if(!vaultKey||vaultAwayAt)return;vaultAwayAt=Date.now();vaultLockTimer=setTimeout(()=>{if(vaultAwayAt&&Date.now()-vaultAwayAt>=vaultGraceMs)vaultLock()},vaultGraceMs)}
function vaultResume(){if(!vaultAwayAt)return;if(Date.now()-vaultAwayAt>=vaultGraceMs){vaultLock();return}vaultAwayAt=0;if(vaultLockTimer){clearTimeout(vaultLockTimer);vaultLockTimer=null}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){vaultPause();if(current==='vault'){$('#vaultScreen')?.replaceChildren();}}else if(current==='vault'){vaultResume();vaultMustUnlock()}});

function vaultDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(vaultDBName,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function vaultGet(store,key){const db=await vaultDb();return new Promise((resolve,reject)=>{const t=db.transaction(store,'readonly'),r=t.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);t.oncomplete=()=>db.close()})}
async function vaultPut(store,value,key){const db=await vaultDb();return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');if(key===undefined)t.objectStore(store).put(value);else t.objectStore(store).put(value,key);t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>reject(t.error)})}
async function vaultAll(){const db=await vaultDb();return new Promise((resolve,reject)=>{const t=db.transaction('files','readonly'),r=t.objectStore('files').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);t.oncomplete=()=>db.close()})}
async function vaultRemove(id){const db=await vaultDb();return new Promise((resolve,reject)=>{const t=db.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>reject(t.error)})}
const vaultRand=n=>crypto.getRandomValues(new Uint8Array(n));
function vaultB64(a){let s='';for(const v of new Uint8Array(a))s+=String.fromCharCode(v);return btoa(s)}
function vaultBytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function vaultDerive(secret,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:vaultBytes(salt),iterations:310000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vaultWrap(raw,secret){const salt=vaultB64(vaultRand(16)),iv=vaultRand(12),k=await vaultDerive(secret,salt);return {salt,iv:vaultB64(iv),data:vaultB64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,raw))}}
async function vaultUnwrap(w,secret){const k=await vaultDerive(secret,w.salt);return crypto.subtle.decrypt({name:'AES-GCM',iv:vaultBytes(w.iv)},k,vaultBytes(w.data))}
function vaultRecovery(){return Array.from(vaultRand(32),b=>b.toString(16).padStart(2,'0')).join('').match(/.{1,8}/g).join('-')}
function vault(){vaultCategoryView=null;content('<div id="vaultScreen" class="stack"><p class="muted">Chargement du coffre-fort sécurisé…</p></div>');vaultStart()}
async function vaultStart(){try{vaultResume();const meta=await vaultGet('meta','config');if(current!=='vault')return;if(!meta){$('#vaultScreen').innerHTML=`<div class="card stack"><h2>🔐 Créer mon coffre-fort</h2><p class="muted">Documents chiffrés sur cet appareil. Le mot de passe sera redemandé après 1 minute hors du coffre-fort.</p><input class="field" type="password" id="vaultNewPass" autocomplete="new-password" placeholder="Mot de passe (12 caractères minimum)"><input class="field" type="password" id="vaultConfirm" autocomplete="new-password" placeholder="Confirmer le mot de passe"><button class="btn primary" onclick="vaultCreate()">Créer le coffre-fort</button></div>`;return}if(!vaultKey){$('#vaultScreen').innerHTML=`<div class="card stack"><h2>🔐 Coffre-fort verrouillé</h2><input class="field" type="password" id="vaultPassword" autocomplete="off" placeholder="Mot de passe principal"><button class="btn primary" onclick="vaultUnlock(false)">Déverrouiller</button><button class="btn" onclick="vaultRecoveryForm()">Mot de passe oublié ?</button></div>`;return}vaultShow()}catch(e){$('#vaultScreen').innerHTML='<div class="card">Stockage local indisponible sur cet appareil.</div>';console.error(e)}}
async function vaultCreate(){if(vaultBusy)return;const pass=$('#vaultNewPass').value;if(pass.length<12||pass!==$('#vaultConfirm').value)return toast('Mot de passe de 12 caractères minimum et confirmation identique');vaultBusy=true;try{const raw=vaultRand(32),recovery=vaultRecovery(),meta={version:1,pass:await vaultWrap(raw,pass),recovery:await vaultWrap(raw,recovery)};await vaultPut('meta',meta,'config');vaultKey=await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);$('#vaultScreen').innerHTML=`<div class="card stack"><h2>🔑 Ta clé de récupération</h2><p>Conserve cette clé hors de NEXO. Elle ne sera plus affichée après cette étape.</p><textarea class="field" id="vaultRecoveryCode" readonly rows="3">${recovery}</textarea><button class="btn" onclick="copyText($('#vaultRecoveryCode').value)">Copier la clé</button><label><input type="checkbox" id="vaultRecoveryConfirmed"> J'ai sauvegardé cette clé dans un endroit sûr</label><button class="btn primary" onclick="if(!$('#vaultRecoveryConfirmed').checked)return toast('Conserve la clé avant de continuer');vaultShow()">Accéder au coffre-fort</button></div>`}catch(e){toast('Impossible de créer le coffre-fort');console.error(e)}finally{vaultBusy=false}}
async function vaultUnlock(recover){if(vaultBusy)return;const el=$(recover?'#vaultRecoveryInput':'#vaultPassword'),secret=el?.value||'';if(!secret)return;vaultBusy=true;try{const meta=await vaultGet('meta','config'),raw=await vaultUnwrap(meta[recover?'recovery':'pass'],secret);vaultKey=await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);if(recover){$('#vaultScreen').innerHTML=`<div class="card stack"><h2>Définir un nouveau mot de passe</h2><input class="field" id="vaultNewPass" type="password" placeholder="Nouveau mot de passe (12 caractères minimum)"><input class="field" id="vaultConfirm" type="password" placeholder="Confirmer"><button class="btn primary" onclick="vaultResetPassword()">Enregistrer</button></div>`}else vaultShow()}catch(e){toast('Code incorrect ou données indisponibles')}finally{vaultBusy=false}}

async function vaultResetPassword(){const pass=$('#vaultNewPass').value;if(pass.length<12||pass!==$('#vaultConfirm').value)return toast('Mot de passe invalide ou confirmation différente');try{const meta=await vaultGet('meta','config'),raw=await crypto.subtle.exportKey('raw',vaultKey);meta.pass=await vaultWrap(raw,pass);await vaultPut('meta',meta,'config');vaultShow();toast('Mot de passe remplacé')}catch(e){toast('Erreur de récupération')}}
async function vaultEncrypt(bytes){if(!vaultKey)throw Error('Coffre verrouillé');const iv=vaultRand(12);return {iv:vaultB64(iv),data:vaultB64(await crypto.subtle.encrypt({name:'AES-GCM',iv},vaultKey,bytes))}}

async function vaultImport(files){if(!vaultKey)return vaultStart();const key=vaultKey;for(const f of Array.from(files||[])){if(f.size>12*1024*1024){toast('Fichier trop volumineux (12 Mo maximum)');continue}try{const data=await vaultEncrypt(await f.arrayBuffer());if(vaultKey!==key)return;await vaultPut('files',{id:crypto.randomUUID(),name:f.name,type:f.type||'application/octet-stream',size:f.size,date:new Date().toLocaleDateString('fr-FR'),category:'Documents',...data})}catch(e){toast('Import impossible : stockage insuffisant ?');console.error(e)}}if(vaultKey)await vaultShow()}
async function vaultFile(id){const x=await vaultGet('files',id);if(!x)throw Error('Fichier introuvable');return {x,blob:new Blob([await vaultDecrypt(x)],{type:x.type})}}
function vaultSaveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function vaultPreview(id){try{const {x,blob}=await vaultFile(id);if(!/^(application\/pdf|image\/|text\/)/.test(x.type))return toast('Aperçu non disponible : télécharge le fichier');const url=URL.createObjectURL(blob);const win=window.open(url,'_blank');if(!win){vaultSaveBlob(blob,x.name);toast('Aperçu bloqué : fichier téléchargé')}setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){toast('Aperçu impossible')}}
async function vaultRename(id){const x=await vaultGet('files',id);if(!x)return;const name=prompt('Nom du document',x.name);if(name===null)return;const category=prompt('Catégorie',x.category||'Documents');if(category===null)return;x.name=name.trim()||x.name;x.category=category.trim()||'Documents';await vaultPut('files',x);vaultCategoryView=x.category;vaultShow()}
async function vaultDownload(id){try{const {x,blob}=await vaultFile(id);vaultSaveBlob(blob,x.name)}catch(e){toast('Téléchargement impossible')}}
async function vaultShare(id){try{const {x,blob}=await vaultFile(id),file=new File([blob],x.name,{type:x.type});if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:x.name})}else{vaultSaveBlob(blob,x.name);toast('Fichier téléchargé : joins-le à ton mail depuis Fichiers')}}catch(e){if(e.name!=='AbortError')toast('Partage indisponible')}}
async function vaultDelete(id){if(!confirm('Supprimer définitivement ce document ?'))return;await vaultRemove(id);vaultShow()}
async function vaultExport(){try{const meta=await vaultGet('meta','config'),files=await vaultAll();vaultSaveBlob(new Blob([JSON.stringify({format:'nexo-vault',version:1,meta,files})],{type:'application/json'}),'nexo-coffre-chiffre-'+new Date().toISOString().slice(0,10)+'.json');toast('Sauvegarde chiffrée téléchargée')}catch(e){toast('Export impossible')}}
async function vaultRestore(file){if(!file)return;try{const backup=JSON.parse(await file.text());if(backup.format!=='nexo-vault'||backup.version!==1||!backup.meta?.pass||!backup.meta?.recovery||!Array.isArray(backup.files))throw Error('Format invalide');const existing=await vaultAll();if(existing.length||await vaultGet('meta','config')){if(!confirm('La restauration remplacera tout le coffre-fort actuel, y compris son mot de passe et sa clé de récupération. Continuer ?'))return}const db=await vaultDb();await new Promise((resolve,reject)=>{const tx=db.transaction(['meta','files'],'readwrite');tx.objectStore('meta').put(backup.meta,'config');tx.objectStore('files').clear();for(const item of backup.files){if(!item.id||!item.data||!item.iv)throw Error('Document invalide');tx.objectStore('files').put(item)}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();vaultLock();vaultStart();toast('Sauvegarde restaurée : déverrouille avec les anciens identifiants')}catch(e){toast('Sauvegarde invalide ou restauration impossible');console.error(e)}}

function recipeSeedClassics(){if(get('nexoClassicRecipesSeeded267',false))return;const existing=get('nexoRecipes',[]);if(!Array.isArray(existing))return;const ids=new Set(existing.map(r=>r.id));const additions=NEXO_CLASSIC_RECIPES.filter(r=>!ids.has(r.id));try{put('nexoRecipes',[...existing,...additions]);put('nexoClassicRecipesSeeded267',true)}catch(e){console.warn('Impossible d’ajouter les recettes de démonstration',e)}}

function recipeList(){return get('nexoRecipes',[])}
function recipes(){recipeSeedClassics();recipeEditId=null;recipeHome()}
let recipeSelectedCategory=null;
const recipeCategories=[{name:'Entrée',label:'Entrées',icon:'🥗'},{name:'Plat',label:'Plats',icon:'🍝'},{name:'Dessert',label:'Desserts',icon:'🍰'},{name:'Cocktail',label:'Cocktails',icon:'🍹'},{name:'Boisson',label:'Boissons',icon:'☕'},{name:'Autre',label:'Autres',icon:'📖'}];
function recipeHome(){recipeSelectedCategory=null;recipeCategoryHome()}
function recipeCategoryHome(){const all=recipeList();const cats=recipeCategories.filter(c=>all.some(r=>r.category===c.name));content(`<div class="card stack recipe-home-actions"><h2>🍳 Mon livre de recettes</h2><button class="btn primary" onclick="recipeForm()">＋ Nouvelle recette</button><button class="btn" onclick="recipePasteForm()">📋 Coller une recette ou un lien</button><button class="btn" onclick="recipeExport()">Exporter mes recettes</button><label class="btn" style="text-align:center;cursor:pointer">Importer mes recettes<input type="file" accept="application/json,.json" style="display:none" onchange="recipeImport(this.files[0])"></label></div><div class="recipe-category-grid">${cats.map(c=>`<button class="recipe-category-tile" onclick="recipeOpenCategory('${c.name}')"><span class="recipe-cat-count">${all.filter(r=>r.category===c.name).length}</span><span class="recipe-cat-name">${c.icon} ${c.label}</span></button>`).join('')}</div>`)}
function recipeOpenCategory(cat){recipeSelectedCategory=cat;const c=recipeCategories.find(x=>x.name===cat);content(`<div class="card stack"><button class="btn" onclick="recipeHome()">← Toutes les catégories</button><h2>${c?c.icon+' '+c.label:esc(cat)}</h2><input class="field" id="recipeSearch" type="search" placeholder="Rechercher une recette ou un ingrédient…" oninput="recipeFilter()"></div><div id="recipeResults"></div>`);recipeFilter()}
function recipeFilter(){const q=($('#recipeSearch')?.value||'').trim().toLocaleLowerCase('fr');const target=$('#recipeResults');if(!target)return;target.innerHTML=recipeList().filter(r=>(!recipeSelectedCategory||r.category===recipeSelectedCategory)&&(r.title+' '+r.ingredients.map(i=>i.name).join(' ')).toLocaleLowerCase('fr').includes(q)).map(r=>`<div class="card stack"><div class="row"><strong class="grow">${esc(r.title)}</strong><button class="btn" onclick="recipeView('${r.id}')">Voir →</button></div><small>${esc(r.category||'Plat')} · ${r.servings} portions · ${r.minutes||0} min ${r.favorite?'· ★':''}</small></div>`).join('')||'<div class="card">Aucune recette trouvée.</div>'}

function recipeForm(id){recipeEditId=id||null;const r=recipeList().find(x=>x.id===id)||{title:'',category:'Plat',servings:2,minutes:30,ingredients:[],steps:[],photo:'',favorite:false};content(`<div class="card stack"><h2>${id?'Modifier':'Nouvelle'} recette</h2><label>Nom<input class="field" id="recipeTitle" value="${esc(r.title)}"></label><label>Catégorie<select class="field" id="recipeCategory">${['Entrée','Plat','Dessert','Cocktail','Boisson','Autre'].map(x=>`<option ${x===r.category?'selected':''}>${x}</option>`).join('')}</select></label><div class="two"><label>Portions<input class="field" id="recipeServings" type="number" min="1" value="${r.servings}"></label><label>Durée (min)<input class="field" id="recipeMinutes" type="number" min="0" value="${r.minutes||0}"></label></div><label>Ingrédients (une ligne par ingrédient : quantité | unité | nom)<textarea class="field" id="recipeIngredients" rows="7" placeholder="200 | g | farine&#10;2 | pièce | œufs">${esc(r.ingredients.map(i=>[i.qty,i.unit,i.name].join(' | ')).join('\n'))}</textarea></label><label>Étapes (une étape par ligne)<textarea class="field" id="recipeSteps" rows="7">${esc(r.steps.join('\n'))}</textarea></label><label>Photo depuis l'iPhone<input class="field" type="file" accept="image/*" id="recipePhoto"></label><label><input type="checkbox" id="recipeFavorite" ${r.favorite?'checked':''}> Favori</label><button class="btn primary" onclick="recipeSave()">Enregistrer</button><button class="btn" onclick="recipes()">Annuler</button></div>`)}
async function recipeSave(){const title=$('#recipeTitle').value.trim(),servings=Number($('#recipeServings').value);if(!title||!Number.isFinite(servings)||servings<1)return toast('Nom et portions obligatoires');const a=recipeList(),old=a.find(x=>x.id===recipeEditId),file=$('#recipePhoto').files[0];let photo=old?.photo||'';if(file){if(file.size>1500000)return toast('Photo trop volumineuse (1,5 Mo maximum)');photo=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}const ingredients=$('#recipeIngredients').value.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const p=line.split('|').map(x=>x.trim());return p.length>=3?{qty:Number(p[0].replace(',','.'))||0,unit:p[1],name:p.slice(2).join(' | ')}:{qty:0,unit:'',name:line}});const item={id:recipeEditId||crypto.randomUUID(),title,category:$('#recipeCategory').value,servings,minutes:Number($('#recipeMinutes').value)||0,ingredients,steps:$('#recipeSteps').value.split('\n').map(x=>x.trim()).filter(Boolean),favorite:$('#recipeFavorite').checked,photo};put('nexoRecipes',[item,...a.filter(x=>x.id!==item.id)]);recipeView(item.id);toast('Recette enregistrée')}
function recipeView(id){recipeTimerStop();const r=recipeList().find(x=>x.id===id);if(!r)return recipes();content(`<div class="card stack"><button class="btn" onclick="recipes()">← Mes recettes</button>${r.photo?`<div class="recipe-photo-wrap"><img src="${r.photo}" alt="Photo de ${esc(r.title)}" style="max-width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block"><button class="recipe-photo-remove" onclick="recipeRemovePhoto('${id}')" aria-label="Supprimer la photo">✕ Photo</button></div>`:''}<h2>${esc(r.title)}</h2><p class="muted">${esc(r.category)} · ${r.minutes||0} min</p><div class="row"><button class="btn primary" onclick="recipeCook('${id}',0)">👨‍🍳 Mode Cuisine</button><button class="btn" onclick="recipeForm('${id}')">Modifier</button></div><label>Nombre de portions<input class="field" id="recipePortions" type="number" style="width:33.333%;max-width:100%;margin-top:4px;display:block" min="1" value="${r.servings}" oninput="recipeScale('${id}')"></label><div id="recipeScaled"></div><h3>Préparation</h3>${r.steps.map((x,i)=>`<p>${i+1}. ${esc(x)}</p>`).join('')}<button class="btn" onclick="recipeToShopping('${id}')">🛒 Ajouter les ingrédients aux courses</button><button class="btn danger" onclick="recipeDelete('${id}')">Supprimer</button></div>`);recipeScale(id)}
function recipeRemovePhoto(id){const a=recipeList(),r=a.find(x=>x.id===id);if(!r||!r.photo)return;if(!confirm('Supprimer la photo de cette recette ?'))return;r.photo='';try{put('nexoRecipes',a);recipeView(id);toast('Photo supprimée')}catch(e){toast('Impossible de supprimer la photo')}}
function recipeScale(id){const r=recipeList().find(x=>x.id===id),n=Number($('#recipePortions')?.value)||r.servings;$('#recipeScaled').innerHTML='<h3>Ingrédients</h3>'+r.ingredients.map(i=>`<p>• ${i.qty?esc(String(Math.round(i.qty*n/r.servings*100)/100))+' ':''}${esc(i.unit)} ${esc(i.name)}</p>`).join('')}
function recipeToShopping(id){const r=recipeList().find(x=>x.id===id);if(!r)return;const n=Number($('#recipePortions')?.value)||r.servings,items=get('shopping',[]);for(const i of r.ingredients)items.push({id:crypto.randomUUID(),text:`${i.qty?Math.round(i.qty*n/r.servings*100)/100+' ':''}${i.unit} ${i.name}`.trim(),done:false});put('shopping',items);toast('Ingrédients ajoutés à la liste de courses')}
function recipeDelete(id){if(!confirm('Supprimer cette recette ?'))return;put('nexoRecipes',recipeList().filter(x=>x.id!==id));recipes()}
function recipeCook(id,step){const r=recipeList().find(x=>x.id===id);if(!r)return;recipeCookingStep=Math.max(0,Math.min(step,r.steps.length-1));content(`<div class="card stack"><button class="btn recipe-cook-back" onclick="recipeView('${id}')">← Retour aux recettes</button><h2>👨‍🍳 ${esc(r.title)}</h2><p class="muted">Étape ${r.steps.length?recipeCookingStep+1:0} / ${r.steps.length}</p><div style="font-size:22px;line-height:1.5;padding:24px 0">${esc(r.steps[recipeCookingStep]||'Aucune étape')}</div><div class="row"><button class="btn" ${recipeCookingStep===0?'disabled':''} onclick="recipeCook('${id}',${recipeCookingStep-1})">← Précédent</button><button class="btn primary" ${recipeCookingStep>=r.steps.length-1?'disabled':''} onclick="recipeCook('${id}',${recipeCookingStep+1})">Suivant →</button></div><details><summary>Voir les ingrédients</summary>${r.ingredients.map(i=>`<p>${esc(i.qty+' '+i.unit+' '+i.name)}</p>`).join('')}</details><div class="recipe-timer-line"><label>Minuteur (minutes)<input class="field" type="number" min="1" id="recipeTimerMins" value="5"></label><strong id="recipeTimerDisplay" class="recipe-timer-clock" role="timer" aria-live="off">00:00</strong></div><div class="row"><button class="btn" onclick="recipeTimerStart()">Lancer le minuteur</button><button class="btn" onclick="recipeTimerStop()">Arrêter le minuteur</button></div><button class="btn" onclick="recipeView('${id}')">Terminer le mode Cuisine</button></div>`);if(recipeTimerHandle)$('#recipeTimerDisplay').textContent=Math.floor(recipeSeconds/60)+':'+String(recipeSeconds%60).padStart(2,'0')}
function recipeTimerStop(){if(recipeTimerHandle!==null){clearInterval(recipeTimerHandle);recipeTimerHandle=null}recipeSeconds=0;const el=$('#recipeTimerDisplay');if(el)el.textContent='00:00'}
function recipeTimerStart(){const mins=Number($('#recipeTimerMins').value);if(!Number.isFinite(mins)||mins<=0||mins>240)return toast('Choisis entre 1 et 240 minutes');clearInterval(recipeTimerHandle);recipeSeconds=Math.round(mins*60);$('#recipeTimerDisplay').textContent=Math.floor(recipeSeconds/60)+':'+String(recipeSeconds%60).padStart(2,'0');recipeTimerHandle=setInterval(()=>{recipeSeconds--;const el=$('#recipeTimerDisplay');if(el)el.textContent=Math.floor(recipeSeconds/60)+':'+String(recipeSeconds%60).padStart(2,'0');if(recipeSeconds<=0){clearInterval(recipeTimerHandle);recipeTimerHandle=null;recipeSeconds=0;alert('⏰ Minuteur de cuisine terminé !')}},1000)}
function recipeExport(){vaultSaveBlob(new Blob([JSON.stringify({format:'nexo-recipes',version:1,recipes:recipeList()})],{type:'application/json'}),'nexo-recettes-'+new Date().toISOString().slice(0,10)+'.json')}
async function recipeImport(file){if(!file)return;try{const o=JSON.parse(await file.text());if(o.format!=='nexo-recipes'||!Array.isArray(o.recipes))throw Error();const a=recipeList(),ids=new Set(a.map(x=>x.id));for(const r of o.recipes){if(typeof r.title!=='string'||!Array.isArray(r.ingredients)||!Array.isArray(r.steps))throw Error();a.push({...r,id:ids.has(r.id)?crypto.randomUUID():r.id||crypto.randomUUID()})}put('nexoRecipes',a);recipes();toast('Recettes importées')}catch(e){toast('Fichier de recettes invalide ou stockage insuffisant')}}
function recipePasteForm(){content(`<div class="card stack"><h2>📋 Coller une recette</h2><p class="muted">Colle le texte de la recette. Un lien URL peut être tenté en ligne, si le site autorise l'accès.</p><textarea id="recipePasteText" class="field" rows="10" placeholder="Titre, ingrédients, préparation… ou https://..."></textarea><button class="btn primary" onclick="recipePaste()">Analyser la recette</button><button class="btn" onclick="recipes()">Annuler</button></div>`)}
async function recipePaste(){let t=$('#recipePasteText').value.trim();if(!t)return;if(/^https?:\/\//i.test(t)){try{const u=new URL(t);if(!['http:','https:'].includes(u.protocol))throw Error();const res=await fetch(u.href);if(!res.ok)throw Error();const html=await res.text(),doc=new DOMParser().parseFromString(html,'text/html');const script=[...doc.querySelectorAll('script[type="application/ld+json"]')].map(x=>{try{return JSON.parse(x.textContent)}catch{return null}}).filter(Boolean);let obj=null;function find(o){if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(find);return}if((o['@type']==='Recipe'||(Array.isArray(o['@type'])&&o['@type'].includes('Recipe')))&&!obj)obj=o;Object.values(o).forEach(v=>{if(typeof v==='object')find(v)})}script.forEach(find);if(!obj)throw Error();const steps=(obj.recipeInstructions||[]).map(x=>typeof x==='string'?x:x.text||'').filter(Boolean);recipeForm();$('#recipeTitle').value=obj.name||'';$('#recipeIngredients').value=(obj.recipeIngredient||[]).join('\n');$('#recipeSteps').value=steps.join('\n');toast('Recette récupérée : vérifie les champs');return}catch(e){toast('Import automatique bloqué : colle le texte de la recette');return}}const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);recipeForm();$('#recipeTitle').value=lines[0]||'';let marker=lines.findIndex(x=>/^(préparation|instructions|étapes|méthode)\s*:?$/i.test(x));let ing=lines.findIndex(x=>/^ingrédients\s*:?$/i.test(x));if(ing>=0){$('#recipeIngredients').value=lines.slice(ing+1,marker>=0?marker:undefined).map(x=>x.replace(/^[-•*]\s*/,'' )).join('\n')}if(marker>=0)$('#recipeSteps').value=lines.slice(marker+1).map(x=>x.replace(/^\d+[.)]\s*/,'' )).join('\n');if(ing<0&&marker<0)$('#recipeSteps').value=lines.slice(1).join('\n');toast('Texte importé : vérifie ingrédients et étapes')}

</script></body></html>
