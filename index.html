 const a=parse(date),b=parse(today);return Number.isFinite(a)&&Number.isFinite(b)?Math.round((a-b)/86400000):0;
}
function gen262NextTrip(){
 const today=expenseToday();return travelStore().filter(t=>t&&/^\d{4}-\d{2}-\d{2}$/.test(String(t.start||''))&&String(t.end||t.start)>=today).sort((a,b)=>String(a.start).localeCompare(String(b.start)))[0]||null;
}
function gen2Data(id){
 try{
 if(id==='savings'){const accounts=saveAccounts();return {value:accounts.length?money(saveAllBalance(expenseToday())):'Aucune donnée',sub:accounts.length+' support(s) enregistré(s)',empty:!accounts.length}}
 if(id==='expenses'){const month=expenseToday().slice(0,7);const rows=get('expenses',[]);const list=Array.isArray(rows)?rows:[];const sum=list.filter(x=>expenseDateISO(x.date).startsWith(month)).reduce((v,x)=>v+gen2SafeNumber(x.amount),0);return {value:money(sum),sub:'Total du mois en cours'}}
 if(id==='nutrition'){const today=expenseToday(),list=nutritionItems().filter(x=>x.date===today),total=nutritionTotals(list),target=nutritionTargets().calories;return {value:Math.round(total.kcal).toLocaleString('fr-FR')+' kcal',sub:Math.round(target)+' kcal d’objectif · '+list.length+' repas'}}
 if(id==='travel'){const future=gen262NextTrip();if(!future)return {value:'Aucun voyage',sub:'Créer un voyage'};const days=gen262DaysUntil(future.start);return {value:days>0?'J-'+days:days===0?'Départ aujourd’hui':'En cours',sub:future.name||future.destination||'Prochain séjour'}}
 if(id==='garage'){
  const vehicles=garageVehicles();let due=0,soon=0;
  for(const vehicle of vehicles){for(const plan of garagePlansFor(vehicle.id)){
   const status=garageStatus(plan,vehicle).state;
   if(status==='late')due++;else if(status==='soon')soon++;
  }}
  return {value:due+' entretien'+(due>1?'s':'')+' à faire',sub:soon?soon+' entretien'+(soon>1?'s':'')+' à prévoir prochainement':(vehicles.length?vehicles.length+' véhicule'+(vehicles.length>1?'s':'')+' suivi'+(vehicles.length>1?'s':''):'Aucun véhicule enregistré')};
 }
 if(id==='todo'){const tasks=get('tasks',[]),list=Array.isArray(tasks)?tasks:[];return {value:String(list.filter(x=>!x.done).length),sub:'Tâches restantes'} }
 }catch(e){return {value:'—',sub:'Données indisponibles'}}
 return {value:'—',sub:''}
}
function gen2Card(id){

 if(id==='garage'){
  const vehicles=garageVehicles();let due=0,soon=0;

 }

 <span class="gen2-widget-sub">${hidden?'Montant masqué':esc(d.sub)}</span>
 <span class="gen2-widget-arrow">↗</span></button></article>`;
}
function gen26UpcomingTrip(){

 if(!upcoming)return `<div class="gen26-trip-empty">Aucun séjour à venir. <button type="button" onclick="openTool('travel')">Préparer un voyage →</button></div>`;
 const days=gen262DaysUntil(upcoming.start);
 const badge=days===0?'Départ aujourd’hui':days>0?'Départ dans '+days+' jour'+(days>1?'s':''):'Séjour en cours';
 const duration=travelDateDays(upcoming.start,upcoming.end||upcoming.start);
 const destinations=String(upcoming.destination||'').split(/[,·;]/).filter(x=>x.trim()).length;
 const reservations=Array.isArray(upcoming.bookings)?upcoming.bookings.length:0;
 const cover=typeof upcoming.cover==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(upcoming.cover)?`<img src="${upcoming.cover}" class="gen262-trip-image" alt="Couverture du voyage">`:'<span class="gen262-trip-plane" aria-hidden="true">✈</span>';
 return `<button type="button" class="gen262-trip-card" onclick="gen26OpenTrip('${esc(upcoming.id)}')" aria-label="Ouvrir le voyage ${esc(upcoming.name||'à venir')}">
 <span class="gen262-trip-cover">${cover}</span>
 <span class="gen262-trip-title-row"><strong>${esc(upcoming.name||'Mon prochain voyage')}</strong><span class="gen262-trip-badge">${esc(badge)}</span></span>
 <span class="gen262-trip-dates">${esc(nexoDisplayDate(upcoming.start))} – ${esc(nexoDisplayDate(upcoming.end||upcoming.start))} · ${duration} jours</span>
 <span class="gen262-trip-destination">⌖ ${esc(upcoming.destination||'Destination à définir')}</span>

 </button>`;
}

let expr='';function calc(){expr='';content(`<div class="card"><div class="calc-display" id="display">0</div><div class="calc-grid">${['AC','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(k=>`<button class="${'+−×÷%'.includes(k)?'op':k==='='?'eq':''}" onclick="calcPress('${k}')">${k}</button>`).join('')}</div></div>`)}function calcPress(k){if(k==='AC')expr='';else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='='){try{let s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if(!/^[\d+\-*/().\s]+$/.test(s))throw Error();let v=Function('"use strict";return ('+s+')')();if(!Number.isFinite(v))throw Error();expr=String(Math.round(v*1e10)/1e10)}catch{expr='Erreur'}}else if(k==='±'){expr=expr.startsWith('−')?expr.slice(1):'−'+expr}else expr+=(k==='%'?'%':k);$('#display').textContent=expr||'0'}
const units={Longueur:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},Masse:{kg:1,g:.001,lb:.45359237,oz:.028349523125},Volume:{L:1,mL:.001,'m³':1000,'gal (US)':3.785411784},Surface:{'m²':1,'km²':1e6,ha:1e4,'ft²':.09290304},Vitesse:{'km/h':1,'m/s':3.6,mph:1.609344},Température:{'°C':1,'°F':1,K:1}};let category='Longueur';function convert(){content(`<div class="tabs" id="cats">${Object.keys(units).map(c=>`<button onclick="category='${c}';convert()" class="${c===category?'active':''}">${c}</button>`).join('')}</div><div class="card stack"><label>Valeur à convertir</label><input class="field" id="v" inputmode="decimal" value="1" oninput="conversion()"><div class="two"><select class="field" id="from" onchange="conversion()"></select><select class="field" id="to" onchange="conversion()"></select></div><div class="result" id="converted"></div></div>`);let opts=Object.keys(units[category]);for(let id of ['from','to'])$('#'+id).innerHTML=opts.map(o=>`<option>${o}</option>`).join('');$('#to').selectedIndex=1;conversion()}function conversion(){let v=num($('#v').value),a=$('#from').value,b=$('#to').value,r;if(category==='Température'){let c=a==='°C'?v:a==='°F'?(v-32)*5/9:v-273.15;r=b==='°C'?c:b==='°F'?c*9/5+32:c+273.15}else r=v*units[category][a]/units[category][b];$('#converted').textContent=fmt(r)+' '+b}

function notes(){content(`<div class="card stack"><input class="field" id="noteTitle" placeholder="Titre de la note"><textarea class="field" id="noteBody" placeholder="Écris ta note…"></textarea><button class="btn primary" onclick="saveNote()">Enregistrer la note</button></div><div class="card"><input id="notesSearch" type="search" class="field" placeholder="🔎 Rechercher dans les notes…" oninput="drawNotes()" aria-label="Rechercher dans les titres et contenus"></div><div id="notelist"></div>`);drawNotes()}function saveNote(){let title=$('#noteTitle').value.trim(),body=$('#noteBody').value.trim();if(!title&&!body)return;let a=get('notes',[]);a.unshift({id:crypto.randomUUID(),title:title||'Sans titre',body,created:new Date().toLocaleDateString('fr-FR')});put('notes',a);$('#noteTitle').value='';$('#noteBody').value='';drawNotes();toast('Note enregistrée')}function drawNotes(){$('#notelist').innerHTML=get('notes',[]).filter(n=>{const q=($('#notesSearch')?.value||'').trim().toLocaleLowerCase('fr');return !q||(n.title+' '+n.body).toLocaleLowerCase('fr').includes(q)}).map(n=>`<div class="card"><div class="row"><strong class="grow">${esc(n.title)}</strong><button class="btn" onclick="editNote('${n.id}')">Modifier</button><button class="btn danger" onclick="deleteNote('${n.id}')">×</button></div><p class="small">${esc(nexoDisplayDate(n.created))}</p><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.body)}</div></div>`).join('')||'<p>Pas encore de notes.</p>'}function editNote(id){let a=get('notes',[]),n=a.find(x=>x.id===id);if(!n)return;$('#noteTitle').value=n.title;$('#noteBody').value=n.body;put('notes',a.filter(x=>x.id!==id));drawNotes();scrollTo({top:0,behavior:'smooth'})}function deleteNote(id){if(confirm('Supprimer cette note ?')){put('notes',get('notes',[]).filter(n=>n.id!==id));drawNotes()}}
function percent(){content(`<div class="pct-block"><h3>Quel pourcentage représente X de Y ?</h3><div class="two"><div><label>X</label><input class="field" id="pctX1" type="number" inputmode="decimal" value="25" oninput="updatePct()"></div><div><label>Y</label><input class="field" id="pctY1" type="number" inputmode="decimal" value="200" oninput="updatePct()"></div></div><div class="pct-answer" id="pctResult1"></div></div><div class="pct-block"><h3>Combien vaut X % de Y ?</h3><div class="two"><div><label>X (%)</label><input class="field" id="pctX2" type="number" inputmode="decimal" value="20" oninput="updatePct()"></div><div><label>Y</label><input class="field" id="pctY2" type="number" inputmode="decimal" value="150" oninput="updatePct()"></div></div><div class="pct-answer" id="pctResult2"></div></div><div class="pct-block"><h3>Quelle évolution en % de X à Y ?</h3><div class="two"><div><label>Valeur initiale X</label><input class="field" id="pctX3" type="number" inputmode="decimal" value="80" oninput="updatePct()"></div><div><label>Valeur finale Y</label><input class="field" id="pctY3" type="number" inputmode="decimal" value="100" oninput="updatePct()"></div></div><div class="pct-answer" id="pctResult3"></div></div>`);updatePct()}
function updatePct(){const a=Number($('#pctX1').value),b=Number($('#pctY1').value),c=Number($('#pctX2').value),d=Number($('#pctY2').value),e=Number($('#pctX3').value),f=Number($('#pctY3').value);$('#pctResult1').textContent=b===0?'Division par zéro impossible':`${fmt(a)} représente ${fmt(a/b*100)} % de ${fmt(b)}`;$('#pctResult2').textContent=`${fmt(c)} % de ${fmt(d)} = ${fmt(c*d/100)}`;let diff=e===0?'Évolution en % non définie si X = 0':`${fmt((f-e)/Math.abs(e)*100)} % (${f>=e?'hausse':'baisse'} de ${fmt(Math.abs(f-e))})`;$('#pctResult3').textContent=diff}
function msfmt(ms){let t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}function chrono(){chronoRunning=false;chronoElapsed=0;content(`<div class="card"><h2>Chronomètre</h2><div class="big" id="chrono">00:00:00</div><div class="row"><button class="btn primary grow" id="chronoBtn" onclick="toggleChrono()">Démarrer</button><button class="btn" onclick="resetChrono()">Réinitialiser</button></div></div>`);clock=setInterval(tick,200)}
function timer(){timerRunning=false;timerRemaining=0;content(`<div class="card"><h2>Minuteur</h2><div class="two"><div><label>Minutes</label><input class="field" id="mins" type="number" min="0" value="5" inputmode="numeric"></div><div><label>Secondes</label><input class="field" id="secs" type="number" min="0" max="59" value="0" inputmode="numeric"></div></div><div class="big" id="countdown">00:05:00</div><div class="row"><button class="btn primary grow" id="timerBtn" onclick="toggleTimer()">Démarrer</button><button class="btn" onclick="resetTimer()">Réinitialiser</button></div><p class="muted">Laisse l'application ouverte pour recevoir l'alerte de fin.</p></div>`);$('#mins').oninput=$('#secs').oninput=()=>{if(!timerRunning)$('#countdown').textContent=msfmt((num($('#mins').value)*60+num($('#secs').value))*1000)};clock=setInterval(tick,200)}
function tick(){if(current==='chrono'&&chronoRunning){$('#chrono').textContent=msfmt(chronoElapsed+Date.now()-chronoStart)}if(current==='timer'&&timerRunning){timerRemaining=Math.max(0,timerEnd-Date.now());$('#countdown').textContent=msfmt(timerRemaining);if(!timerRemaining){timerRunning=false;$('#timerBtn').textContent='Démarrer';toast('Minuteur terminé !');if(navigator.vibrate)navigator.vibrate([200,100,200]);alert('⏰ Minuteur terminé !')}}}
function toggleChrono(){if(chronoRunning){chronoElapsed+=Date.now()-chronoStart;chronoRunning=false}else{chronoStart=Date.now();chronoRunning=true}$('#chronoBtn').textContent=chronoRunning?'Pause':'Démarrer'}function resetChrono(){chronoRunning=false;chronoElapsed=0;$('#chrono').textContent='00:00:00';$('#chronoBtn').textContent='Démarrer'}function toggleTimer(){if(timerRunning){timerRemaining=Math.max(0,timerEnd-Date.now());timerRunning=false}else{if(!timerRemaining)timerRemaining=(num($('#mins').value)*60+num($('#secs').value))*1000;if(timerRemaining<=0)return toast('Choisis une durée');timerEnd=Date.now()+timerRemaining;timerRunning=true}$('#timerBtn').textContent=timerRunning?'Pause':'Reprendre'}function resetTimer(){timerRunning=false;timerRemaining=0;$('#timerBtn').textContent='Démarrer';$('#countdown').textContent=msfmt((num($('#mins').value)*60+num($('#secs').value))*1000)}
function password(){content(`<div class="card stack"><label>Longueur : <strong id="pwlen">20</strong> caractères</label><input id="len" type="range" min="8" max="64" value="20" oninput="$('#pwlen').textContent=this.value;generatePassword()"><label><input id="symbols" type="checkbox" checked onchange="generatePassword()"> Inclure des symboles</label><label><input id="digits" type="checkbox" checked onchange="generatePassword()"> Inclure des chiffres</label><button class="btn primary" onclick="generatePassword()">Générer</button><textarea class="field" id="pwout" readonly style="min-height:90px"></textarea><label>Force estimée : <strong id="strengthLabel"></strong></label><div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div><p class="exp-muted" id="strengthInfo"></p><button class="btn" onclick="copyText($('#pwout').value)">Copier le mot de passe</button><p class="muted">Génération locale cryptographiquement aléatoire. La jauge est une estimation, pas une garantie de sécurité.</p></div>`);generatePassword()}
function generatePassword(){let chars='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ'+($('#digits').checked?'23456789':'')+($('#symbols').checked?'!@#$%&*?_-+=':'');let arr=new Uint32Array(Number($('#len').value)),max=Math.floor(4294967296/chars.length)*chars.length,s='';while(s.length<arr.length){crypto.getRandomValues(arr);for(let x of arr){if(x<max)s+=chars[x%chars.length];if(s.length===arr.length)break}}$('#pwout').value=s;updatePasswordStrength(s,chars.length)}
function updatePasswordStrength(s,alphabet){const bits=s.length*Math.log2(alphabet),tier=bits<50?0:bits<75?1:bits<110?2:3;const labels=['Faible','Moyenne','Forte','Très forte'],colors=['#e74c3c','#f59e0b','#3b82f6','#16a34a'];$('#strengthLabel').textContent=labels[tier];$('#strengthLabel').style.color=colors[tier];$('#strengthFill').style.width=[25,50,75,100][tier]+'%';$('#strengthFill').style.background=colors[tier];$('#strengthInfo').textContent=`Environ ${Math.round(bits)} bits d’entropie théorique pour un mot de passe généré aléatoirement.`}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Copié !')}catch{toast('Copie indisponible')}}
function colors(){content(`<div class="card stack"><label>Choisis une couleur</label><input id="picker" type="color" class="field" value="#2584f9" oninput="showColor()"><div class="swatch" id="swatch"></div><label>HEX</label><div class="row"><input class="field grow" id="hex" value="#2584F9" oninput="hexColor()"><button class="btn" onclick="copyText($('#hex').value)">Copier</button></div><label>RGB</label><div class="row"><input class="field grow" id="rgb" readonly><button class="btn" onclick="copyText($('#rgb').value)">Copier</button></div></div>`);showColor()}function showColor(){let h=$('#picker').value.toUpperCase();$('#hex').value=h;$('#swatch').style.background=h;$('#rgb').value='rgb('+[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(', ')+')'}function hexColor(){let h=$('#hex').value;if(/^#[0-9a-fA-F]{6}$/.test(h)){$('#picker').value=h;showColor()}}
const defaultExpenseCategories=['Courses','Transport','Loisirs','Maison','Autre'];
function expenseCategories(){const removed=get('removedExpenseCategories',[]);return [...new Set([...defaultExpenseCategories.filter(c=>!removed.includes(c)),...get('expenseCategories',[]),...get('expenses',[]).map(x=>x.category).filter(Boolean)])]}

const SAVE_TYPES=['Actions / PEA','Compte-titres','Assurance-vie','Livret A','LDDS','PEE','PER','Autre'];
let saveYear=new Date().getFullYear(),saveMonth=new Date().getMonth(),saveFilter='all',saveMode='monthly';
function saveAccounts(){return get('savingsAccounts',[])}
function saveMovements(){return get('savingsMovements',[])}
function saveAccountBalance(id,cutoff='9999-12-31'){const a=saveAccounts().find(x=>x.id===id);if(!a)return 0;const init=(!a.date||a.date<=cutoff)?Number(a.initial)||0:0;const movements=saveMovements().filter(x=>x.accountId===id&&x.date<=cutoff);return init+movements.reduce((v,x)=>v+(Number(x.amount)||0),0)}
function saveAllBalance(cutoff){return saveAccounts().reduce((v,a)=>v+saveAccountBalance(a.id,cutoff),0)}
function saveAddAccount(){const name=$('#saveAccountName').value.trim(),type=$('#saveAccountType').value,initial=Number($('#saveAccountInitial').value||0),date=$('#saveAccountDate').value;if(!name||!date||!Number.isFinite(initial)||initial<0)return toast('Vérifie les champs du support');put('savingsAccounts',[...saveAccounts(),{id:crypto.randomUUID(),name,type,initial,date}]);savings();toast('Support créé')}
function saveAddMovement(){const accountId=$('#saveMoveAccount').value,amount=Number($('#saveMoveAmount').value),date=$('#saveMoveDate').value,kind=$('#saveMoveKind').value;if(!accountId||!date||!Number.isFinite(amount)||amount<=0)return toast('Vérifie les champs');if(kind==='withdraw'&&saveAccountBalance(accountId,date)<amount)return toast('Solde insuffisant');const value=kind==='withdraw'?-amount:amount;put('savingsMovements',[...saveMovements(),{id:crypto.randomUUID(),accountId,amount:value,date,kind,note:$('#saveMoveNote').value.trim()}]);savings();toast('Opération enregistrée')}
function saveEditInitial(id){const a=saveAccounts().find(x=>x.id===id);if(!a)return;const raw=prompt('Versement initial (€)',String(Number(a.initial)||0));if(raw===null)return;const amount=Number(raw.trim().replace(',','.'));if(!Number.isFinite(amount)||amount<0)return toast('Montant initial invalide');const date=prompt('Date du versement initial (AAAA-MM-JJ)',a.date||expenseToday());if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime())||new Date(date+'T12:00:00').toISOString().slice(0,10)!==date)return toast('Date invalide');put('savingsAccounts',saveAccounts().map(x=>x.id===id?{...x,initial:amount,date}:x));savings(true);toast('Versement initial modifié')}
function saveDeleteInitial(id){const a=saveAccounts().find(x=>x.id===id);if(!a)return;if(!confirm('Supprimer le versement initial de « '+a.name+' » ? Le support et ses autres opérations seront conservés.'))return;put('savingsAccounts',saveAccounts().map(x=>x.id===id?{...x,initial:0}:x));savings(true);toast('Versement initial supprimé')}
function saveDeleteMovement(id){if(!confirm('Supprimer cette opération ?'))return;put('savingsMovements',saveMovements().filter(x=>x.id!==id));savings()}
function saveTransfer(){const from=$('#saveTransferFrom').value,to=$('#saveTransferTo').value,amount=Number($('#saveTransferAmount').value),date=$('#saveTransferDate').value;if(!from||!to||from===to||!date||!Number.isFinite(amount)||amount<=0)return toast('Transfert invalide');if(saveAccountBalance(from,date)<amount)return toast('Solde insuffisant');const id=crypto.randomUUID();put('savingsMovements',[...saveMovements(),{id:id+'a',accountId:from,amount:-amount,date,kind:'transfer',group:id,note:'Transfert sortant'},{id:id+'b',accountId:to,amount,date,kind:'transfer',group:id,note:'Transfert entrant'}]);savings();toast('Transfert effectué')}
function saveValuation(){const id=$('#saveValueAccount').value,value=Number($('#saveValueAmount').value),date=$('#saveValueDate').value;if(!id||!date||!Number.isFinite(value)||value<0)return toast('Valorisation invalide');const diff=Math.round((value-saveAccountBalance(id,date))*100)/100;if(!diff)return toast('Valeur déjà à jour');put('savingsMovements',[...saveMovements(),{id:crypto.randomUUID(),accountId:id,amount:diff,date,kind:'valuation',note:'Valorisation manuelle'}]);savings();toast('Valorisation enregistrée')}
function saveEditMovement(id){const x=saveMovements().find(m=>m.id===id);if(!x)return;if(x.kind==='transfer')return toast('Pour corriger un transfert, supprime-le puis recrée-le');const amount=prompt('Montant (€)',String(Math.abs(x.amount)));if(amount===null)return;const n=Number(amount.replace(',','.'));if(!Number.isFinite(n)||n<=0)return toast('Montant invalide');const date=prompt('Date (AAAA-MM-JJ)',x.date);if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Date invalide');put('savingsMovements',saveMovements().map(m=>m.id===id?{...m,amount:x.amount<0?-n:n,date}:m));savings()}
function saveSetYear(v){saveYear=Number(v);savings(true)}
function saveSetMonth(v){saveMonth=Number(v);savings(true)}
function saveSetMode(v){saveMode=v;savings(true)}
function saveSetFilter(v){saveFilter=v;savings(true)}
function savings(preservePosition=false){
const savingsScrollY=preservePosition?window.scrollY:0;
const savingsRender=preservePosition?(html)=>{document.querySelector('#tool').innerHTML=html;window.scrollTo({top:savingsScrollY,left:0,behavior:'instant'});}:content;
const accounts=saveAccounts(),moves=saveMovements(),today=expenseToday(),months=expenseMonthNames;
const years=[...new Set([new Date().getFullYear(),saveYear,...moves.map(m=>Number(m.date.slice(0,4))),...accounts.map(a=>Number(a.date.slice(0,4))||new Date().getFullYear())])].sort((a,b)=>b-a);
const inScope=m=>saveFilter==='all'||m.accountId===saveFilter;
const monthly=Array.from({length:12},(_,i)=>{const period=String(saveYear)+'-'+String(i+1).padStart(2,'0');const mm=moves.filter(m=>m.date.startsWith(period)&&inScope(m)&&m.kind!=='transfer'&&m.kind!=='valuation');return {in:mm.filter(m=>m.amount>0).reduce((v,m)=>v+m.amount,0),out:-mm.filter(m=>m.amount<0).reduce((v,m)=>v+m.amount,0)}});
const allYear=years.slice().sort((a,b)=>a-b);
const capitalMonths=Array.from({length:12},(_,i)=>{const cutoff=`${saveYear}-${String(i+1).padStart(2,'0')}-31`;return saveFilter==='all'?saveAllBalance(cutoff):saveAccountBalance(saveFilter,cutoff)});
const capital=saveMode==='monthly'?capitalMonths:allYear.map(y=>{const cutoff=`${y}-12-31`;return saveFilter==='all'?saveAllBalance(cutoff):saveAccountBalance(saveFilter,cutoff)});
const chart=saveMode==='monthly'?monthly.map(m=>m.in-m.out):allYear.map(y=>{const mm=moves.filter(m=>m.date.startsWith(String(y))&&inScope(m)&&!['transfer','valuation'].includes(m.kind));return mm.reduce((v,m)=>v+m.amount,0)});
const max=Math.max(1,...chart.map(Math.abs));
// Historique synchronisé avec l'année et le support sélectionnés, sans suppression des données.
const historyMovements=moves.filter(inScope).map(m=>({...m,historyType:'movement'}));
const historyInitial=accounts.filter(a=>saveFilter==='all'||a.id===saveFilter).map(a=>({id:a.id,accountId:a.id,amount:Number(a.initial)||0,date:a.date||'',kind:'initial',note:'Solde initial du support',historyType:'initial'}));
const historyAll=[...historyMovements,...historyInitial];
const visible=historyAll.filter(m=>String(m.date||'').slice(0,4)===String(saveYear)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||(a.historyType==='initial'?1:-1));
const chosen=monthly[saveMonth],sum=saveFilter==='all'?saveAllBalance(today):saveAccountBalance(saveFilter,today);
const options=accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
const yearsOptions=years.map(y=>`<option value="${y}" ${saveYear===y?'selected':''}>${y}</option>`).join('');
const bars=chart.map((v,i)=>`<div class="save-bar-cell"><div class="save-bar-track"><button type="button" style="height:${Math.max(v?3:0,Math.round(Math.abs(v)/max*100))}%;background:${v<0?'#df6161':'#287de9'}" onclick="${saveMode==='monthly'?`saveSetMonth(${i})`:`saveSetYear(${allYear[i]})`}" aria-label="${saveMode==='monthly'?months[i]:allYear[i]} ${money(v)}"></button></div><span>${saveMode==='monthly'?months[i]:allYear[i]}</span></div>`).join('');
const maxCapital=Math.max(1,...capital),capitalBars=capital.map((v,i)=>`<div class="save-bar-cell"><div class="save-bar-track"><button type="button" style="height:${Math.max(v?3:0,Math.round(v/maxCapital*100))}%;background:#1ba88f" onclick="${saveMode==='monthly'?`saveSetMonth(${i})`:`saveSetYear(${allYear[i]})`}" aria-label="${saveMode==='monthly'?months[i]:allYear[i]} ${money(v)}"></button></div><span>${saveMode==='monthly'?months[i]:allYear[i]}</span></div>`).join('');
savingsRender(`<div class="save-ui"><section class="card stack"><div class="row" style="align-items:center;gap:10px"><svg viewBox="0 0 24 24" width="35" height="35" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M12 8v8M8 12h8M5 18h3"/></svg><h2>Épargne</h2></div><div class="muted">Épargne totale</div><div class="exp-summary">${money(sum)}</div><div class="exp-dash-controls"><select class="field" aria-label="Année" onchange="saveSetYear(this.value)">${yearsOptions}</select><select class="field" aria-label="Support" onchange="saveSetFilter(this.value)"><option value="all">Tous les supports</option>${accounts.map(a=>`<option value="${a.id}" ${saveFilter===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="exp-dash-tabs"><button class="${saveMode==='monthly'?'active':''}" onclick="saveSetMode('monthly')">Mensuel</button><button class="${saveMode==='yearly'?'active':''}" onclick="saveSetMode('yearly')">Annuel</button></div><h3>Épargne par ${saveMode==='monthly'?'mois':'année'}</h3><div class="save-bars">${bars}</div><div class="muted">Net ${saveMode==='monthly'?months[saveMonth]+' '+saveYear:saveYear} : ${money(saveMode==='monthly'?chosen.in-chosen.out:chart[allYear.indexOf(saveYear)]||0)}</div>${saveMode==='monthly'?`<div class="muted">Versements ${money(chosen.in)} · Retraits ${money(chosen.out)}</div>`:''}<h3>Évolution par ${saveMode==='monthly'?'mois':'année'}</h3><div class="save-bars">${capitalBars}</div><div class="muted">Capital fin ${saveMode==='monthly'?months[saveMonth]+' '+saveYear:saveYear} : ${money(saveMode==='monthly'?capitalMonths[saveMonth]:(saveFilter==='all'?saveAllBalance(`${saveYear}-12-31`):saveAccountBalance(saveFilter,`${saveYear}-12-31`)))}</div></section>
<section class="card stack"><h2>Répartition par support</h2><div class="muted">Total épargne : ${money(saveAllBalance(today))}</div>${accounts.map((a,i)=>({a,i,balance:saveAccountBalance(a.id,today)})).sort((x,y)=>y.balance-x.balance).map(({a,i,balance})=>{const total=saveAllBalance(today),pct=total>0?Math.max(0,balance/total*100):0,color=['#287de9','#1ba88f','#9868e8','#e6a23c','#e06a88','#27a6cc','#7d8ba2','#c17a4d'][i%8];return `<div class="save-allocation-item"><div class="save-allocation-heading"><span><span class="save-allocation-dot" style="background:${color}"></span><strong>${esc(a.name)}</strong><small class="muted">${esc(a.type)}</small></span><span class="save-allocation-amount">${money(balance)} <strong>${pct.toLocaleString('fr-FR',{maximumFractionDigits:1})} %</strong></span></div><div class="save-allocation-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,pct)}" aria-label="Part de ${esc(a.name)}"><div style="width:${Math.min(100,pct)}%;background:${color}"></div></div></div>`}).join('')||'<p class="muted">Crée ton premier support pour commencer.</p>'}</section>

function drawExpenses(){const all=get('expenses',[]),filter=$('#expFilter').value,items=all.filter(x=>(filter==='all'||x.category===filter)&&expensePeriodMatch(x));$('#total').textContent=money(items.reduce((s,x)=>s+Number(x.amount||0),0));$('#allTotal').textContent=money(all.reduce((s,x)=>s+Number(x.amount||0),0));const totalAll=all.reduce((sum,x)=>sum+Number(x.amount||0),0);const shareHost=$('#categoryShare');if(shareHost){const categories=expenseCategories();const values=categories.map(c=>({name:c,total:all.filter(x=>x.category===c).reduce((sum,x)=>sum+Number(x.amount||0),0)})).filter(x=>x.total>0);shareHost.innerHTML='<h3>Répartition des dépenses par catégorie</h3>'+(values.length?values.sort((a,b)=>b.total-a.total).map(x=>{const pct=totalAll>0?100*x.total/totalAll:0;return `<div class="share-row"><div class="share-heading"><span>${esc(x.name)}</span><strong>${fmt(pct)} % <small>· ${money(x.total)}</small></strong></div><div class="share-track"><div class="share-fill" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div></div>`}).join(''):'<p class="exp-muted">Aucune dépense enregistrée.</p>');}drawCategoryManager();renderExpenseDashboard()}

let expenseViewMode='monthly',expenseViewYear=new Date().getFullYear(),expenseViewMonth='all',expenseViewCategory='all',expenseViewAnnualYear=new Date().getFullYear();
const expenseMonthNames=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
function expenseToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function expenseDateDisplay(iso){const a=String(iso).split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:iso}
function nexoDisplayDate(value){
 const v=String(value??'').trim();
 if(!v)return '';
 let m=v.match(/^(\d{4})-(\d{2})-(\d{2})(?:T.*)?$/);
 if(m)return `${m[3]}/${m[2]}/${m[1]}`;
 m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 if(m)return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[3]}`;
 return v;
}
function expenseDateISO(v){const s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return ''}
function expenseDateParts(x){const s=expenseDateISO(x.date);if(!s)return null;const y=Number(s.slice(0,4)),m=Number(s.slice(5,7))-1;if(m<0||m>11)return null;return {year:y,month:m}}
function expenseDashboardYears(){const years=[...get('expenses',[]),...get('incomeEntries',[])].map(expenseDateParts).filter(Boolean).map(x=>x.year);return [...new Set([...years,new Date().getFullYear()])].sort((a,b)=>b-a)}
function expensePeriodMatch(x){const d=expenseDateParts(x);return !!d&&d.year===expenseViewYear&&(expenseViewMonth==='all'||d.month===expenseViewMonth)}

function expenseSetMonth(m){expenseViewMonth=m==='all'?'all':Number(m);if(expenseViewMonth!=='all')expenseBudgetMonth=expenseViewMonth;expenseViewCategory='all';renderExpenseDashboard()}
function expenseSetAnnualYear(y){expenseViewAnnualYear=Number(y);expenseViewYear=expenseViewAnnualYear;expenseViewCategory='all';renderExpenseDashboard()}

function expenseSetBudget(){const key=String(expenseViewYear)+'-'+String(expenseBudgetMonth+1).padStart(2,'0');const v=$('#expMonthlyBudget')?.value.trim().replace(',','.');if(v===''||!Number.isFinite(Number(v))||Number(v)<0)return toast('Budget invalide');const budgets=get('expenseMonthlyBudgets',{});budgets[key]=Number(v);put('expenseMonthlyBudgets',budgets);renderExpenseDashboard();toast('Budget mensuel enregistré')}

function renderExpenseDashboard(){

const key=String(expenseViewYear)+'-'+String(budgetMonth+1).padStart(2,'0'),budget=get('expenseMonthlyBudgets',{})[key];
const budgetSpent=sum(all.filter(x=>{const d=expenseDateParts(x);return d&&d.year===expenseViewYear&&d.month===budgetMonth}));
const pct=budget>0?Math.min(100,Math.round(budgetSpent/budget*100)):0;
const formFold=document.getElementById("expenseFold");const existingSlot=document.getElementById("expenseFoldSlot");const formContents=formFold?Array.from(formFold.querySelector(".stack").children):existingSlot?Array.from(existingSlot.children):[];const oldOpen=document.getElementById('expenseDashFold')?.open??get('expenseDashFoldOpen',false);const oldIncomeOpen=document.getElementById('incomeFold')?.open??get('incomeFoldOpen',false);

function daxBuild(i){const card=document.querySelector(`[data-dax-index="${i}"]`);if(!card)return '';const x=daxData[i],p=daxParts(x[3]);const args=[...card.querySelectorAll('[data-daxarg]')].map(n=>n.value);const result=p.name?p.name+'('+args.join(', ')+')':x[3];card.querySelector('#daxBuilt-'+i).textContent=result;return result}

async function motoImportGPX(input){const file=input.files?.[0];if(!file)return;if(file.size>12*1024*1024)return toast('Fichier GPX trop volumineux (12 Mo max)');try{const xml=new DOMParser().parseFromString(await file.text(),'application/xml');if(xml.querySelector('parsererror'))throw Error('GPX invalide');const named=tag=>Array.from(xml.getElementsByTagName('*')).filter(n=>n.localName===tag);if(!named('gpx').length)throw Error('Ce fichier n’est pas un GPX');const tracks=named('trkseg');const routes=named('rte');let segments=[];if(tracks.length){segments=tracks.map(seg=>Array.from(seg.children).filter(n=>n.localName==='trkpt'))}else if(routes.length){segments=routes.map(route=>Array.from(route.children).filter(n=>n.localName==='rtept'))}else{segments=[named('wpt')]}const parsed=segments.map(seg=>seg.map(node=>{const lat=Number(node.getAttribute('lat')),lng=Number(node.getAttribute('lon')),time=Array.from(node.children).find(n=>n.localName==='time')?.textContent||null;return {lat,lng,time}}).filter(pt=>Number.isFinite(pt.lat)&&Number.isFinite(pt.lng)&&Math.abs(pt.lat)<=90&&Math.abs(pt.lng)<=180)).filter(seg=>seg.length>0);const count=parsed.reduce((n,seg)=>n+seg.length,0);if(count<2)throw Error('Trace insuffisante : au moins deux positions nécessaires');let km=0,first=null,last=null;for(const seg of parsed){for(let i=0;i<seg.length;i++){const pt=seg[i];if(pt.time){const t=Date.parse(pt.time);if(Number.isFinite(t)){first=first===null? t:Math.min(first,t);last=last===null?t:Math.max(last,t)}}if(i){const prev=seg[i-1];const d=motoDistance([prev.lat,prev.lng],[pt.lat,pt.lng]);if(d<2)km+=d}}}if(km<=0)throw Error('Distance impossible à calculer');const stride=Math.max(1,Math.ceil(count/3500));let n=0;const geometry=parsed.flatMap((seg,i)=>{const a=seg.filter((pt,j)=>j%stride===0||j===seg.length-1).map(pt=>[pt.lat,pt.lng]);return i?[null,...a]:a});const name=(named('trk')[0]||named('rte')[0]);const title=Array.from(name?.children||[]).find(n=>n.localName==='name')?.textContent?.trim()||file.name.replace(/\.gpx$/i,'');const record={id:motoId(),name:title.slice(0,100),km:+km.toFixed(2),date:first?new Date(first).toISOString():new Date().toISOString(),duration:first!==null&&last!==null&&last>=first?(last-first)/1000:null,geometry,points:count};put('moto_gpx_history_v1',[record,...motoHistory()]);toast('Trace GPS importée');motoHome()}catch(e){toast(e.message||'Import GPX impossible')}finally{input.value=''}}
function motoHistoryDelete(id){if(!confirm('Supprimer cette trace de l’historique ?'))return;put('moto_gpx_history_v1',motoHistory().filter(x=>x.id!==id));motoHome()}
async function motoHistoryOpen(id){const r=motoHistory().find(x=>x.id===id);if(!r)return motoHome();setHead('Roadtrip Moto','Historique de balade');content(`<div class="bar"><button onclick="motoHome()">← Historique</button></div><div class="card stack"><h2>${esc(r.name)}</h2><p><strong>${r.km.toLocaleString('fr-FR',{maximumFractionDigits:1})} km</strong> · ${r.points} positions GPS${r.duration!=null?' · '+Math.round(r.duration/60)+' min':''}</p><div id="moto-history-map" class="moto-map">Chargement de la carte…</div><p class="small">Distance calculée à partir des positions du fichier GPX, sans correction routière. La précision dépend de l’enregistrement GPS.</p><button class="btn danger" onclick="motoHistoryDelete('${r.id}')">Supprimer cette trace</button></div>`);try{await motoLoadLeaflet();if(!document.getElementById('moto-history-map'))return;if(motoMap){motoMap.remove();motoMap=null}motoMap=L.map('moto-history-map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(motoMap);const segments=[];let segment=[];for(const pt of r.geometry){if(pt===null){if(segment.length)segments.push(segment);segment=[]}else segment.push(pt)}if(segment.length)segments.push(segment);const layer=L.polyline(segments,{color:'#2687ef',weight:5}).addTo(motoMap);motoMap.fitBounds(layer.getBounds().pad(.12));setTimeout(()=>motoMap?.invalidateSize(),100)}catch{const el=document.getElementById('moto-history-map');if(el)el.textContent='Carte indisponible : vérifiez votre connexion.'}}

function motoLoadLeaflet(){return new Promise((resolve,reject)=>{if(window.L)return resolve();if(document.querySelector('#moto-leaflet-js')){let count=0;const poll=setInterval(()=>{if(window.L){clearInterval(poll);resolve()}else if(++count>50){clearInterval(poll);reject(Error('Carte indisponible'))}},100);return}let css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);let script=document.createElement('script');script.id='moto-leaflet-js';script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.onload=resolve;script.onerror=()=>reject(Error('Carte indisponible'));document.head.appendChild(script)})}
function motoOpen(id){motoSelected=id;const r=motoGet();if(!r)return motoHome();setHead('Roadtrip Moto','Construire un itinéraire');content(`<div class="bar"><button onclick="motoHome()">← Mes balades</button></div><div class="card stack"><label>Nom de la balade</label><input class="field" id="moto-name" maxlength="100" value="${esc(r.name)}" onchange="motoRename(this.value)"><p class="moto-note">Touchez la carte pour placer des étapes dans l'ordre du trajet. Le tracé suit les routes lorsqu'un service de calcul est disponible.</p><div id="moto-map" class="moto-map"><div class="moto-map-fallback">Chargement de la carte…</div></div><div class="moto-form"><input class="field" id="moto-place" placeholder="Rechercher une ville ou une adresse" aria-label="Lieu à rechercher"><button class="btn" onclick="motoSearch()">Rechercher</button></div><div id="moto-info" class="moto-info" aria-live="polite"></div><div id="moto-stops"></div><div class="moto-actions"><button class="btn" onclick="motoUndo()">↶ Retirer le dernier point</button><button class="btn" onclick="motoReverse()">⇄ Inverser</button><button class="btn danger" onclick="motoClear()">Effacer les points</button></div><div class="moto-actions"><button class="btn primary" onclick="motoMaps()">↗ Ouvrir dans Google Maps</button><button class="btn" onclick="motoGPX()">Exporter GPX</button></div><p class="moto-note">Google Maps peut recalculer le parcours et limiter le nombre d'étapes. L'export GPX conserve les points et, si calculé, le tracé routier. Connexion Internet requise pour la carte et le calcul d'itinéraire.</p><button class="btn danger" onclick="motoDelete()">Supprimer cette balade</button></div>`);motoStartMap(id)}

function motoAdd(lat,lng,label){if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const r=motoGet();if(!r||r.points.length>=35)return toast('35 points maximum');motoUpdate(r=>{r.points.push({lat:+lat.toFixed(6),lng:+lng.toFixed(6),label:label||'Point '+(r.points.length+1)});r.km=null;r.geometry=null});motoRefresh(true)}

function motoRefresh(route){const r=motoGet();if(!r)return;const pts=r.points||[];const stops=$('#moto-stops');if(stops)stops.innerHTML=pts.map((p,i)=>`<div class="moto-stop"><strong>${i+1}.</strong><span>${esc(p.label||'Point '+(i+1))}<br><small>${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</small></span><button class="btn" aria-label="Supprimer le point ${i+1}" onclick="motoRemove(${i})">×</button></div>`).join('')||'<p class="small">Aucun point : touchez la carte pour commencer.</p>';const info=$('#moto-info');if(info)info.textContent=pts.length+' point(s)'+(r.km!=null?' · '+Math.round(r.km*10)/10+' km par la route':'');if(!motoMap||!motoLayer)return;motoLayer.clearLayers();pts.forEach((p,i)=>L.marker([p.lat,p.lng]).addTo(motoLayer).bindPopup(esc((i+1)+'. '+(p.label||'Étape'))));if(motoRoute){motoMap.removeLayer(motoRoute);motoRoute=null}if(pts.length){const bounds=L.latLngBounds(pts.map(p=>[p.lat,p.lng]));motoMap.fitBounds(bounds.pad(.25),{maxZoom:12})}if(route)motoCalculate();else if(r.geometry&&r.geometry.length>1)motoDrawRoute(r.geometry)}
function motoDrawRoute(coords){if(!motoMap||!coords||coords.length<2)return;motoRoute=L.polyline(coords,{color:'#2687ef',weight:5,opacity:.88}).addTo(motoMap)}
async function motoCalculate(){const r=motoGet();if(!r)return;const id=r.id,points=r.points.map(p=>({...p})),req=++motoRequest;if(points.length<2)return;const info=$('#moto-info');if(info)info.textContent='Calcul du trajet routier…';try{const coord=points.map(p=>p.lng+','+p.lat).join(';');const url='https://router.project-osrm.org/route/v1/driving/'+coord+'?overview=full&geometries=geojson&steps=false';const res=await fetch(url);if(!res.ok)throw Error('Routage indisponible');const data=await res.json();const route=data.routes?.[0];if(!route?.geometry?.coordinates?.length)throw Error('Aucun trajet trouvé');if(req!==motoRequest||motoSelected!==id)return;const geometry=route.geometry.coordinates.map(x=>[x[1],x[0]]);motoUpdate(r=>{r.km=route.distance/1000;r.geometry=geometry});motoRefresh(false)}catch(e){if(req!==motoRequest)return;const el=$('#moto-info');if(el)el.textContent=points.length+' points · Impossible de calculer la route actuellement. Réessayez en modifiant un point.'}}
async function motoSearch(){const input=$('#moto-place');const q=input?.value.trim();if(!q)return;try{const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept-Language':'fr'}});if(!res.ok)throw Error();const items=await res.json();if(!items.length)return toast('Lieu introuvable');const item=items[0],lat=Number(item.lat),lng=Number(item.lon);if(motoMap)motoMap.setView([lat,lng],12);if(confirm('Ajouter « '+item.display_name.split(',').slice(0,2).join(',')+' » comme étape ?'))motoAdd(lat,lng,item.display_name.split(',').slice(0,2).join(','));input.value=''}catch{toast('Recherche indisponible')}}
function motoMaps(){const r=motoGet(),pts=r?.points||[];if(pts.length<2)return toast('Ajoutez au moins 2 points');const fmt=p=>p.lat+','+p.lng;const mid=pts.slice(1,-1);if(mid.length>3){if(!confirm('Google Maps sur iPhone peut limiter les étapes et recalculer le parcours. Ouvrir les 5 premiers points ?'))return}const selected=pts.length>5?pts.slice(0,5):pts;const url='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+encodeURIComponent(fmt(selected[0]))+'&destination='+encodeURIComponent(fmt(selected.at(-1)))+(selected.length>2?'&waypoints='+encodeURIComponent(selected.slice(1,-1).map(fmt).join('|')):'');window.open(url,'_blank','noopener')}
function motoGPX(){const r=motoGet();if(!r||r.points.length<2)return toast('Ajoutez au moins 2 points');const xml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));const waypoints=r.points.map(p=>`<wpt lat="${p.lat}" lon="${p.lng}"><name>${xml(p.label||'Étape')}</name></wpt>`).join('');const track=r.geometry?.length?`<trk><name>${xml(r.name)}</name><trkseg>${r.geometry.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}"/>`).join('')}</trkseg></trk>`:'';const data='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="NEXO" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>'+xml(r.name)+'</name></metadata>'+waypoints+track+'</gpx>';const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:'application/gpx+xml'}));a.href=u;a.download='nexo-balade-'+r.id+'.gpx';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function motoDelete(){if(!confirm('Supprimer définitivement cette balade ?'))return;put('moto_rides_v1',motoSaved().filter(r=>r.id!==motoSelected));motoSelected=null;motoHome()}

// GEN 2.6.63 — voyages dans IndexedDB, hors quota localStorage.
// Le cache mémoire garde l'API synchrone des écrans existants.
let nxTravelCache=get('travel_v10',[]),nxTravelReady=false,nxTravelQueue=Promise.resolve(),nxTravelDbPromise=null;
function nxTravelDb(){
 if(!nxTravelDbPromise)nxTravelDbPromise=new Promise((resolve,reject)=>{
  if(!window.indexedDB)return reject(Error('IndexedDB indisponible'));
  const req=indexedDB.open('nexo-local-data',1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data')};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('Ouverture IndexedDB impossible'));
 });
 return nxTravelDbPromise;
}
async function nxTravelRead(){const db=await nxTravelDb();return new Promise((resolve,reject)=>{
 const tx=db.transaction('data','readonly'),req=tx.objectStore('data').get('travel_v10');
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
})}
async function nxTravelWrite(items){const db=await nxTravelDb();return new Promise((resolve,reject)=>{
 const tx=db.transaction('data','readwrite');tx.objectStore('data').put(items,'travel_v10');
 tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Transaction annulée'));
})}
const travelStore=()=>nxTravelCache;
function travelSave(items){
 nxTravelCache=items;
 // Sérialise les écritures afin d'éviter qu'une ancienne sauvegarde écrase la dernière.
 nxTravelQueue=nxTravelQueue.then(()=>nxTravelWrite(items)).catch(e=>{
  console.error('NEXO : écriture voyage échouée',e);
  alert('Sauvegarde du voyage impossible : '+(e.message||e)+'. Conserve ta sauvegarde complète.');
 });
 return nxTravelQueue;
}
async function nxTravelInitialize(){
 try{
  const stored=await nxTravelRead();
  if(Array.isArray(stored)){
   // En cas de modifications précoces avant la fin de l'initialisation, ne pas les écraser.
   if(!nxTravelReady)nxTravelCache=stored;
  }else{
   const legacy=get('travel_v10',[]);
   if(legacy.length)await nxTravelWrite(legacy);
   nxTravelCache=legacy;
  }
  // Supprimer l'ancienne copie uniquement APRÈS vérification de l'écriture IndexedDB.
  if(localStorage.getItem('tb_travel_v10')!==null){
   const verified=await nxTravelRead();
   if(Array.isArray(verified))localStorage.removeItem('tb_travel_v10');
  }
  nxTravelReady=true;
 }catch(e){
  console.error('NEXO : migration IndexedDB non disponible',e);
  nxTravelReady=false;
  alert('Stockage IndexedDB indisponible. Les anciens voyages restent dans le stockage d’origine ; conserve ta sauvegarde.');
 }
}
const nxTravelStartup=nxTravelInitialize();

function travelReadCover(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('Choisis une image.'));if(file.size>20*1024*1024)return reject(Error('Image trop volumineuse (20 Mo maximum).'));let reader=new FileReader();reader.onerror=()=>reject(Error('Lecture impossible'));reader.onload=()=>{let im=new Image();im.onerror=()=>reject(Error('Format non pris en charge'));im.onload=()=>{try{let scale=Math.min(1,1200/im.width,1200/im.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.76);if(data.length>1200000)throw Error('Photo trop lourde après compression');resolve(data)}catch(e){reject(e)}};im.src=reader.result};reader.readAsDataURL(file)})}

// Switch travel sections without rebuilding the hero or changing scroll position.
function travelSwitchTab(id){

  const key=['today','planning','budget','bookings','checklist','documents','contacts','settings'][i];

 });

 if(id==='today')travelTodayView(t);else if(id==='documents')travelDocumentsView(t);else if(id==='contacts')travelContactsView(t);else if(id==='planning'){travelPlanning(t,n);travelRestoreSelectedDay()}

 if(doc.demo){const note=document.createElement('p');note.textContent='Document de démonstration : aucun fichier réel n’est associé à cet exemple.';layer.append(note)}
 else if(/^data:(application\/pdf|image\/[^;]+);base64,/.test(doc.data||'')){

function travelDocumentShare(id){
 const doc=travelFind()?.documents?.find(x=>String(x.id)===String(id));
 if(!doc||typeof doc.data!=='string'||!doc.data.startsWith('data:')){alert('Fichier indisponible');return}
 try{
  const match=/^data:([^;,]+)?(?:;[^,]*)?;base64,(.*)$/s.exec(doc.data);
  if(!match)throw Error('Format non pris en charge');
  const mime=match[1]||'application/octet-stream';
  const binary=atob(match[2]);const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const blob=new Blob([bytes],{type:mime});
  const filename=doc.name||'document';
  const file=new File([blob],filename,{type:mime});
  if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
   navigator.share({files:[file],title:filename}).catch(e=>{
    if(e?.name==='AbortError')return;
    travelDocumentSaveBlob(blob,filename);
   });
  }else travelDocumentSaveBlob(blob,filename);
 }catch(e){alert('Impossible de partager ce document : '+(e.message||e))}
}
function travelDocumentSaveBlob(blob,name){
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=name||'document';a.style.display='none';document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function nexoInitContactSwipe(){
 const nodes=[...document.querySelectorAll('#travelContent .nexo-contact-swipe')];
 nodes.forEach(node=>{let startX=0,startY=0,mode='',wasOpen=false;
  node.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY;mode='';wasOpen=node.classList.contains('open')},{passive:true});
  node.addEventListener('touchmove',e=>{if(e.touches.length!==1)return;const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;if(!mode&&Math.max(Math.abs(dx),Math.abs(dy))>10)mode=Math.abs(dx)>Math.abs(dy)*1.35?'horizontal':'vertical';if(mode==='horizontal'&&e.cancelable)e.preventDefault()},{passive:false});
  node.addEventListener('touchend',e=>{if(mode!=='horizontal'||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX;if(dx< -35){nodes.forEach(n=>{if(n!==node)n.classList.remove('open')});node.classList.add('open')}else if(dx>35)node.classList.remove('open');else node.classList.toggle('open',wasOpen)},{passive:true});
  node.querySelector('.nexo-contact-row')?.addEventListener('click',e=>{if(node.classList.contains('open')){e.preventDefault();e.stopPropagation();node.classList.remove('open')}},true);
 });
}

function travelCompressStepPhoto(file){
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
   try{
    const scale=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',0.68));
   }catch(e){URL.revokeObjectURL(url);reject(e)}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image illisible'))};
  img.src=url;
 });
}

function travelStepSave(id){
let title=$('#tsTitle').value.trim();
if(!title)return toast('Indique le nom de l’étape');

if(!trip)return toast('Voyage introuvable');
const step=trip.steps.find(x=>String(x.id)===String(id));
const savedId=step?step.id:travelNewId();
if(step)Object.assign(step,data);else {const daySteps=travelOrderedSteps(trip.steps.filter(x=>x.day===travelDay));if(daySteps.length)daySteps.forEach((s,i)=>{s.order=i});trip.steps.push({id:savedId,...data,order:daySteps.length});}
try{
 travelSave(all);
 const persisted=travelStore().find(t=>t.id===travelId)?.steps.find(x=>String(x.id)===String(savedId));
 if(!persisted||persisted.notes!==data.notes)throw Error('La modification n’a pas été retrouvée dans le stockage.');

 toast('Étape et commentaire enregistrés');
}catch(e){alert('Impossible d’enregistrer la modification. Vérifie l’espace de stockage de ton iPhone, puis réessaie. '+(e?.message||''))}
}

function travelUpdateDates(){

 if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||!/^\d{4}-\d{2}-\d{2}$/.test(end)||end<start||travelDateDays(start,end)>180){toast('Vérifie les dates (180 jours maximum)');return}
 const t=travelFind();if(!t)return;
 if(start===t.start&&end===t.end){toast('Les dates sont inchangées');return}
 const oldDays=travelDateDays(t.start,t.end),newDays=travelDateDays(start,end);
 if(newDays<oldDays&&((t.steps||[]).some(x=>Number(x.day)>=newDays)||Object.keys(t.dayPlaces||{}).some(k=>Number(k)>=newDays))){
  if(!confirm('Le nouveau séjour est plus court. Les informations des jours hors période seront conservées, mais masquées jusqu’à un éventuel allongement du voyage. Continuer ?'))return;
 }

// Sauvegarde complète : toutes les clés persistantes appartenant à NEXO.
const BACKUP_FORMAT='digital-toolbox-full-backup';
function backupKeys(){return Object.keys(localStorage).filter(k=>k.startsWith('tb_')).sort()}
async function backupAllData(){
 try{
  await nxTravelStartup;await nxTravelQueue;
  const data={};for(const key of backupKeys())data[key]=localStorage.getItem(key);
  const payload={format:BACKUP_FORMAT,version:'10.2',createdAt:new Date().toISOString(),data,indexedDB:{travel_v10:travelStore()}};
  const date=new Date().toISOString().slice(0,10);
  travelDownload('digital-toolbox-sauvegarde-complete-'+date+'.json',JSON.stringify(payload,null,2));
  toast('Sauvegarde téléchargée : conserve-la dans Fichiers ou iCloud Drive');
 }catch(e){alert('Impossible de créer la sauvegarde : '+e.message)}
}
function restoreAllData(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{
  const file=input.files&&input.files[0];if(!file)return;
  try{
   if(file.size>150*1024*1024)throw Error('Fichier trop volumineux (150 Mo maximum).');
   const payload=JSON.parse(await file.text());
   if(!payload||payload.format!==BACKUP_FORMAT||!payload.data||typeof payload.data!=='object'||Array.isArray(payload.data))throw Error('Ce fichier n’est pas une sauvegarde complète NEXO.');
   const entries=Object.entries(payload.data);
   const restoredTrips=Array.isArray(payload.indexedDB?.travel_v10)?payload.indexedDB.travel_v10:JSON.parse(payload.data.tb_travel_v10||'[]');
   if(!entries.length)throw Error('Sauvegarde vide.');
   for(const [key,value] of entries){
    if(!/^tb_[A-Za-z0-9_-]{1,100}$/.test(key)||typeof value!=='string')throw Error('Contenu de sauvegarde non valide.');
    JSON.parse(value);
   }
   if(!confirm('Restaurer '+entries.length+' éléments de stockage depuis la sauvegarde du '+(payload.createdAt?new Date(payload.createdAt).toLocaleDateString('fr-FR'):'date inconnue')+' ?\n\nLes données actuelles de NEXO seront remplacées. Cette action est irréversible sans sauvegarde préalable.'))return;
   const previous={};for(const key of backupKeys())previous[key]=localStorage.getItem(key);
   try{
    for(const key of backupKeys())localStorage.removeItem(key);
    for(const [key,value] of entries)localStorage.setItem(key,value);
   }catch(err){
    for(const key of backupKeys())localStorage.removeItem(key);
    for(const [key,value] of Object.entries(previous))localStorage.setItem(key,value);
    throw Error('Espace insuffisant ou stockage indisponible. Les données précédentes ont été rétablies.');
   }
   try{await nxTravelStartup;await nxTravelQueue;await nxTravelWrite(restoredTrips);nxTravelCache=restoredTrips;localStorage.removeItem('tb_travel_v10')}catch(e){throw Error('Restauration des voyages IndexedDB impossible : '+e.message)}
   alert('Restauration terminée ! NEXO va se recharger.');location.reload();
  }catch(e){alert('Restauration impossible : '+e.message)}
 };
 input.click();
}

/* GEN 2.6.47 — Export/import d'un véhicule et de son historique, entièrement local */
function garageExportVehicle(id){
 const vehicle=garageVehicles().find(v=>v.id===id);if(!vehicle)return toast('Véhicule introuvable');
 const plans=garagePlansFor(id),records=garageRecordsFor(id);
 const expenses=get('expenses',[]).filter(e=>records.some(r=>r.expenseId===e.id||e.garageRecordId===r.id));

 const a=document.createElement('a');a.href=url;a.download='nexo-vehicule-'+String(vehicle.name||'vehicule').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').slice(0,45)+'-'+garageToday()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Export du véhicule préparé');
}
function garageImportPicker(){let input=document.getElementById('nexoVehicleImportFile');if(!input){input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.id='nexoVehicleImportFile';input.style.display='none';input.addEventListener('change',garageImportVehicleFile);document.body.appendChild(input)}input.value='';input.click()}
async function garageImportVehicleFile(ev){const file=ev.target.files?.[0];if(!file)return;if(file.size>12*1024*1024)return alert('Fichier trop volumineux (maximum 12 Mo).');let data;try{data=JSON.parse(await file.text())}catch{return alert('Le fichier JSON est illisible.')}if(data?.format!=='nexo-vehicle'||data.version!==1||!data.vehicle||!Array.isArray(data.plans)||!Array.isArray(data.records)||!Array.isArray(data.expenses||[]))return alert('Format non reconnu. Choisis un export de véhicule NEXO.');
 const vehicle=data.vehicle;if(!vehicle||typeof vehicle!=='object'||Array.isArray(vehicle)||typeof vehicle.id!=='string'||!vehicle.id||typeof vehicle.name!=='string'||!vehicle.name.trim()||!['voiture','moto','scooter'].includes(vehicle.type)||data.plans.length>500||data.records.length>10000||data.expenses.length>10000)return alert('Données de véhicule invalides.');
 if(!data.plans.every(p=>p&&typeof p.id==='string'&&p.id&&p.vehicleId===vehicle.id&&typeof p.name==='string')||!data.records.every(r=>r&&typeof r.id==='string'&&r.id&&r.vehicleId===vehicle.id))return alert('L’historique du fichier est incohérent.');
 const idsUnique=arr=>new Set(arr.map(x=>x.id)).size===arr.length;if(!idsUnique(data.plans)||!idsUnique(data.records)||!idsUnique(data.expenses))return alert('Le fichier contient des identifiants en double.');
 if(!confirm('Importer « '+vehicle.name+' » avec '+data.records.length+' intervention(s), '+data.plans.length+' entretien(s) suivi(s) et '+data.expenses.length+' dépense(s) liée(s) ? Un nouveau véhicule sera créé, sans écraser les véhicules existants.'))return;
 const newId=garageUid(),planIds=new Map(data.plans.map(p=>[p.id,garageUid()])),recordIds=new Map(data.records.map(r=>[r.id,garageUid()])),expenseIds=new Map(data.expenses.map(e=>[e.id,garageUid()]));
 const v={...vehicle,id:newId},plans=data.plans.map(p=>({...p,id:planIds.get(p.id),vehicleId:newId})),records=data.records.map(r=>({...r,id:recordIds.get(r.id),vehicleId:newId,planId:planIds.get(r.planId)||'',expenseId:expenseIds.get(r.expenseId)||undefined}));
 const expenses=data.expenses.map(e=>({...e,id:expenseIds.get(e.id),garageRecordId:recordIds.get(e.garageRecordId)||undefined}));
 // Préflight storage: one combined check before changing any persisted key.
 const writes=[['garageVehicles',[...garageVehicles(),v]],['garagePlans',[...garagePlans(),...plans]],['garageRecords',[...garageRecords(),...records]],['expenses',[...get('expenses',[]),...expenses]]];
 const before=writes.map(([key])=>[key,localStorage.getItem('tb_'+key)]);
 try{for(const [key,val] of writes)put(key,val)}catch(err){for(const [key,old] of before){try{if(old===null)localStorage.removeItem('tb_'+key);else localStorage.setItem('tb_'+key,old)}catch{}}return alert('Import impossible : stockage local insuffisant. Aucune donnée existante ne doit être remplacée ; vérifie ta sauvegarde.');}
 garageOpen(newId);toast('Véhicule et historique importés');
}

function garageSaveRecord(id){const v=garageFind(),planId=$('#grPlan').value,plan=garagePlansFor(v.id).find(p=>p.id===planId),name=$('#grName').value.trim()||plan?.name||'',date=$('#grDate').value,km=Number($('#grKm').value),cost=Number($('#grCost').value);if(!name||!date||!Number.isFinite(km)||km<0||!Number.isFinite(cost)||cost<0)return toast('Vérifie les champs');const records=garageRecords(),old=records.find(r=>r.id===id),rid=id||garageUid(),data={id:rid,vehicleId:v.id,planId,name,date,km,cost:Math.round(cost*100)/100,provider:$('#grProvider').value,garage:$('#grGarage').value.trim(),notes:$('#grNotes').value};const createExpense=!old&&$('#grExpense').checked&&cost>0;

/* GEN 2.6.5 — encrypted local vault and offline recipe book */
const vaultDBName='nexo-vault-v1';let vaultKey=null,vaultBusy=false,recipeTimerHandle=null,recipeSeconds=0,vaultAwayAt=0,vaultLockTimer=null;const vaultGraceMs=60000;
function vaultLock(){vaultKey=null;vaultBusy=false;vaultAwayAt=0;if(vaultLockTimer){clearTimeout(vaultLockTimer);vaultLockTimer=null}}
function vaultPause(){if(!vaultKey||vaultAwayAt)return;vaultAwayAt=Date.now();vaultLockTimer=setTimeout(()=>{if(vaultAwayAt&&Date.now()-vaultAwayAt>=vaultGraceMs)vaultLock()},vaultGraceMs)}
function vaultResume(){if(!vaultAwayAt)return;if(Date.now()-vaultAwayAt>=vaultGraceMs){vaultLock();return}vaultAwayAt=0;if(vaultLockTimer){clearTimeout(vaultLockTimer);vaultLockTimer=null}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){vaultPause();if(current==='vault'){$('#vaultScreen')?.replaceChildren();}}else if(current==='vault'){vaultResume();vaultMustUnlock()}});
window.addEventListener('pagehide',vaultLock);
function vaultMustUnlock(){if(current==='vault')vault()}
function vaultDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(vaultDBName,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function vaultGet(store,key){const db=await vaultDb();return new Promise((resolve,reject)=>{const t=db.transaction(store,'readonly'),r=t.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);t.oncomplete=()=>db.close()})}
async function vaultPut(store,value,key){const db=await vaultDb();return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');if(key===undefined)t.objectStore(store).put(value);else t.objectStore(store).put(value,key);t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>reject(t.error)})}
async function vaultAll(){const db=await vaultDb();return new Promise((resolve,reject)=>{const t=db.transaction('files','readonly'),r=t.objectStore('files').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);t.oncomplete=()=>db.close()})}
async function vaultRemove(id){const db=await vaultDb();return new Promise((resolve,reject)=>{const t=db.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>reject(t.error)})}
const vaultRand=n=>crypto.getRandomValues(new Uint8Array(n));
function vaultB64(a){let s='';for(const v of new Uint8Array(a))s+=String.fromCharCode(v);return btoa(s)}
function vaultBytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function vaultDerive(secret,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:vaultBytes(salt),iterations:310000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vaultWrap(raw,secret){const salt=vaultB64(vaultRand(16)),iv=vaultRand(12),k=await vaultDerive(secret,salt);return {salt,iv:vaultB64(iv),data:vaultB64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,raw))}}
async function vaultUnwrap(w,secret){const k=await vaultDerive(secret,w.salt);return crypto.subtle.decrypt({name:'AES-GCM',iv:vaultBytes(w.iv)},k,vaultBytes(w.data))}
function vaultRecovery(){return Array.from(vaultRand(32),b=>b.toString(16).padStart(2,'0')).join('').match(/.{1,8}/g).join('-')}
function vault(){vaultCategoryView=null;content('<div id="vaultScreen" class="stack"><p class="muted">Chargement du coffre-fort sécurisé…</p></div>');vaultStart()}
async function vaultStart(){try{vaultResume();const meta=await vaultGet('meta','config');if(current!=='vault')return;if(!meta){$('#vaultScreen').innerHTML=`<div class="card stack"><h2>🔐 Créer mon coffre-fort</h2><p class="muted">Documents chiffrés sur cet appareil. Le mot de passe sera redemandé après 1 minute hors du coffre-fort.</p><input class="field" type="password" id="vaultNewPass" autocomplete="new-password" placeholder="Mot de passe (12 caractères minimum)"><input class="field" type="password" id="vaultConfirm" autocomplete="new-password" placeholder="Confirmer le mot de passe"><button class="btn primary" onclick="vaultCreate()">Créer le coffre-fort</button></div>`;return}if(!vaultKey){$('#vaultScreen').innerHTML=`<div class="card stack"><h2>🔐 Coffre-fort verrouillé</h2><input class="field" type="password" id="vaultPassword" autocomplete="off" placeholder="Mot de passe principal"><button class="btn primary" onclick="vaultUnlock(false)">Déverrouiller</button><button class="btn" onclick="vaultRecoveryForm()">Mot de passe oublié ?</button></div>`;return}vaultShow()}catch(e){$('#vaultScreen').innerHTML='<div class="card">Stockage local indisponible sur cet appareil.</div>';console.error(e)}}
async function vaultCreate(){if(vaultBusy)return;const pass=$('#vaultNewPass').value;if(pass.length<12||pass!==$('#vaultConfirm').value)return toast('Mot de passe de 12 caractères minimum et confirmation identique');vaultBusy=true;try{const raw=vaultRand(32),recovery=vaultRecovery(),meta={version:1,pass:await vaultWrap(raw,pass),recovery:await vaultWrap(raw,recovery)};await vaultPut('meta',meta,'config');vaultKey=await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);$('#vaultScreen').innerHTML=`<div class="card stack"><h2>🔑 Ta clé de récupération</h2><p>Conserve cette clé hors de NEXO. Elle ne sera plus affichée après cette étape.</p><textarea class="field" id="vaultRecoveryCode" readonly rows="3">${recovery}</textarea><button class="btn" onclick="copyText($('#vaultRecoveryCode').value)">Copier la clé</button><label><input type="checkbox" id="vaultRecoveryConfirmed"> J'ai sauvegardé cette clé dans un endroit sûr</label><button class="btn primary" onclick="if(!$('#vaultRecoveryConfirmed').checked)return toast('Conserve la clé avant de continuer');vaultShow()">Accéder au coffre-fort</button></div>`}catch(e){toast('Impossible de créer le coffre-fort');console.error(e)}finally{vaultBusy=false}}
async function vaultUnlock(recover){if(vaultBusy)return;const el=$(recover?'#vaultRecoveryInput':'#vaultPassword'),secret=el?.value||'';if(!secret)return;vaultBusy=true;try{const meta=await vaultGet('meta','config'),raw=await vaultUnwrap(meta[recover?'recovery':'pass'],secret);vaultKey=await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);if(recover){$('#vaultScreen').innerHTML=`<div class="card stack"><h2>Définir un nouveau mot de passe</h2><input class="field" id="vaultNewPass" type="password" placeholder="Nouveau mot de passe (12 caractères minimum)"><input class="field" id="vaultConfirm" type="password" placeholder="Confirmer"><button class="btn primary" onclick="vaultResetPassword()">Enregistrer</button></div>`}else vaultShow()}catch(e){toast('Code incorrect ou données indisponibles')}finally{vaultBusy=false}}
function vaultRecoveryForm(){$('#vaultScreen').innerHTML=`<div class="card stack"><h2>🔑 Récupération</h2><p>Renseigne ta clé de récupération enregistrée lors de la création.</p><textarea class="field" id="vaultRecoveryInput" rows="3" placeholder="Clé de récupération"></textarea><button class="btn primary" onclick="vaultUnlock(true)">Vérifier la clé</button><button class="btn" onclick="vaultLock();vaultStart()">Retour</button></div>`}
async function vaultResetPassword(){const pass=$('#vaultNewPass').value;if(pass.length<12||pass!==$('#vaultConfirm').value)return toast('Mot de passe invalide ou confirmation différente');try{const meta=await vaultGet('meta','config'),raw=await crypto.subtle.exportKey('raw',vaultKey);meta.pass=await vaultWrap(raw,pass);await vaultPut('meta',meta,'config');vaultShow();toast('Mot de passe remplacé')}catch(e){toast('Erreur de récupération')}}
async function vaultEncrypt(bytes){if(!vaultKey)throw Error('Coffre verrouillé');const iv=vaultRand(12);return {iv:vaultB64(iv),data:vaultB64(await crypto.subtle.encrypt({name:'AES-GCM',iv},vaultKey,bytes))}}
async function vaultDecrypt(item){if(!vaultKey)throw Error('Coffre verrouillé');return crypto.subtle.decrypt({name:'AES-GCM',iv:vaultBytes(item.iv)},vaultKey,vaultBytes(item.data))}
let vaultCategoryView=null;
const vaultCategoryDefaults=[['Identité','🪪'],['Véhicules','🚗'],['Logement','🏠'],['Contrats & assurances','📄'],['Santé','🩺'],['Documents','📁']];
function vaultCategoryIcon(name){return vaultCategoryDefaults.find(x=>x[0]===name)?.[1]||'📂'}
function vaultSelectCategory(name){vaultCategoryView=name;vaultShow();window.scrollTo(0,0)}
function vaultAllCategories(){vaultCategoryView=null;vaultShow();window.scrollTo(0,0)}
async function vaultShow(){if(!vaultKey||current!=='vault')return vaultStart();const items=await vaultAll();if(!vaultKey||current!=='vault')return;
const counts=new Map();for(const x of items){const c=x.category||'Documents';counts.set(c,(counts.get(c)||0)+1)}
const cats=[...vaultCategoryDefaults.map(x=>x[0]),...Array.from(counts.keys()).filter(x=>!vaultCategoryDefaults.some(y=>y[0]===x))];
const inCategory=vaultCategoryView!==null;
const list=inCategory?items.filter(x=>(x.category||'Documents')===vaultCategoryView):[];
const tiles=cats.map(c=>`<button class="vault-category-tile" onclick="vaultSelectCategory(decodeURIComponent('${encodeURIComponent(c)}'))"><span class="vault-category-count">${counts.get(c)||0}</span><span class="vault-category-label">${vaultCategoryIcon(c)} ${esc(c)}</span></button>`).join('');
const cards=list.map(x=>`<div class="card stack"><strong>${esc(x.name)}</strong><small>${esc(x.category||'Documents')} · ${esc(x.date||'')} · ${(x.size/1024).toFixed(0)} Ko</small><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="vaultPreview('${x.id}')">Consulter</button><button class="btn" onclick="vaultShare('${x.id}')">Télécharger</button><button class="btn" onclick="vaultRename('${x.id}')">Classer</button><button class="btn danger" onclick="vaultDelete('${x.id}')">Supprimer</button></div></div>`).join('');
$('#vaultScreen').innerHTML=`<div class="card stack vault-actions"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🔐 Mes documents</h2><button class="btn" onclick="vaultLock();vaultStart()">Verrouiller</button></div><p class="muted">Stockage chiffré sur cet appareil · ${items.length} document(s)</p><label class="btn primary" style="text-align:center;cursor:pointer">＋ Importer un document<input type="file" multiple accept="application/pdf,image/*,.txt,.doc,.docx,.xlsx,.zip" style="display:none" onchange="vaultImport(this.files)"></label><button class="btn" onclick="vaultExport()">Exporter la sauvegarde chiffrée</button><label class="btn" style="text-align:center;cursor:pointer">Restaurer une sauvegarde<input type="file" accept="application/json,.json" style="display:none" onchange="vaultRestore(this.files[0])"></label></div>${inCategory?`<div class="stack"><button class="btn vault-category-back" onclick="vaultAllCategories()">← Toutes les catégories</button><h2>${vaultCategoryIcon(vaultCategoryView)} ${esc(vaultCategoryView)} (${list.length})</h2>${cards||'<div class="card muted">Aucun document dans cette catégorie.</div>'}</div>`:`<div class="vault-category-grid">${tiles}</div>`}`}

async function vaultImport(files){if(!vaultKey)return vaultStart();const key=vaultKey;for(const f of Array.from(files||[])){if(f.size>12*1024*1024){toast('Fichier trop volumineux (12 Mo maximum)');continue}try{const data=await vaultEncrypt(await f.arrayBuffer());if(vaultKey!==key)return;await vaultPut('files',{id:crypto.randomUUID(),name:f.name,type:f.type||'application/octet-stream',size:f.size,date:new Date().toLocaleDateString('fr-FR'),category:'Documents',...data})}catch(e){toast('Import impossible : stockage insuffisant ?');console.error(e)}}if(vaultKey)await vaultShow()}
async function vaultFile(id){const x=await vaultGet('files',id);if(!x)throw Error('Fichier introuvable');return {x,blob:new Blob([await vaultDecrypt(x)],{type:x.type})}}
function vaultSaveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function vaultPreview(id){try{const {x,blob}=await vaultFile(id);if(!/^(application\/pdf|image\/|text\/)/.test(x.type))return toast('Aperçu non disponible : télécharge le fichier');const url=URL.createObjectURL(blob);const win=window.open(url,'_blank');if(!win){vaultSaveBlob(blob,x.name);toast('Aperçu bloqué : fichier téléchargé')}setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){toast('Aperçu impossible')}}
async function vaultRename(id){const x=await vaultGet('files',id);if(!x)return;const name=prompt('Nom du document',x.name);if(name===null)return;const category=prompt('Catégorie',x.category||'Documents');if(category===null)return;x.name=name.trim()||x.name;x.category=category.trim()||'Documents';await vaultPut('files',x);vaultCategoryView=x.category;vaultShow()}
async function vaultDownload(id){try{const {x,blob}=await vaultFile(id);vaultSaveBlob(blob,x.name)}catch(e){toast('Téléchargement impossible')}}
async function vaultShare(id){try{const {x,blob}=await vaultFile(id),file=new File([blob],x.name,{type:x.type});if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:x.name})}else{vaultSaveBlob(blob,x.name);toast('Fichier téléchargé : joins-le à ton mail depuis Fichiers')}}catch(e){if(e.name!=='AbortError')toast('Partage indisponible')}}
async function vaultDelete(id){if(!confirm('Supprimer définitivement ce document ?'))return;await vaultRemove(id);vaultShow()}
async function vaultExport(){try{const meta=await vaultGet('meta','config'),files=await vaultAll();vaultSaveBlob(new Blob([JSON.stringify({format:'nexo-vault',version:1,meta,files})],{type:'application/json'}),'nexo-coffre-chiffre-'+new Date().toISOString().slice(0,10)+'.json');toast('Sauvegarde chiffrée téléchargée')}catch(e){toast('Export impossible')}}
async function vaultRestore(file){if(!file)return;try{const backup=JSON.parse(await file.text());if(backup.format!=='nexo-vault'||backup.version!==1||!backup.meta?.pass||!backup.meta?.recovery||!Array.isArray(backup.files))throw Error('Format invalide');const existing=await vaultAll();if(existing.length||await vaultGet('meta','config')){if(!confirm('La restauration remplacera tout le coffre-fort actuel, y compris son mot de passe et sa clé de récupération. Continuer ?'))return}const db=await vaultDb();await new Promise((resolve,reject)=>{const tx=db.transaction(['meta','files'],'readwrite');tx.objectStore('meta').put(backup.meta,'config');tx.objectStore('files').clear();for(const item of backup.files){if(!item.id||!item.data||!item.iv)throw Error('Document invalide');tx.objectStore('files').put(item)}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();vaultLock();vaultStart();toast('Sauvegarde restaurée : déverrouille avec les anciens identifiants')}catch(e){toast('Sauvegarde invalide ou restauration impossible');console.error(e)}}

function recipeSeedClassics(){if(get('nexoClassicRecipesSeeded267',false))return;const existing=get('nexoRecipes',[]);if(!Array.isArray(existing))return;const ids=new Set(existing.map(r=>r.id));const additions=NEXO_CLASSIC_RECIPES.filter(r=>!ids.has(r.id));try{put('nexoRecipes',[...existing,...additions]);put('nexoClassicRecipesSeeded267',true)}catch(e){console.warn('Impossible d’ajouter les recettes de démonstration',e)}}

const recipeCategories=[{name:'Entrée',label:'Entrées',icon:'🥗'},{name:'Plat',label:'Plats',icon:'🍝'},{name:'Dessert',label:'Desserts',icon:'🍰'},{name:'Cocktail',label:'Cocktails',icon:'🍹'},{name:'Boisson',label:'Boissons',icon:'☕'},{name:'Autre',label:'Autres',icon:'📖'}];
