function recipeCategoryHome(){const all=recipeList();const cats=recipeCategories.filter(c=>all.some(r=>r.category===c.name));content(`<div class="card stack recipe-home-actions"><h2>🍳 Mon livre de recettes</h2><button class="btn primary" onclick="recipeForm()">＋ Nouvelle recette</button><button class="btn" onclick="recipePasteForm()">📋 Coller une recette ou un lien</button><button class="btn" onclick="recipeExport()">Exporter mes recettes</button><label class="btn" style="text-align:center;cursor:pointer">Importer mes recettes<input type="file" accept="application/json,.json" style="display:none" onchange="recipeImport(this.files[0])"></label></div><div class="recipe-category-grid"><button class="recipe-category-tile" onclick="recipeOpenCategory('favorites')"><span class="recipe-cat-count">${all.filter(r=>r.favorite).length}</span><span class="recipe-cat-name">⭐ Mes favoris</span></button>${cats.map(c=>`<button class="recipe-category-tile" onclick="recipeOpenCategory('${c.name}')"><span class="recipe-cat-count">${all.filter(r=>r.category===c.name).length}</span><span class="recipe-cat-name">${c.icon} ${c.label}</span></button>`).join('')}</div>`)}
function recipeOpenCategory(cat){recipeSelectedCategory=cat;const c=recipeCategories.find(x=>x.name===cat);content(`<div class="card stack"><button class="btn" onclick="recipeHome()">← Toutes les catégories</button><h2>${cat==='favorites'?'⭐ Mes favoris':c?c.icon+' '+c.label:esc(cat)}</h2><input class="field" id="recipeSearch" type="search" placeholder="Rechercher une recette ou un ingrédient…" oninput="recipeFilter()"></div><div id="recipeResults"></div>`);recipeFilter()}
function recipeFilter(){const q=($('#recipeSearch')?.value||'').trim().toLocaleLowerCase('fr');const target=$('#recipeResults');if(!target)return;target.innerHTML=recipeList().filter(r=>(!recipeSelectedCategory||(recipeSelectedCategory==='favorites'?!!r.favorite:r.category===recipeSelectedCategory))&&(r.title+' '+r.ingredients.map(i=>i.name).join(' ')).toLocaleLowerCase('fr').includes(q)).map(r=>`<div class="card stack"><div class="row"><strong class="grow">${esc(r.title)}</strong><button class="btn" onclick="recipeView('${r.id}')">Voir →</button></div><small>${esc(r.category||'Plat')} · ${r.servings} portions · ${r.minutes||0} min ${r.favorite?'· ★':''}</small></div>`).join('')||'<div class="card">Aucune recette trouvée.</div>'}

function recipeForm(id){recipeEditId=id||null;const r=recipeList().find(x=>x.id===id)||{title:'',category:'Plat',servings:2,minutes:30,ingredients:[],steps:[],photo:'',favorite:false};content(`<div class="card stack"><h2>${id?'Modifier':'Nouvelle'} recette</h2><label>Nom<input class="field" id="recipeTitle" value="${esc(r.title)}"></label><label>Catégorie<select class="field" id="recipeCategory">${['Entrée','Plat','Dessert','Cocktail','Boisson','Autre'].map(x=>`<option ${x===r.category?'selected':''}>${x}</option>`).join('')}</select></label><div class="two"><label>Portions<input class="field" id="recipeServings" type="number" min="1" value="${r.servings}"></label><label>Durée (min)<input class="field" id="recipeMinutes" type="number" min="0" value="${r.minutes||0}"></label></div><label>Ingrédients (une ligne par ingrédient : quantité | unité | nom)<textarea class="field" id="recipeIngredients" rows="7" placeholder="200 | g | farine&#10;2 | pièce | œufs">${esc(r.ingredients.map(i=>[i.qty,i.unit,i.name].join(' | ')).join('\n'))}</textarea></label><label>Étapes (une étape par ligne)<textarea class="field" id="recipeSteps" rows="7">${esc(r.steps.join('\n'))}</textarea></label><label>Photo depuis l'iPhone<input class="field" type="file" accept="image/*" id="recipePhoto"></label><label><input type="checkbox" id="recipeFavorite" ${r.favorite?'checked':''}> Favori</label><button class="btn primary" onclick="recipeSave()">Enregistrer</button><button class="btn" onclick="recipes()">Annuler</button></div>`)}
async function recipeSave(){const title=$('#recipeTitle').value.trim(),servings=Number($('#recipeServings').value);if(!title||!Number.isFinite(servings)||servings<1)return toast('Nom et portions obligatoires');const a=recipeList(),old=a.find(x=>x.id===recipeEditId),file=$('#recipePhoto').files[0];let photo=old?.photo||'';if(file){if(file.size>1500000)return toast('Photo trop volumineuse (1,5 Mo maximum)');photo=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}const ingredients=$('#recipeIngredients').value.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const p=line.split('|').map(x=>x.trim());return p.length>=3?{qty:Number(p[0].replace(',','.'))||0,unit:p[1],name:p.slice(2).join(' | ')}:{qty:0,unit:'',name:line}});const item={id:recipeEditId||crypto.randomUUID(),title,category:$('#recipeCategory').value,servings,minutes:Number($('#recipeMinutes').value)||0,ingredients,steps:$('#recipeSteps').value.split('\n').map(x=>x.trim()).filter(Boolean),favorite:$('#recipeFavorite').checked,photo};put('nexoRecipes',[item,...a.filter(x=>x.id!==item.id)]);recipeView(item.id);toast('Recette enregistrée')}
function recipeView(id){recipeTimerStop();const r=recipeList().find(x=>x.id===id);if(!r)return recipes();content(`<div class="card stack"><button class="btn" onclick="recipes()">← Mes recettes</button>${r.photo?`<div class="recipe-photo-wrap"><img src="${r.photo}" alt="Photo de ${esc(r.title)}" style="max-width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block"><button class="recipe-photo-remove" onclick="recipeRemovePhoto('${id}')" aria-label="Supprimer la photo">✕ Photo</button></div>`:''}<h2>${esc(r.title)}</h2><p class="muted">${esc(r.category)} · ${r.minutes||0} min</p><div class="row"><button class="btn primary" onclick="recipeCook('${id}',0)">👨‍🍳 Mode Cuisine</button><button class="btn" onclick="recipeForm('${id}')">Modifier</button></div><label>Nombre de portions<input class="field" id="recipePortions" type="number" style="width:33.333%;max-width:100%;margin-top:4px;display:block" min="1" value="${r.servings}" oninput="recipeScale('${id}')"></label><div id="recipeScaled"></div><h3>Préparation</h3>${r.steps.map((x,i)=>`<p>${i+1}. ${esc(x)}</p>`).join('')}<button class="btn" onclick="recipeToShopping('${id}')">🛒 Ajouter les ingrédients aux courses</button><button class="btn danger" onclick="recipeDelete('${id}')">Supprimer</button></div>`);recipeScale(id)}
function recipeRemovePhoto(id){const a=recipeList(),r=a.find(x=>x.id===id);if(!r||!r.photo)return;if(!confirm('Supprimer la photo de cette recette ?'))return;r.photo='';try{put('nexoRecipes',a);recipeView(id);toast('Photo supprimée')}catch(e){toast('Impossible de supprimer la photo')}}
function recipeScale(id){const r=recipeList().find(x=>x.id===id),n=Number($('#recipePortions')?.value)||r.servings;$('#recipeScaled').innerHTML='<h3>Ingrédients</h3>'+r.ingredients.map(i=>`<p>• ${i.qty?esc(String(Math.round(i.qty*n/r.servings*100)/100))+' ':''}${esc(i.unit)} ${esc(i.name)}</p>`).join('')}
function recipeToShopping(id){const r=recipeList().find(x=>x.id===id);if(!r)return;const n=Number($('#recipePortions')?.value)||r.servings,items=get('shopping',[]);for(const i of r.ingredients)items.push({id:crypto.randomUUID(),text:`${i.qty?Math.round(i.qty*n/r.servings*100)/100+' ':''}${i.unit} ${i.name}`.trim(),done:false});put('shopping',items);toast('Ingrédients ajoutés à la liste de courses')}
function recipeDelete(id){if(!confirm('Supprimer cette recette ?'))return;put('nexoRecipes',recipeList().filter(x=>x.id!==id));recipes()}
function recipeCook(id,step){const r=recipeList().find(x=>x.id===id);if(!r)return;recipeCookingStep=Math.max(0,Math.min(step,r.steps.length-1));content(`<div class="card stack"><button class="btn recipe-cook-back" onclick="recipeView('${id}')">← Retour aux recettes</button><h2>👨‍🍳 ${esc(r.title)}</h2><p class="muted">Étape ${r.steps.length?recipeCookingStep+1:0} / ${r.steps.length}</p><div style="font-size:22px;line-height:1.5;padding:24px 0">${esc(r.steps[recipeCookingStep]||'Aucune étape')}</div><div class="row"><button class="btn" ${recipeCookingStep===0?'disabled':''} onclick="recipeCook('${id}',${recipeCookingStep-1})">← Précédent</button><button class="btn primary" ${recipeCookingStep>=r.steps.length-1?'disabled':''} onclick="recipeCook('${id}',${recipeCookingStep+1})">Suivant →</button></div><details><summary>Voir les ingrédients</summary>${r.ingredients.map(i=>`<p>${esc(i.qty+' '+i.unit+' '+i.name)}</p>`).join('')}</details><div class="recipe-timer-line"><label>Minuteur (minutes)<input class="field" type="number" min="1" id="recipeTimerMins" value="5"></label><strong id="recipeTimerDisplay" class="recipe-timer-clock" role="timer" aria-live="off">00:00</strong></div><div class="row"><button class="btn" onclick="recipeTimerStart()">Lancer le minuteur</button><button class="btn" onclick="recipeTimerStop()">Arrêter le minuteur</button></div><button class="btn" onclick="recipeView('${id}')">Terminer le mode Cuisine</button></div>`);if(recipeTimerHandle)$('#recipeTimerDisplay').textContent=Math.floor(recipeSeconds/60)+':'+String(recipeSeconds%60).padStart(2,'0')}
function recipeTimerStop(){if(recipeTimerHandle!==null){clearInterval(recipeTimerHandle);recipeTimerHandle=null}recipeSeconds=0;const el=$('#recipeTimerDisplay');if(el)el.textContent='00:00'}
function recipeTimerStart(){const mins=Number($('#recipeTimerMins').value);if(!Number.isFinite(mins)||mins<=0||mins>240)return toast('Choisis entre 1 et 240 minutes');clearInterval(recipeTimerHandle);recipeSeconds=Math.round(mins*60);$('#recipeTimerDisplay').textContent=Math.floor(recipeSeconds/60)+':'+String(recipeSeconds%60).padStart(2,'0');recipeTimerHandle=setInterval(()=>{recipeSeconds--;const el=$('#recipeTimerDisplay');if(el)el.textContent=Math.floor(recipeSeconds/60)+':'+String(recipeSeconds%60).padStart(2,'0');if(recipeSeconds<=0){clearInterval(recipeTimerHandle);recipeTimerHandle=null;recipeSeconds=0;alert('⏰ Minuteur de cuisine terminé !')}},1000)}
function recipeExport(){vaultSaveBlob(new Blob([JSON.stringify({format:'nexo-recipes',version:1,recipes:recipeList()})],{type:'application/json'}),'nexo-recettes-'+new Date().toISOString().slice(0,10)+'.json')}
async function recipeImport(file){if(!file)return;try{const o=JSON.parse(await file.text());if(o.format!=='nexo-recipes'||!Array.isArray(o.recipes))throw Error();const a=recipeList(),ids=new Set(a.map(x=>x.id));for(const r of o.recipes){if(typeof r.title!=='string'||!Array.isArray(r.ingredients)||!Array.isArray(r.steps))throw Error();a.push({...r,id:ids.has(r.id)?crypto.randomUUID():r.id||crypto.randomUUID()})}put('nexoRecipes',a);recipes();toast('Recettes importées')}catch(e){toast('Fichier de recettes invalide ou stockage insuffisant')}}
function recipePasteForm(){content(`<div class="card stack"><h2>📋 Coller une recette</h2><p class="muted">Colle le texte de la recette. Un lien URL peut être tenté en ligne, si le site autorise l'accès.</p><textarea id="recipePasteText" class="field" rows="10" placeholder="Titre, ingrédients, préparation… ou https://..."></textarea><button class="btn primary" onclick="recipePaste()">Analyser la recette</button><button class="btn" onclick="recipes()">Annuler</button></div>`)}
async function recipePaste(){let t=$('#recipePasteText').value.trim();if(!t)return;if(/^https?:\/\//i.test(t)){try{const u=new URL(t);if(!['http:','https:'].includes(u.protocol))throw Error();const res=await fetch(u.href);if(!res.ok)throw Error();const html=await res.text(),doc=new DOMParser().parseFromString(html,'text/html');const script=[...doc.querySelectorAll('script[type="application/ld+json"]')].map(x=>{try{return JSON.parse(x.textContent)}catch{return null}}).filter(Boolean);let obj=null;function find(o){if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(find);return}if((o['@type']==='Recipe'||(Array.isArray(o['@type'])&&o['@type'].includes('Recipe')))&&!obj)obj=o;Object.values(o).forEach(v=>{if(typeof v==='object')find(v)})}script.forEach(find);if(!obj)throw Error();const steps=(obj.recipeInstructions||[]).map(x=>typeof x==='string'?x:x.text||'').filter(Boolean);recipeForm();$('#recipeTitle').value=obj.name||'';$('#recipeIngredients').value=(obj.recipeIngredient||[]).join('\n');$('#recipeSteps').value=steps.join('\n');toast('Recette récupérée : vérifie les champs');return}catch(e){toast('Import automatique bloqué : colle le texte de la recette');return}}const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);recipeForm();$('#recipeTitle').value=lines[0]||'';let marker=lines.findIndex(x=>/^(préparation|instructions|étapes|méthode)\s*:?$/i.test(x));let ing=lines.findIndex(x=>/^ingrédients\s*:?$/i.test(x));if(ing>=0){$('#recipeIngredients').value=lines.slice(ing+1,marker>=0?marker:undefined).map(x=>x.replace(/^[-•*]\s*/,'' )).join('\n')}if(marker>=0)$('#recipeSteps').value=lines.slice(marker+1).map(x=>x.replace(/^\d+[.)]\s*/,'' )).join('\n');if(ing<0&&marker<0)$('#recipeSteps').value=lines.slice(1).join('\n');toast('Texte importé : vérifie ingrédients et étapes')}

const nxC39={'0':'101001101101','1':'110100101011','2':'101100101011','3':'110110010101','4':'101001101011','5':'110100110101','6':'101100110101','7':'101001011011','8':'110100101101','9':'101100101101','A':'110101001011','B':'101101001011','C':'110110100101','D':'101011001011','E':'110101100101','F':'101101100101','G':'101010011011','H':'110101001101','I':'101101001101','J':'101011001101','K':'110101010011','L':'101101010011','M':'110110101001','N':'101011010011','O':'110101101001','P':'101101101001','Q':'101010110011','R':'110101011001','S':'101101011001','T':'101011011001','U':'110010101011','V':'100110101011','W':'110011010101','X':'100101101011','Y':'110010110101','Z':'100110110101','-':'100101011011','.':'110010101101',' ':'100110101101','$':'100100100101','/':'100100101001','+':'100101001001','%':'101001001001','*':'100101101101'};

const nxC39Formats=['code_39','ean_13','ean_8','upc_a'];
const nxEANL=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];

const nxEANR=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const nxEANParity=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function nxCheckDigit(v){let sum=0,weight=3;for(let i=v.length-1;i>=0;i--){sum+=Number(v[i])*weight;weight=weight===3?1:3}return String((10-sum%10)%10)}
function nxEANBits(value,format){const v=String(value).trim();if(!/^\d+$/.test(v))return '';if(format==='ean_13'){if(v.length!==13||nxCheckDigit(v.slice(0,12))!==v[12])return '';const parity=nxEANParity[Number(v[0])];return '101'+[...v.slice(1,7)].map((d,i)=>(parity[i]==='L'?nxEANL:nxEANG)[Number(d)]).join('')+'01010'+[...v.slice(7)].map(d=>nxEANR[Number(d)]).join('')+'101'}if(format==='ean_8'){if(v.length!==8||nxCheckDigit(v.slice(0,7))!==v[7])return '';return '101'+[...v.slice(0,4)].map(d=>nxEANL[Number(d)]).join('')+'01010'+[...v.slice(4)].map(d=>nxEANR[Number(d)]).join('')+'101'}if(format==='upc_a'){if(v.length!==12||nxCheckDigit(v.slice(0,11))!==v[11])return '';return '101'+[...v.slice(0,6)].map(d=>nxEANL[Number(d)]).join('')+'01010'+[...v.slice(6)].map(d=>nxEANR[Number(d)]).join('')+'101'}return ''}

let nxParkingCoords=null;
async function nxParkReverseAddress(lat,lng){
 const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=fr&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lng);
 const response=await fetch(url,{headers:{'Accept':'application/json'}});
 if(!response.ok)throw Error('Géocodage indisponible');
 const data=await response.json();
 if(!data||data.error||!data.display_name)throw Error('Adresse introuvable');
 const a=data.address||{};
 const street=[a.house_number,a.road||a.pedestrian||a.footway||a.path].filter(Boolean).join(' ');
 const city=a.city||a.town||a.village||a.municipality||a.hamlet||'';
 return [street,a.postcode,city].filter(Boolean).join(', ')||data.display_name;
}
function nxParkGPS(){
 if(!navigator.geolocation)return toast('GPS indisponible');
 const el=document.getElementById('nxGpsStatus'),place=document.getElementById('nxParkPlace');
 if(el)el.textContent='Localisation en cours…';
 navigator.geolocation.getCurrentPosition(async p=>{
  const coords={lat:p.coords.latitude,lng:p.coords.longitude};nxParkingCoords=coords;
  const accuracy='Position GPS enregistrée (précision ±'+Math.round(p.coords.accuracy)+' m).';
  if(el)el.textContent=accuracy+' Recherche de l’adresse…';
  const previous=place?.value||'';
  try{
   const address=await nxParkReverseAddress(coords.lat,coords.lng);
   if(nxParkingCoords!==coords||!document.getElementById('nxParkPlace'))return;
   if(place&&place.value===previous){place.value=address;if(el)el.textContent=accuracy+' Adresse renseignée automatiquement (modifiable).';}
   else if(el)el.textContent=accuracy+' Adresse trouvée, mais votre saisie a été conservée.';
  }catch{
   if(nxParkingCoords!==coords||!document.getElementById('nxParkPlace'))return;
   if(el)el.textContent=accuracy+' Adresse non disponible (connexion nécessaire) : saisissez-la manuellement.';
  }
 },()=>{if(el)el.textContent='GPS refusé ou indisponible : saisie manuelle possible.'},{enableHighAccuracy:true,timeout:12000});
}
async function nxParkSave(){const old=get('nexoParking',null)||{},f=document.getElementById('nxParkPhoto');let photo=old.photo||'';if(f.files?.length){try{photo=await new Promise((resolve,reject)=>{nxImgRead(f,resolve);setTimeout(()=>reject(Error()),1500)})}catch{return toast('Photo invalide')}}const coords=nxParkingCoords||(old.lat!=null?{lat:old.lat,lng:old.lng}:{});const v={vehicle:nxVal('nxParkVehicle'),place:nxVal('nxParkPlace'),level:nxVal('nxParkLevel'),deadline:nxVal('nxParkDeadline'),photo,...coords};try{put('nexoParking',v);nxParkingCoords=null;parking()}catch{toast('Stockage saturé')}}

function nxSoundPause(){if(!nxSoundActive)return;nxSoundPaused=!nxSoundPaused;nxSoundUpdateButtons();const label=document.getElementById('nxSoundLabel');if(label)label.textContent=nxSoundPaused?'En pause':'Mesure en cours'}
function nxSoundReset(){nxSoundValues=[];nxSoundGraph=[];['nxSoundMin','nxSoundAvg','nxSoundMax'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='—'});nxSoundDraw()}
function nxSoundTick(time){if(!nxSoundActive||current!=='sonometer')return;if(!nxSoundPaused&&time-nxSoundLast>=120){nxSoundLast=time;nxSoundAnalyser.getFloatTimeDomainData(nxSoundBuffer);let sum=0;for(const x of nxSoundBuffer)sum+=x*x;const rms=Math.sqrt(sum/nxSoundBuffer.length);nxSoundRaw=20*Math.log10(Math.max(rms,1e-7));const value=nxSoundOffset===null?nxSoundRaw:nxSoundRaw+nxSoundOffset;nxSoundValues.push(value);nxSoundGraph.push(value);if(nxSoundGraph.length>240)nxSoundGraph.shift();const unit=nxSoundOffset===null?' dBFS':' dB estimés';const display=x=>x.toFixed(1).replace('.',',')+unit;const el=id=>document.getElementById(id);if(el('nxSoundNumber'))el('nxSoundNumber').textContent=value.toFixed(1).replace('.',',');if(el('nxSoundLabel'))el('nxSoundLabel').textContent='Mesure en cours';if(el('nxSoundMin'))el('nxSoundMin').textContent=display(Math.min(...nxSoundValues));if(el('nxSoundMax'))el('nxSoundMax').textContent=display(Math.max(...nxSoundValues));if(el('nxSoundAvg'))el('nxSoundAvg').textContent=display(nxSoundValues.reduce((a,b)=>a+b,0)/nxSoundValues.length);const percent=nxSoundOffset===null?Math.min(100,Math.max(0,(value+90)/90*100)):Math.min(100,Math.max(0,value/110*100));if(el('nxSoundMeter')){el('nxSoundMeter').style.width=percent+'%';el('nxSoundMeter').style.background=percent>78?'#dc2626':percent>58?'#f59e0b':'#21a366'}nxSoundDraw()}nxSoundRAF=requestAnimationFrame(nxSoundTick)}
function nxSoundDraw(){const canvas=document.getElementById('nxSoundCanvas');if(!canvas)return;const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;c.clearRect(0,0,w,h);c.strokeStyle='#7b8798';c.globalAlpha=.35;for(let y=1;y<4;y++){c.beginPath();c.moveTo(0,y*h/4);c.lineTo(w,y*h/4);c.stroke()}c.globalAlpha=1;if(nxSoundGraph.length<2)return;const lo=nxSoundOffset===null?-90:0,hi=nxSoundOffset===null?0:110;c.strokeStyle='#2981e8';c.lineWidth=3;c.beginPath();nxSoundGraph.forEach((v,i)=>{const x=i/239*w,y=h-Math.max(0,Math.min(1,(v-lo)/(hi-lo)))*h;if(i===0)c.moveTo(x,y);else c.lineTo(x,y)});c.stroke()}
function nxSoundCalibrate(){if(!nxSoundActive||nxSoundPaused||!Number.isFinite(nxSoundRaw)){toast('Démarre une mesure active avant de calibrer');return}const n=Number(document.getElementById('nxSoundReference')?.value);if(!Number.isFinite(n)||n<0||n>140||document.getElementById('nxSoundReference').value===''){toast('Saisis une référence entre 0 et 140 dB');return}nxSoundOffset=n-nxSoundRaw;put('nxSoundCalibration',nxSoundOffset);nxSoundReset();document.getElementById('nxSoundUnit').textContent='dB SPL estimés (calibrés)';document.getElementById('nxSoundCalibrationInfo').textContent='Calibration locale enregistrée';toast('Calibration enregistrée')}
function nxSoundClearCalibration(){nxSoundOffset=null;try{localStorage.removeItem('tb_nxSoundCalibration')}catch{}nxSoundReset();document.getElementById('nxSoundUnit').textContent='dBFS (signal numérique)';document.getElementById('nxSoundCalibrationInfo').textContent='Aucune calibration enregistrée';toast('Calibration effacée')}

function fx(){const s=get('nexoFx',{})||{};nxDisplay(`<div class="card stack"><h2>💱 Convertisseur de devises</h2><p class="nexo-muted">Taux enregistrés sur cet appareil. La mise à jour nécessite Internet.</p>${nxField('nxFxAmount','Montant',s.amount??'100','number')}<div class="two"><div><label>De</label><select class="field" id="nxFxFrom" onchange="nxFxPairChanged()">${nxFxCodes.map(c=>`<option ${c===(s.from||'EUR')?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Vers</label><select class="field" id="nxFxTo" onchange="nxFxPairChanged()">${nxFxCodes.map(c=>`<option ${c===(s.to||'THB')?'selected':''}>${c}</option>`).join('')}</select></div></div><button class="btn" onclick="nxFxSwap()">⇄ Inverser</button>${nxField('nxFxRate','Taux (1 unité source = … cible)',s.rate??'','number')}${nxField('nxFxFee','Frais bancaires (%)',s.fee??'0','number')}<div class="nexo-item"><div class="nexo-muted">Montant converti après frais</div><h2 id="nxFxResult">—</h2><p id="nxFxDate" class="nexo-muted"></p></div><div class="nexo-actions"><button class="btn primary" onclick="nxFxFetch()">Actualiser le taux en ligne</button></div></div>`);['nxFxAmount','nxFxFee'].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>nxFxCalculate(false)));document.getElementById('nxFxRate')?.addEventListener('input',()=>{nxFxRequestId++;nxFxCalculate(false)});nxFxCalculate(false)}
function nxFxSwap(){const a=document.getElementById('nxFxFrom'),b=document.getElementById('nxFxTo');[a.value,b.value]=[b.value,a.value];nxFxPairChanged()}
function nxFxPairChanged(){const from=nxVal('nxFxFrom'),to=nxVal('nxFxTo'),cache=get('nexoFxRates',{})||{},cached=cache[from+'_'+to];nxFxRequestId++;const rate=document.getElementById('nxFxRate');if(!rate)return;rate.value=from===to?'1':cached?.rate>0?String(cached.rate):'';nxFxCalculate(false);if(from!==to&&navigator.onLine)nxFxFetch(true)}
function nxFxCalculate(save=false,notify=false){const from=nxVal('nxFxFrom'),to=nxVal('nxFxTo'),amount=Number(nxVal('nxFxAmount')),rate=Number(nxVal('nxFxRate')),fee=Number(nxVal('nxFxFee'));const cache=get('nexoFxRates',{})||{},cached=cache[from+'_'+to];const r=from===to?1:rate>0?rate:0;const out=document.getElementById('nxFxResult'),date=document.getElementById('nxFxDate');if(out)out.textContent=Number.isFinite(amount)&&Number.isFinite(fee)&&fee>=0&&fee<=100&&r>0?(amount*r*(1-fee/100)).toLocaleString('fr-FR',{maximumFractionDigits:2})+' '+to:'Taux non disponible pour '+from+' → '+to;if(date)date.textContent=from===to?'Même devise : taux 1':cached&&Math.abs(Number(cached.rate)-rate)<1e-10?'Dernier taux en ligne : '+cached.date:rate>0?'Taux manuel':'Sélectionne « Actualiser le taux en ligne » ou saisis un taux';if(save){try{put('nexoFx',{amount:nxVal('nxFxAmount'),from,to,rate:nxVal('nxFxRate'),fee:nxVal('nxFxFee')});if(notify)toast('Conversion enregistrée')}catch{toast('Enregistrement impossible')}}}
async function nxFxFetch(automatic=false){const from=nxVal('nxFxFrom'),to=nxVal('nxFxTo'),requestId=++nxFxRequestId;if(from===to){document.getElementById('nxFxRate').value='1';nxFxCalculate(false);return}try{const response=await fetch('https://api.frankfurter.dev/v1/latest?base='+encodeURIComponent(from)+'&symbols='+encodeURIComponent(to),{cache:'no-store'});if(!response.ok)throw Error('Service indisponible');const data=await response.json(),rate=Number(data.rates?.[to]);if(!(rate>0))throw Error('Devise non prise en charge');const rates=get('nexoFxRates',{})||{};rates[from+'_'+to]={rate,date:data.date};put('nexoFxRates',rates);if(requestId!==nxFxRequestId||nxVal('nxFxFrom')!==from||nxVal('nxFxTo')!==to)return;document.getElementById('nxFxRate').value=String(rate);nxFxCalculate(false);if(!automatic)toast('Taux mis à jour')}catch(e){if(requestId!==nxFxRequestId||nxVal('nxFxFrom')!==from||nxVal('nxFxTo')!==to)return;if(!automatic)toast('Actualisation impossible : utilise un taux manuel');else if(!Number(nxVal('nxFxRate')))document.getElementById('nxFxDate').textContent='Taux indisponible hors ligne : actualise ou saisis un taux'}}

function nxHealthSexIcon(sex){if(sex!=='male'&&sex!=='female')return '';const male=sex==='male';return `<span class="nexo-health-sex ${male?'male':'female'}" role="img" aria-label="${male?'Homme':'Femme'}"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="${male?12:16}" cy="${male?20:12}" r="7"/>${male?'<path d="M17 15 28 4M21 4h7v7"/>':'<path d="M16 19v10M11 25h10"/>'}</svg></span>`}
function healthcard(){const a=nxRead('nexoHealthProfiles');nxDisplay(`<div class="card stack"><h2><span class="nexo-health-title-icon"><svg class="nexo-line-icon nexo-ecg-heart" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.8a5.3 5.3 0 0 0-7.5 0L12 7.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 22l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/><path d="M3.3 13h4l1.7-3.5 2.4 7 2.2-4h7.1"/></svg></span> Ma fiche santé</h2><p class="nexo-muted">Profils stockés localement sur cet appareil. Les données médicales sont sensibles : protège ton iPhone et tes sauvegardes.</p><button class="btn primary" onclick="nxHealthForm()">＋ Ajouter une personne</button></div>${a.length?a.map(x=>`<div class="nexo-item"><div class="nexo-health-card-head"><strong class="nexo-health-profile-name">${esc(x.first||'')} ${esc(x.last||'')}</strong>${nxHealthSexIcon(x.sex)}</div><div class="nexo-actions"><button class="btn primary" onclick="nxEmergency('${x.id}')">Carte d’urgence</button><button class="btn" onclick="nxHealthForm('${x.id}')">Modifier</button></div></div>`).join(''):'<p class="muted">Aucune personne enregistrée.</p>'}`)}
function nxHealthForm(id=''){const x=nxRead('nexoHealthProfiles').find(v=>v.id===id)||{};nxDisplay(`<div class="card stack nexo-health-form">${nxBack('healthcard()')}<h2>${id?'Modifier':'Nouvelle'} fiche santé</h2>${nxField('nxHFirst','Prénom',x.first)}${nxField('nxHLast','Nom',x.last)}<div><label for="nxHSex">Sexe</label><select class="field" id="nxHSex"><option value="" ${!x.sex?'selected':''}>Non renseigné</option><option value="male" ${x.sex==='male'?'selected':''}>Homme</option><option value="female" ${x.sex==='female'?'selected':''}>Femme</option></select></div>${nxField('nxHBorn','Date de naissance',x.born,'date')}${nxField('nxHBlood','Groupe sanguin (si connu)',x.blood)}<label>Allergies</label><textarea class="field" id="nxHAllergies" rows="2">${esc(x.allergies||'')}</textarea><label>Pathologies / informations importantes</label><textarea class="field" id="nxHConditions" rows="3">${esc(x.conditions||'')}</textarea><label>Traitements actuels</label><textarea class="field" id="nxHDrugs" rows="3">${esc(x.drugs||'')}</textarea><label>Consignes particulières</label><textarea class="field" id="nxHNotes" rows="3">${esc(x.notes||'')}</textarea><h3>Contact d’urgence principal</h3>${nxField('nxHContact','Nom du contact',x.contact)}${nxField('nxHPhone','Téléphone',x.phone,'tel')}<h3>Second contact (facultatif)</h3>${nxField('nxHContact2','Nom du contact',x.contact2)}${nxField('nxHPhone2','Téléphone',x.phone2,'tel')}<div class="nexo-actions"><button class="btn primary" onclick="nxHealthSave('${id}')">Enregistrer</button>${id?`<button class="btn danger" onclick="nxHealthDelete('${id}')">Supprimer la fiche</button>`:''}</div></div>`)}
function nxHealthSave(id){const first=nxVal('nxHFirst');if(!first)return toast('Indique un prénom');const a=nxRead('nexoHealthProfiles'),x=a.find(v=>v.id===id);const data={id:id||nxId(),first,last:nxVal('nxHLast'),born:nxVal('nxHBorn'),sex:nxVal('nxHSex'),blood:nxVal('nxHBlood'),allergies:nxVal('nxHAllergies'),conditions:nxVal('nxHConditions'),drugs:nxVal('nxHDrugs'),notes:nxVal('nxHNotes'),contact:nxVal('nxHContact'),phone:nxVal('nxHPhone'),contact2:nxVal('nxHContact2'),phone2:nxVal('nxHPhone2')};if(x)Object.assign(x,data);else a.push(data);if(nxSave('nexoHealthProfiles',a))healthcard()}
function nxHealthDelete(id){if(!confirm('Supprimer définitivement cette fiche santé ?'))return;if(nxSave('nexoHealthProfiles',nxRead('nexoHealthProfiles').filter(x=>x.id!==id)))healthcard()}
function nxPhone(v){const clean=String(v||'').replace(/[^+\d]/g,'');return clean?`<a class="btn primary" href="tel:${esc(clean)}">📞 Appeler ${esc(v)}</a>`:''}
function nxEmergency(id){const x=nxRead('nexoHealthProfiles').find(v=>v.id===id);if(!x)return healthcard();const item=(label,val)=>`<div><strong>${label}</strong><div class="nexo-break">${esc(val||'Non renseigné')}</div></div>`;nxDisplay(`<div class="card stack">${nxBack('healthcard()')}<div class="nexo-emergency stack"><h2>❤️ CARTE D’URGENCE</h2><div class="nexo-health-card-head"><h2>${esc(x.first)} ${esc(x.last)}</h2>${nxHealthSexIcon(x.sex)}</div>${item('Date de naissance',x.born)}${item('Groupe sanguin (déclaré)',x.blood)}${item('Allergies',x.allergies)}${item('Informations médicales',x.conditions)}${item('Traitements',x.drugs)}${item('Consignes',x.notes)}${item('Contact d’urgence',x.contact)}${nxPhone(x.phone)}${x.contact2?item('Second contact',x.contact2):''}${nxPhone(x.phone2)}</div><p class="nexo-muted">Fiche déclarative. En cas d’urgence, contacter les secours (112 en Europe). Non accessible depuis l’écran verrouillé de l’iPhone.</p></div>`)}


/* GEN 2.6.44 — QR codes, international clocks, bubble level, compass. */
let nxQrData='',nxQrMatrix=null,nxQrEdit=null;
function nxQrTool(){nxQrEdit=null;nxQrRender()}
function nxQrWifiEscape(v){return String(v).replace(/([\\;,:"])/g,'\\$1')}
function nxQrRender(){const saved=nxRead('nxQrItems');nxDisplay(`<div class="card stack"><h2><svg class="nexo-line-icon nexo-qr-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx=".5"/><rect x="14.5" y="2.5" width="7" height="7" rx=".5"/><rect x="2.5" y="14.5" width="7" height="7" rx=".5"/><path d="M5 5h2M17 5h2M5 17h2M14.5 14.5h3v3h-3zM21.5 14.5v3M17.5 21.5h4M14.5 19.5v2"/></svg> Générateur de QR codes</h2><p class="nexo-muted">Génération sur ton iPhone, sans connexion ni transfert des données.</p><label>Type de contenu</label><select id="nxQrType" class="field" onchange="nxQrFields()"><option value="text">Texte</option><option value="url">Site Internet</option><option value="tel">Téléphone</option><option value="email">E-mail</option><option value="wifi">Réseau Wi-Fi</option></select><div id="nxQrFields"></div><div class="two"><div><label>Couleur du code</label><input id="nxQrDark" class="field" type="color" value="#111827" onchange="nxQrGenerate()"></div><div><label>Couleur du fond</label><input id="nxQrLight" class="field" type="color" value="#ffffff" onchange="nxQrGenerate()"></div></div><div id="nxQrPreview" style="text-align:center"></div><div class="two"><button class="btn primary" onclick="nxQrGenerate()">Générer</button><button class="btn" onclick="nxQrDownload()">Télécharger PNG</button></div><div class="two"><button class="btn" onclick="nxQrShare()">Partager</button><button class="btn" onclick="nxQrSave()">Enregistrer</button></div><h3>Mes QR codes enregistrés</h3><div id="nxQrSaved"></div><p class="nexo-muted">Les mots de passe Wi-Fi encodés dans un QR code sont lisibles par les personnes qui le scannent.</p></div>`);nxQrFields();nxQrSaved()}
function nxQrFields(){const t=$('#nxQrType')?.value;const el=$('#nxQrFields');if(!el)return;el.innerHTML=t==='wifi'?`<label>Nom du réseau (SSID)</label><input class="field" id="nxQrInput" placeholder="Nom du Wi-Fi" oninput="nxQrGenerate()"><label>Sécurité</label><select class="field" id="nxQrSecurity" onchange="nxQrGenerate()"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass">Sans mot de passe</option></select><label>Mot de passe</label><input class="field" id="nxQrExtra" oninput="nxQrGenerate()"><label><input type="checkbox" id="nxQrHidden" onchange="nxQrGenerate()"> Réseau masqué</label>`:`<label>${{text:'Texte',url:'Adresse Internet',tel:'Numéro de téléphone',email:'Adresse e-mail'}[t]}</label><textarea class="field" id="nxQrInput" rows="3" oninput="nxQrGenerate()" placeholder="Saisir le contenu"></textarea>`;nxQrGenerate()}
function nxQrContent(){const t=$('#nxQrType')?.value,v=$('#nxQrInput')?.value.trim()||'';if(!v)return '';if(t==='url')return /^(https?:\/\/)/i.test(v)?v:'https://'+v;if(t==='tel')return 'tel:'+v;if(t==='email')return 'mailto:'+v;if(t==='wifi'){const sec=$('#nxQrSecurity').value;return 'WIFI:T:'+sec+';S:'+nxQrWifiEscape(v)+';P:'+nxQrWifiEscape(sec==='nopass'?'':$('#nxQrExtra').value)+';H:'+($('#nxQrHidden').checked?'true':'false')+';;'}return v}
function nxQrGenerate(){const el=$('#nxQrPreview');if(!el)return;nxQrData=nxQrContent();nxQrMatrix=null;if(!nxQrData){el.innerHTML='<p class="nexo-muted">Saisis un contenu pour afficher le QR code.</p>';return}try{const utf8=new TextEncoder().encode(nxQrData);if(utf8.length>1800)throw Error('Contenu trop long pour ce QR code');const qr=new NexoQRCode(0,1);qr.addData(Array.from(utf8,b=>String.fromCharCode(b)).join(''));qr.make();nxQrMatrix=qr;const n=qr.getModuleCount(),size=300,quiet=4,cell=size/(n+quiet*2),fg=$('#nxQrDark').value,bg=$('#nxQrLight').value;const cv=document.createElement('canvas');cv.width=cv.height=size;const ctx=cv.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,size,size);ctx.fillStyle=fg;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))ctx.fillRect(Math.round((x+quiet)*cell),Math.round((y+quiet)*cell),Math.ceil(cell)+.3,Math.ceil(cell)+.3);cv.style.cssText='width:min(100%,300px);height:auto;border-radius:10px;image-rendering:pixelated';el.replaceChildren(cv);el.insertAdjacentHTML('beforeend',`<div class="nexo-muted" style="margin-top:8px">${n} × ${n} modules · QR code prêt</div>`)}catch(e){el.textContent='Impossible de générer : '+e.message}}
function nxQrDownload(){const cv=$('#nxQrPreview canvas');if(!cv)return toast('Génère d’abord un QR code');const a=document.createElement('a');a.download='nexo-qr-code.png';a.href=cv.toDataURL('image/png');a.click()}
async function nxQrShare(){const cv=$('#nxQrPreview canvas');if(!cv)return toast('Génère d’abord un QR code');try{const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const file=new File([blob],'nexo-qr-code.png',{type:'image/png'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'QR code NEXO'});else nxQrDownload()}catch(e){if(e.name!=='AbortError')toast('Partage indisponible : utilise Télécharger PNG')}}
function nxQrSave(){if(!nxQrMatrix)return toast('Génère d’abord un QR code');const name=prompt('Nom de ce QR code :',$('#nxQrInput').value.slice(0,35));if(name===null)return;const a=nxRead('nxQrItems');const item={id:nxQrEdit||nxId(),name:name.trim()||'Sans titre',type:$('#nxQrType').value,value:$('#nxQrInput').value,extra:$('#nxQrExtra')?.value||'',security:$('#nxQrSecurity')?.value||'',hidden:!!$('#nxQrHidden')?.checked,dark:$('#nxQrDark').value,light:$('#nxQrLight').value,fav:a.find(x=>x.id===nxQrEdit)?.fav||false};const i=a.findIndex(x=>x.id===item.id);if(i>=0)a[i]=item;else a.unshift(item);if(nxSave('nxQrItems',a)){nxQrEdit=item.id;nxQrSaved();toast('QR code enregistré')}}
function nxQrSaved(){const el=$('#nxQrSaved');if(!el)return;const a=nxRead('nxQrItems').sort((a,b)=>Number(b.fav)-Number(a.fav));el.innerHTML=a.length?a.map(x=>`<div class="nexo-item" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><strong>${esc(x.name)}</strong><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn" onclick="nxQrFavorite('${x.id}')">${x.fav?'★':'☆'}</button><button class="btn" onclick="nxQrLoad('${x.id}')">Ouvrir</button><button class="btn" onclick="nxQrDelete('${x.id}')">Supprimer</button></div></div>`).join(''):'<p class="nexo-muted">Aucun QR code enregistré.</p>'}
function nxQrFavorite(id){const a=nxRead('nxQrItems');const x=a.find(v=>v.id===id);if(x){x.fav=!x.fav;nxSave('nxQrItems',a);nxQrSaved()}}
function nxQrDelete(id){if(!confirm('Supprimer ce QR code ?'))return;nxSave('nxQrItems',nxRead('nxQrItems').filter(x=>x.id!==id));if(nxQrEdit===id)nxQrEdit=null;nxQrSaved()}
function nxQrLoad(id){const x=nxRead('nxQrItems').find(v=>v.id===id);if(!x)return;nxQrEdit=id;$('#nxQrType').value=x.type;nxQrFields();$('#nxQrInput').value=x.value;$('#nxQrDark').value=x.dark||'#111827';$('#nxQrLight').value=x.light||'#ffffff';if(x.type==='wifi'){$('#nxQrExtra').value=x.extra||'';$('#nxQrSecurity').value=x.security||'WPA';$('#nxQrHidden').checked=!!x.hidden}nxQrGenerate();window.scrollTo({top:0,behavior:'smooth'})}

function nxWorldClock(){nxClockStop();let saved=get('nxWorldCities',['Europe/Paris','Asia/Bangkok','Asia/Tokyo','America/New_York']);if(!Array.isArray(saved))saved=['Europe/Paris'];nxDisplay(`<div class="card stack"><h2>🌐 Horloges internationales</h2><p class="nexo-muted">Horaires calculés sur l’appareil, avec prise en compte des fuseaux et changements d’heure.</p><label>Ajouter une ville</label><div class="two"><select class="field" id="nxWorldPick">${nxWorldCities.map(x=>`<option value="${x[1]}">${x[2]} ${x[0]}</option>`).join('')}</select><button class="btn primary" onclick="nxWorldAdd()">Ajouter</button></div><label>Ville de référence</label><select class="field" id="nxWorldRef" onchange="nxWorldSetRef()">${nxWorldCities.map(x=>`<option value="${x[1]}">${x[0]}</option>`).join('')}</select><div id="nxWorldList"></div></div>`);$('#nxWorldRef').value=get('nxWorldRef','Europe/Paris');nxWorldTick();nxWorldInterval=setInterval(nxWorldTick,1000)}
function nxWorldAdd(){const tz=$('#nxWorldPick').value;const a=get('nxWorldCities',[]);if(!a.includes(tz)){a.push(tz);put('nxWorldCities',a)}nxWorldTick()}
function nxWorldRemove(tz){const a=get('nxWorldCities',[]).filter(x=>x!==tz);put('nxWorldCities',a);nxWorldTick()}
function nxWorldMove(tz,step){const a=get('nxWorldCities',[]),i=a.indexOf(tz);if(i<0||i+step<0||i+step>=a.length)return;[a[i],a[i+step]]=[a[i+step],a[i]];put('nxWorldCities',a);nxWorldTick()}

function nxWorldOffset(tz,now){const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz,timeZoneName:'longOffset'}).formatToParts(now).find(p=>p.type==='timeZoneName')?.value||'GMT+00:00';const m=p.match(/GMT([+-])(\d\d?):?(\d\d)?/);return m?(m[1]==='-'?-1:1)*(+m[2]*60+(+(m[3]||0))):0}
function nxWorldTick(){const el=$('#nxWorldList');if(!el)return;const now=new Date(),ref=$('#nxWorldRef')?.value||'Europe/Paris',refOff=nxWorldOffset(ref,now),a=get('nxWorldCities',['Europe/Paris','Asia/Bangkok','Asia/Tokyo','America/New_York']);el.innerHTML=a.map((tz,i)=>{const c=nxWorldCities.find(x=>x[1]===tz);if(!c)return '';const date=new Intl.DateTimeFormat('fr-FR',{timeZone:tz,weekday:'short',day:'numeric',month:'short'}).format(now),time=new Intl.DateTimeFormat('fr-FR',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(now),diff=(nxWorldOffset(tz,now)-refOff)/60;return `<div class="nexo-item" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div><strong>${c[2]} ${c[0]}</strong><div class="nexo-muted">${esc(date)} · ${diff>=0?'+':''}${fmt(diff)} h</div></div><div style="text-align:right"><strong style="font-variant-numeric:tabular-nums;font-size:1.35rem">${time}</strong><div><button class="btn" onclick="nxWorldMove('${tz}',-1)" aria-label="Monter">↑</button> <button class="btn" onclick="nxWorldMove('${tz}',1)" aria-label="Descendre">↓</button> <button class="btn" onclick="nxWorldRemove('${tz}')" aria-label="Supprimer">×</button></div></div></div>`}).join('')||'<p class="nexo-muted">Ajoute une ville pour commencer.</p>'}

let nxSensorListener=null,nxSensorType=null,nxSensorZero={beta:0,gamma:0},nxSensorHold=false,nxSensorLast=null;
function nxSensorStop(){if(nxSensorListener){window.removeEventListener('deviceorientation',nxSensorListener);nxSensorListener=null}nxSensorType=null;nxSensorHold=false}
function nxSensorPermissionText(){return typeof DeviceOrientationEvent==='undefined'?'Capteur d’orientation non disponible sur ce navigateur.':'Appuie sur Activer les capteurs et autorise l’accès si Safari le demande.'}
async function nxSensorStart(type){if(typeof DeviceOrientationEvent==='undefined')return nxSensorStatus('Capteur indisponible.');try{if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')return nxSensorStatus('Autorisation refusée dans Safari.')}nxSensorStop();nxSensorType=type;nxSensorListener=e=>{if(nxSensorHold)return;nxSensorLast=e;if(type==='level')nxLevelUpdate(e);else nxCompassUpdate(e)};window.addEventListener('deviceorientation',nxSensorListener,true);nxSensorStatus('Capteurs activés. Oriente doucement l’iPhone.')}catch(e){nxSensorStatus('Accès impossible : '+e.message)}}
function nxSensorStatus(s){const el=$('#nxSensorStatus');if(el)el.textContent=s}
function nxLevel(){nxSensorStop();nxSensorZero={beta:0,gamma:0};nxDisplay(`<div class="card stack"><h2>📐 Niveau à bulle</h2><p class="nexo-muted">Pose l’iPhone à plat sur une surface stable. Mesure indicative.</p><div style="position:relative;width:min(100%,310px);aspect-ratio:1;margin:12px auto;border:6px solid #377e6c;border-radius:50%;background:radial-gradient(circle,#c3f1d4,#5ab78c);overflow:hidden"><div style="position:absolute;inset:50%;width:2px;height:100%;background:#36745f;transform:translate(-50%,-50%);opacity:.5"></div><div style="position:absolute;top:50%;left:0;width:100%;height:2px;background:#36745f;opacity:.5"></div><div id="nxLevelBubble" style="position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:#dcffe6;box-shadow:0 3px 12px #155b4c77;transform:translate(-50%,-50%);transition:transform .1s"></div></div><div id="nxLevelValues" style="text-align:center;font-size:1.4rem;font-weight:700">—</div><div id="nxSensorStatus" class="nexo-muted">${nxSensorPermissionText()}</div><div class="two"><button class="btn primary" onclick="nxSensorStart('level')">Activer les capteurs</button><button class="btn" onclick="nxLevelZero()">Calibrer à zéro</button></div><button class="btn" onclick="nxSensorHold=!nxSensorHold;this.textContent=nxSensorHold?'Reprendre la mesure':'Figer la mesure'">Figer la mesure</button><p class="nexo-muted">La calibration fixe une référence temporaire. L’outil ne remplace pas un niveau professionnel.</p></div>`)}
function nxLevelZero(){if(!nxSensorLast||!Number.isFinite(nxSensorLast.beta)||!Number.isFinite(nxSensorLast.gamma))return toast('Active d’abord les capteurs');nxSensorZero={beta:nxSensorLast.beta,gamma:nxSensorLast.gamma};nxLevelUpdate(nxSensorLast)}
function nxLevelUpdate(e){if(!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return nxSensorStatus('Données d’inclinaison indisponibles.');const x=Math.max(-90,Math.min(90,e.gamma-nxSensorZero.gamma)),y=Math.max(-90,Math.min(90,e.beta-nxSensorZero.beta)),bubble=$('#nxLevelBubble'),value=$('#nxLevelValues');if(bubble)bubble.style.transform=`translate(calc(-50% + ${x/90*100}px),calc(-50% + ${y/90*100}px))`;if(value)value.textContent=`Axe X : ${x.toFixed(1)}° · Axe Y : ${y.toFixed(1)}°`;if(bubble)bubble.style.background=Math.abs(x)<1&&Math.abs(y)<1?'#ffffff':'#dcffe6'}
function nxCompass(){nxSensorStop();nxDisplay(`<div class="card stack"><h2>🧭 Boussole numérique</h2><p class="nexo-muted">Cap fourni par les capteurs d’orientation, lorsqu’il est disponible.</p><div style="position:relative;width:min(100%,310px);aspect-ratio:1;margin:12px auto"><svg id="nxCompassRose" viewBox="0 0 240 240" width="100%" height="100%" aria-label="Rose des vents"><circle cx="120" cy="120" r="108" fill="none" stroke="currentColor" stroke-width="3" opacity=".5"/><circle cx="120" cy="120" r="90" fill="none" stroke="currentColor" opacity=".3"/><text x="120" y="38" text-anchor="middle" fill="#e44" font-size="23" font-weight="bold">N</text><text x="120" y="212" text-anchor="middle" fill="currentColor" font-size="20">S</text><text x="207" y="127" text-anchor="middle" fill="currentColor" font-size="20">E</text><text x="33" y="127" text-anchor="middle" fill="currentColor" font-size="20">O</text><path d="M120 48 L139 126 L120 118 L101 126 Z" fill="#e44"/><path d="M120 192 L139 114 L120 122 L101 114 Z" fill="#8898ab"/><circle cx="120" cy="120" r="7" fill="currentColor"/></svg></div><div id="nxCompassValue" style="text-align:center;font-size:1.8rem;font-weight:700">—</div><div id="nxCompassSource" class="nexo-muted" style="text-align:center">Aucune mesure</div><div id="nxSensorStatus" class="nexo-muted">${nxSensorPermissionText()}</div><button class="btn primary" onclick="nxSensorStart('compass')">Activer les capteurs</button><p class="nexo-muted">Sur Safari, un cap magnétique fiable n’est pas garanti. Une orientation relative ne sera pas présentée comme un cap nord réel. Évite les objets métalliques et aimants.</p></div>`)}
function nxCompassUpdate(e){let heading=null,source='';if(Number.isFinite(e.webkitCompassHeading)&&e.webkitCompassAccuracy>=0){heading=e.webkitCompassHeading;source='Cap magnétique estimé (iPhone)'}else if(e.absolute===true&&Number.isFinite(e.alpha)){heading=(360-e.alpha)%360;source='Orientation absolue estimée (référence non garantie)'}if(heading===null){const el=$('#nxCompassValue');if(el)el.textContent='Cap indisponible';const info=$('#nxCompassSource');if(info)info.textContent='Safari ne fournit pas de cap nord exploitable sur cet appareil.';return}heading=(heading+360)%360;const dirs=['N','NE','E','SE','S','SO','O','NO'];const val=$('#nxCompassValue'),rose=$('#nxCompassRose'),info=$('#nxCompassSource');if(val)val.textContent=Math.round(heading)+'° · '+dirs[Math.round(heading/45)%8];if(rose)rose.style.transform=`rotate(${-heading}deg)`;if(info)info.textContent=source}


/* NEXO — Mon temps : données locales, saisie libre des pauses en minutes */
const NX_LIFE_KEY='nexo_lifetime_v1';
let nxLifeDate=new Date().toLocaleDateString('en-CA');
function nxLifeData(){try{return JSON.parse(localStorage.getItem(NX_LIFE_KEY))||{}}catch(e){return {}}}
function nxLifeSaveData(d){localStorage.setItem(NX_LIFE_KEY,JSON.stringify(d))}
function nxLifeEsc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nxLifeMins(t){if(!/^\d{2}:\d{2}$/.test(t||''))return null;let [h,m]=t.split(':').map(Number);return h<24&&m<60?h*60+m:null}
function nxLifeRecord(d){let r=d||{};let start=nxLifeMins(r.start),end=nxLifeMins(r.end);let pause=Number(r.pause||0),sleep=Number(r.sleep||0),commute=Number(r.commute||0),chores=Number(r.chores||0);let work=0;if(r.type==='work'&&start!==null&&end!==null){let span=(end-start+1440)%1440;work=Math.max(0,span-pause)}let total=work+sleep*60+commute+chores;return {work,sleep:sleep*60,commute,chores,personal:Math.max(0,1440-total),over:total>1440}}
function nxLifeRender(){let data=nxLifeData(),r=data[nxLifeDate]||{type:'work',start:'09:00',end:'18:00',pause:60,sleep:8,commute:60,chores:60};let yr=Number(nxLifeDate.slice(0,4));let today=new Date();let grid='',totals={work:0,sleep:0,commute:0,chores:0,personal:0},count=0;
let monday=new Date(yr,0,1);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
for(let w=0;w<53;w++){let cells='';for(let day=0;day<7;day++){let date=new Date(monday);date.setDate(monday.getDate()+w*7+day);let iso=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;let inYear=date.getFullYear()===yr;let entry=data[iso];let typ=entry?.type||'unset';let color=typ==='vacation'?'#9b83e8':typ==='rest'?'#36b7a5':typ==='work'?'#e89455':'#465165';if(inYear){count++;if(entry){let m=nxLifeRecord(entry);for(let k in totals)totals[k]+=m[k]}}cells+=`<button type="button" title="${iso}${entry?' · '+typ:''}" onclick="nxLifeSelect('${iso}')" style="min-width:0;aspect-ratio:1;border:1px solid ${iso===nxLifeDate?'white':'transparent'};border-radius:3px;background:${inYear?color:'transparent'};padding:0;opacity:${inYear?1:.2}"></button>`}grid+=`<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">${cells}</div>`}
let m=nxLifeRecord(r),fmt=n=>`${Math.floor(n/60)} h ${String(Math.round(n%60)).padStart(2,'0')}`;
content(`<div class="card"><h2>⌛ Mon temps</h2><p>Chaque journée est indépendante. Renseigne tes heures réelles ; les pauses sont saisies en minutes uniquement.</p><label>Date <input id="nxLifeDate" type="date" value="${nxLifeDate}" onchange="nxLifeSelect(this.value)"></label><label>Type de journée <select id="nxLifeType" onchange="nxLifeToggle()"><option value="work" ${r.type==='work'?'selected':''}>Travail</option><option value="rest" ${r.type==='rest'?'selected':''}>Repos</option><option value="vacation" ${r.type==='vacation'?'selected':''}>Vacances</option></select></label><div id="nxLifeWork" style="display:${r.type==='work'?'block':'none'}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Début <input class="life-time-field" id="nxLifeStart" type="time" value="${nxLifeEsc(r.start||'09:00')}"></label><label>Fin <input class="life-time-field" id="nxLifeEnd" type="time" value="${nxLifeEsc(r.end||'18:00')}"></label></div><label>Pause totale (minutes) <input id="nxLifePause" type="number" min="0" max="1439" step="1" value="${r.pause??60}"></label></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Sommeil (heures) <input id="nxLifeSleep" type="number" min="0" max="24" step="0.25" value="${r.sleep??8}"></label><label>Trajets (minutes) <input id="nxLifeCommute" type="number" min="0" max="1440" step="1" value="${r.commute??60}"></label></div><label>Sport (minutes) <input id="nxLifeChores" type="number" min="0" max="1440" step="1" value="${r.chores??60}"></label><button onclick="nxLifeStore()" style="width:100%;margin-top:12px">Enregistrer cette journée</button><p style="font-size:.85em">Le temps personnel est calculé sur les 24 heures restantes. Les pauses ne sont pas comptées comme du travail.</p></div><div class="card"><h3>Journée sélectionnée</h3><p>Travail : <b>${fmt(m.work)}</b> · Sommeil : ${fmt(m.sleep)} · Temps personnel : ${fmt(m.personal)}</p>${m.over?'<p style="color:#e66">Attention : le total dépasse 24 heures. Corrige cette journée.</p>':''}<div style="display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px">${Array.from({length:24},(_,i)=>{let minutes=i*60;let k=minutes<m.sleep?'#9b83e8':minutes<m.sleep+m.work?'#e89455':minutes<m.sleep+m.work+m.commute+m.chores?'#8a94a4':'#36b7a5';return `<span title="Heure ${i+1}" style="height:22px;background:${k};border-radius:2px"></span>`}).join('')}</div></div><div class="card"><h3>Année ${yr} · 52 semaines + jours supplémentaires</h3><p style="font-size:.85em">Chaque case représente un jour. Orange : travail · Vert : repos · Violet : vacances · Gris : non renseigné.</p><div style="display:grid;grid-template-columns:repeat(53,minmax(0,1fr));gap:2px;overflow-x:auto">${grid}</div><p>Journées renseignées : <b>${Object.keys(data).filter(k=>k.startsWith(yr+'-')).length}</b> / ${count}</p><h3>Bilan des journées renseignées</h3>${[['Travail','work'],['Sommeil','sleep'],['Trajets','commute'],['Sport','chores'],['Temps personnel','personal']].map(([name,k])=>`<p>${name} : <b>${fmt(totals[k])}</b> · ${(totals[k]/Math.max(1,Object.keys(data).filter(x=>x.startsWith(yr+'-')).length*1440)*100).toFixed(1)} %</p>`).join('')}<p style="font-size:.85em">Le bilan ne projette pas les journées non renseignées. Les vacances sont un type de journée et leur temps est réparti entre sommeil, sport et temps personnel.</p></div>`)}
function nxLifeSelect(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso))return;nxLifeDate=iso;nxLifeRender()}
function nxLifeToggle(){let el=document.getElementById('nxLifeWork');if(el)el.style.display=document.getElementById('nxLifeType').value==='work'?'block':'none'}
function nxLifeStore(){let get=id=>document.getElementById(id).value,type=get('nxLifeType'),start=get('nxLifeStart'),end=get('nxLifeEnd'),pause=Number(get('nxLifePause')),sleep=Number(get('nxLifeSleep')),commute=Number(get('nxLifeCommute')),chores=Number(get('nxLifeChores'));
if(![pause,sleep,commute,chores].every(Number.isFinite)||pause<0||!Number.isInteger(pause)||sleep<0||sleep>24||commute<0||chores<0||!Number.isInteger(commute)||!Number.isInteger(chores)){toast('Vérifie les durées saisies');return}
if(type==='work'){let a=nxLifeMins(start),b=nxLifeMins(end);if(a===null||b===null||a===b||pause> (b-a+1440)%1440){toast('Horaires ou pause invalides');return}}
let r={type,start,end,pause,sleep,commute,chores},m=nxLifeRecord(r);if(m.over){toast('Le total dépasse 24 h');return}let data=nxLifeData();data[nxLifeDate]=r;nxLifeSaveData(data);nxLifeRender();toast('Journée enregistrée')}

</script><style>

0px;margin-top:6px}.life-dash .life-save{width:100%;margin-top:14px;font-weight:700}.life-dash .life-view{display:flex;gap:4px}.life-dash .life-view button{font-size:12px}.life-dash .life-error{color:#ffac89;font-size:12px;margin-top:8px}@media(max-width:1000px){.life-dash .life-grid{grid-template-columns:1fr 1.4fr}.life-dash .life-side{grid-column:1/-1;grid-template-columns:1fr 1fr}.life-dash .life-bottom{grid-template-columns:1fr 1fr}.life-dash .life-bottom>:last-child{grid-column:1/-1}}@media(max-width:650px){.life-dash .life-grid,.life-dash .life-bottom,.life-dash .life-side{display:grid;grid-template-columns:1fr}.life-dash .life-side,.life-dash .life-bottom>:last-child{grid-column:auto}.life-dash .life-brand{font-size:21px}.life-dash .life-top{flex-wrap:wrap}.life-dash .life-heat{gap:2px}.life-dash .life-weekcol{grid-template-rows:repeat(7,10px);gap:2px}.life-dash .life-cell{min-height:10px}.life-dash .life-panel{padding:12px}}

</style><script>
(function(){

window.nxLifeRender=function(){let data=nxLifeData(),r=data[nxLifeDate]||{type:'work',start:'08:30',end:'18:15',pause:75,sleep:7.5,commute:60,chores:90};let yr=+nxLifeDate.slice(0,4),entries=Object.entries(data).filter(([k])=>k.startsWith(yr+'-'));let totals={work:0,sleep:0,commute:0,chores:0,pause:0,personal:0},month=Array.from({length:12},()=>({work:0,sleep:0,personal:0,commute:0,pause:0,chores:0}));let workdays=[];
entries.forEach(([d,v])=>{let p=parts(v);p.forEach(x=>totals[x.k]+=x.v);let mm=month[+d.slice(5,7)-1];if(mm){mm.work+=p.find(x=>x.k==='work').v;mm.sleep+=p.find(x=>x.k==='sleep').v;mm.personal+=p.find(x=>x.k==='personal').v;mm.commute+=p.find(x=>x.k==='commute').v;mm.pause+=p.find(x=>x.k==='pause').v;mm.chores+=p.find(x=>x.k==='chores').v}if(v.type==='work')workdays.push({date:d,minutes:nxLifeRecord(v).work})});
let first=new Date(yr,0,1),firstMon=new Date(first);firstMon.setDate(first.getDate()-(first.getDay()+6)%7);
let last=new Date(yr,11,31),lastSun=new Date(last);lastSun.setDate(last.getDate()+(7-last.getDay())%7);
let weekCount=Math.round((lastSun-firstMon)/604800000)+1;
let weeks='';let monthGroups=[];for(let wi=0;wi<weekCount;wi++){let wd=new Date(firstMon);wd.setDate(firstMon.getDate()+wi*7+3);let mi=wd.getFullYear()<yr?0:wd.getFullYear()>yr?11:wd.getMonth();monthGroups.push(mi)}let monthNames=['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];for(let w=0;w<weekCount;w++){let d=new Date(firstMon);d.setDate(firstMon.getDate()+w*7);let th=new Date(d);th.setDate(th.getDate()+3);let jan4=new Date(th.getFullYear(),0,4);let isoMonday=new Date(jan4);isoMonday.setDate(jan4.getDate()-(jan4.getDay()+6)%7);let wn=1+Math.round((d-isoMonday)/604800000);let cells='';for(let day=0;day<7;day++){let x=new Date(d);x.setDate(d.getDate()+day);let key=iso(x),inYear=x.getFullYear()===yr;cells+=`<button type="button" class="life-cell ${key===nxLifeDate?'selected':''}" title="${key}" aria-label="Modifier le ${key}" onclick="nxLifeSelect('${key}')" style="background:${inYear?typeColor(data[key]):'transparent'};opacity:${inYear?1:.15}" ${inYear?'':'disabled'}></button>`}let monthStart=w===0||monthGroups[w]!==monthGroups[w-1];let monthSpan=monthStart?monthGroups.slice(w).findIndex(x=>x!==monthGroups[w]):-1;if(monthSpan<0)monthSpan=weekCount-w;weeks+=`<div class="life-weekrow-grid">${monthStart?`<span class="life-monthtag" style="height:calc(${monthSpan} * 16px - 1px);position:relative;z-index:1">${monthNames[monthGroups[w]]}</span>`:`<span class="life-monthblank"></span>`}<span class="life-weeknum">${String(wn).padStart(2,'0')}</span>${cells}</div>`}
let p=parts(r),m=nxLifeRecord(r),nDays=entries.length,daysInYear=(new Date(yr,11,31).getDate()===31&&(new Date(yr,1,29).getMonth()===1))?366:365;let workStart=nxLifeMins(r.start),workEnd=nxLifeMins(r.end),span=workStart===null||workEnd===null?0:(workEnd-workStart+1440)%1440;
let selectedWeekStart=dateOf(nxLifeDate);selectedWeekStart.setDate(selectedWeekStart.getDate()-(selectedWeekStart.getDay()+6)%7);let weekDays=Array.from({length:7},(_,i)=>{let d=new Date(selectedWeekStart);d.setDate(d.getDate()+i);return {date:iso(d),r:data[iso(d)]}});
let view=window.nxLifeFilter||'year';let monthFilter=window.nxLifeMonth||(+nxLifeDate.slice(5,7));let visibleEntries=entries.filter(([d])=>view==='year'||(view==='month'?+d.slice(5,7)===monthFilter:d===nxLifeDate));let filterTotals={work:0,sleep:0,commute:0,chores:0,pause:0,personal:0};visibleEntries.forEach(([,v])=>parts(v).forEach(x=>filterTotals[x.k]+=x.v));
let maxMonth=Math.max(1,...month.map(x=>x.work+x.sleep+x.personal+x.commute+x.pause+x.chores));let longest=workdays.slice().sort((a,b)=>b.minutes-a.minutes)[0],shortest=workdays.slice().sort((a,b)=>a.minutes-b.minutes)[0];
content(`<div class="life-dash"><div class="life-top"><div><div class="life-brand">Mon temps</div><div class="life-muted">Visualise et comprends comment tu utilises ton temps, jour après jour.</div></div></div>
<div class="life-filters"><label>Jour <input class="life-filter-control" type="date" value="${nxLifeDate}" onchange="nxLifeSelect(this.value)"></label><label>Mois <select class="life-filter-control" onchange="nxLifeChangeMonth(this.value)">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${monthFilter===i+1?'selected':''}>${new Date(2026,i,1).toLocaleDateString('fr-FR',{month:'long'})}</option>`).join('')}</select></label><label>Année <select class="life-filter-control" onchange="nxLifeGoYear(this.value)">${Array.from({length:11},(_,i)=>yr-5+i).map(y=>`<option value="${y}" ${yr===y?'selected':''}>${y}</option>`).join('')}</select></label></div>
<div class="life-panels"><section class="life-panel"><div class="life-title">1. Ma journée</div><label>Date</label><input class="life-date-field" id="nxLifeDate" type="date" value="${nxLifeDate}" onchange="nxLifeSelect(this.value)"><label>Type de journée</label><div class="life-types">${[['work','Travail'],['rest','Repos'],['vacation','Vacances']].map(([v,t])=>`<button type="button" data-type="${v}" class="${r.type===v?'active':''}" onclick="nxLifeSetType('${v}')">${t}</button>`).join('')}</div><input type="hidden" id="nxLifeType" value="${r.type}"><div id="nxLifeWork" style="display:${r.type==='work'?'block':'none'}"><label>Horaires de travail</label><div class="life-time-fields"><div><label>Début</label><input class="life-time-field" id="nxLifeStart" type="time" value="${nxLifeEsc(r.start||'08:30')}"></div><div><label>Fin</label><input class="life-time-field" id="nxLifeEnd" type="time" value="${nxLifeEsc(r.end||'18:15')}"></div></div><label>Pause totale (en minutes)</label><input id="nxLifePause" type="number" min="0" max="1439" step="1" value="${r.pause??75}"><div class="life-stat" style="margin-top:12px"><div class="life-mini">💼 Temps de travail effectif</div><div class="life-value" id="nxLifePreview">${fmt(m.work)}</div><div class="life-mini" id="nxLifeAmplitude">Amplitude ${fmt(span)} · Pause ${r.pause??75} min</div></div></div><label>Sommeil (heures)</label><input id="nxLifeSleep" type="number" min="0" max="24" step="0.25" value="${r.sleep??7.5}"><label>Trajet (minutes)</label><input id="nxLifeCommute" type="number" min="0" max="1440" step="1" value="${r.commute??60}"><label>Sport (minutes)</label><input id="nxLifeChores" type="number" min="0" max="1440" step="1" value="${r.chores??90}"><button class="life-save" onclick="nxLifeStore()">✓ ${data[nxLifeDate]?'Modifier la journée':'Enregistrer la journée'}</button><div class="life-muted" style="margin-top:10px">Les pauses sont saisies en minutes et comptées séparément du travail.</div></section>
<section class="life-panel"><div class="life-title">2. Détail du jour</div><div class="life-muted">${dateOf(nxLifeDate).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div style="margin:15px 0 7px">${timeline(r)}</div><div class="life-hours"><span>00 h</span><span>06 h</span><span>12 h</span><span>18 h</span><span>24 h</span></div>${p.map(x=>`<div class="life-line"><span><i class="life-dot" style="background:${COLORS[x.k]}"></i>${({work:'Travail',sleep:'Sommeil',commute:'Trajets',chores:'Sport',pause:'Pause',personal:'Temps personnel'})[x.k]}</span><b>${fmt(x.v)}</b></div>`).join('')}</section>
