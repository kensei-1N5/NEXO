/* iOS visual viewport can shrink when search receives focus. Keep navigation out of

(function nexoKeyboardGuard(){
  const editable=el=>el instanceof Element && (el.matches('input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), textarea, [contenteditable="true"]'));
  const sync=()=>{
    const el=document.activeElement;
    const vv=window.visualViewport;
    const occlusion=vv ? window.innerHeight-vv.height-vv.offsetTop : 0;
    // Hide on focus immediately; this avoids Safari's animated keyboard lifting the nav.
    document.body.classList.toggle('nexo-keyboard-open',editable(el) && (occlusion>80 || document.documentElement.classList.contains('nexo-edit-focused')));
  };
  document.addEventListener('focusin',e=>{
    if(!editable(e.target))return;
    document.documentElement.classList.add('nexo-edit-focused');
    document.body.classList.add('nexo-keyboard-open');
    requestAnimationFrame(sync);
  },true);
  document.addEventListener('focusout',e=>{
    if(!editable(e.target))return;
    document.documentElement.classList.remove('nexo-edit-focused');
    document.body.classList.remove('nexo-keyboard-open');
    requestAnimationFrame(sync);
  },true);
  window.visualViewport?.addEventListener('resize',sync);
  window.visualViewport?.addEventListener('scroll',sync);
  window.addEventListener('resize',sync);
})();

let expr='';function calc(){expr='';content(`<div class="card"><div class="calc-display" id="display">0</div><div class="calc-grid">${['AC','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(k=>`<button class="${'+−×÷%'.includes(k)?'op':k==='='?'eq':''}" onclick="calcPress('${k}')">${k}</button>`).join('')}</div></div>`)}function calcPress(k){if(k==='AC')expr='';else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='='){try{let s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if(!/^[\d+\-*/().\s]+$/.test(s))throw Error();let v=Function('"use strict";return ('+s+')')();if(!Number.isFinite(v))throw Error();expr=String(Math.round(v*1e10)/1e10)}catch{expr='Erreur'}}else if(k==='±'){expr=expr.startsWith('−')?expr.slice(1):'−'+expr}else expr+=(k==='%'?'%':k);$('#display').textContent=expr||'0'}
const units={Longueur:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},Masse:{kg:1,g:.001,lb:.45359237,oz:.028349523125},Volume:{L:1,mL:.001,'m³':1000,'gal (US)':3.785411784},Surface:{'m²':1,'km²':1e6,ha:1e4,'ft²':.09290304},Vitesse:{'km/h':1,'m/s':3.6,mph:1.609344},Température:{'°C':1,'°F':1,K:1}};let category='Longueur';function convert(){content(`<div class="tabs" id="cats">${Object.keys(units).map(c=>`<button onclick="category='${c}';convert()" class="${c===category?'active':''}">${c}</button>`).join('')}</div><div class="card stack"><label>Valeur à convertir</label><input class="field" id="v" inputmode="decimal" value="1" oninput="conversion()"><div class="two"><select class="field" id="from" onchange="conversion()"></select><select class="field" id="to" onchange="conversion()"></select></div><div class="result" id="converted"></div></div>`);let opts=Object.keys(units[category]);for(let id of ['from','to'])$('#'+id).innerHTML=opts.map(o=>`<option>${o}</option>`).join('');$('#to').selectedIndex=1;conversion()}function conversion(){let v=num($('#v').value),a=$('#from').value,b=$('#to').value,r;if(category==='Température'){let c=a==='°C'?v:a==='°F'?(v-32)*5/9:v-273.15;r=b==='°C'?c:b==='°F'?c*9/5+32:c+273.15}else r=v*units[category][a]/units[category][b];$('#converted').textContent=fmt(r)+' '+b}

function saveAccounts(){return get('savingsAccounts',[])}

function saveAccountBalance(id,cutoff='9999-12-31'){const a=saveAccounts().find(x=>x.id===id);if(!a)return 0;const init=(!a.date||a.date<=cutoff)?Number(a.initial)||0:0;const movements=saveMovements().filter(x=>x.accountId===id&&x.date<=cutoff);return init+movements.reduce((v,x)=>v+(Number(x.amount)||0),0)}
function saveAllBalance(cutoff){return saveAccounts().reduce((v,a)=>v+saveAccountBalance(a.id,cutoff),0)}
function saveAddAccount(){const name=$('#saveAccountName').value.trim(),type=$('#saveAccountType').value,initial=Number($('#saveAccountInitial').value||0),date=$('#saveAccountDate').value;if(!name||!date||!Number.isFinite(initial)||initial<0)return toast('Vérifie les champs du support');put('savingsAccounts',[...saveAccounts(),{id:crypto.randomUUID(),name,type,initial,date}]);savings();toast('Support créé')}
function saveAddMovement(){const accountId=$('#saveMoveAccount').value,amount=Number($('#saveMoveAmount').value),date=$('#saveMoveDate').value,kind=$('#saveMoveKind').value;if(!accountId||!date||!Number.isFinite(amount)||amount<=0)return toast('Vérifie les champs');if(kind==='withdraw'&&saveAccountBalance(accountId,date)<amount)return toast('Solde insuffisant');const value=kind==='withdraw'?-amount:amount;put('savingsMovements',[...saveMovements(),{id:crypto.randomUUID(),accountId,amount:value,date,kind,note:$('#saveMoveNote').value.trim()}]);savings();toast('Opération enregistrée')}
function saveDeleteMovement(id){if(!confirm('Supprimer cette opération ?'))return;put('savingsMovements',saveMovements().filter(x=>x.id!==id));savings()}
function saveTransfer(){const from=$('#saveTransferFrom').value,to=$('#saveTransferTo').value,amount=Number($('#saveTransferAmount').value),date=$('#saveTransferDate').value;if(!from||!to||from===to||!date||!Number.isFinite(amount)||amount<=0)return toast('Transfert invalide');if(saveAccountBalance(from,date)<amount)return toast('Solde insuffisant');const id=crypto.randomUUID();put('savingsMovements',[...saveMovements(),{id:id+'a',accountId:from,amount:-amount,date,kind:'transfer',group:id,note:'Transfert sortant'},{id:id+'b',accountId:to,amount,date,kind:'transfer',group:id,note:'Transfert entrant'}]);savings();toast('Transfert effectué')}
function saveValuation(){const id=$('#saveValueAccount').value,value=Number($('#saveValueAmount').value),date=$('#saveValueDate').value;if(!id||!date||!Number.isFinite(value)||value<0)return toast('Valorisation invalide');const diff=Math.round((value-saveAccountBalance(id,date))*100)/100;if(!diff)return toast('Valeur déjà à jour');put('savingsMovements',[...saveMovements(),{id:crypto.randomUUID(),accountId:id,amount:diff,date,kind:'valuation',note:'Valorisation manuelle'}]);savings();toast('Valorisation enregistrée')}
function saveEditMovement(id){const x=saveMovements().find(m=>m.id===id);if(!x)return;if(x.kind==='transfer')return toast('Pour corriger un transfert, supprime-le puis recrée-le');const amount=prompt('Montant (€)',String(Math.abs(x.amount)));if(amount===null)return;const n=Number(amount.replace(',','.'));if(!Number.isFinite(n)||n<=0)return toast('Montant invalide');const date=prompt('Date (AAAA-MM-JJ)',x.date);if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Date invalide');put('savingsMovements',saveMovements().map(m=>m.id===id?{...m,amount:x.amount<0?-n:n,date}:m));savings()}
function saveSetYear(v){saveYear=Number(v);savings()}
function saveSetMonth(v){saveMonth=Number(v);savings()}
function saveSetMode(v){saveMode=v;savings()}
function saveSetFilter(v){saveFilter=v;savings()}
function savings(){
const accounts=saveAccounts(),moves=saveMovements(),today=expenseToday(),months=expenseMonthNames;
const years=[...new Set([new Date().getFullYear(),...moves.map(m=>Number(m.date.slice(0,4))),...accounts.map(a=>Number(a.date.slice(0,4))||new Date().getFullYear())])].sort((a,b)=>b-a);
const inScope=m=>saveFilter==='all'||m.accountId===saveFilter;
const monthly=Array.from({length:12},(_,i)=>{const period=String(saveYear)+'-'+String(i+1).padStart(2,'0');const mm=moves.filter(m=>m.date.startsWith(period)&&inScope(m)&&m.kind!=='transfer'&&m.kind!=='valuation');return {in:mm.filter(m=>m.amount>0).reduce((v,m)=>v+m.amount,0),out:-mm.filter(m=>m.amount<0).reduce((v,m)=>v+m.amount,0)}});
const allYear=years.slice().sort((a,b)=>a-b);
const capital=Array.from({length:12},(_,i)=>{const cutoff=`${saveYear}-${String(i+1).padStart(2,'0')}-31`;return saveFilter==='all'?saveAllBalance(cutoff):saveAccountBalance(saveFilter,cutoff)});
const chart=saveMode==='monthly'?monthly.map(m=>m.in-m.out):allYear.map(y=>{const mm=moves.filter(m=>m.date.startsWith(String(y))&&inScope(m)&&!['transfer','valuation'].includes(m.kind));return mm.reduce((v,m)=>v+m.amount,0)});
const max=Math.max(1,...chart.map(Math.abs)),monthKey=`${saveYear}-${String(saveMonth+1).padStart(2,'0')}`,visible=moves.filter(m=>inScope(m)&&(saveMode==='monthly'?m.date.startsWith(monthKey):m.date.startsWith(String(saveYear)))).sort((a,b)=>b.date.localeCompare(a.date));
const chosen=monthly[saveMonth],sum=saveFilter==='all'?saveAllBalance(today):saveAccountBalance(saveFilter,today);
const options=accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
const yearsOptions=years.map(y=>`<option value="${y}" ${saveYear===y?'selected':''}>${y}</option>`).join('');
const bars=chart.map((v,i)=>`<div class="save-bar-cell"><div class="save-bar-track"><button type="button" style="height:${Math.max(v?3:0,Math.round(Math.abs(v)/max*100))}%;background:${v<0?'#df6161':'#287de9'}" onclick="${saveMode==='monthly'?`saveSetMonth(${i})`:`saveSetYear(${allYear[i]})`}" aria-label="${saveMode==='monthly'?months[i]:allYear[i]} ${money(v)}"></button></div><span>${saveMode==='monthly'?months[i]:allYear[i]}</span></div>`).join('');
const maxCapital=Math.max(1,...capital),capitalBars=capital.map((v,i)=>`<div class="save-bar-cell"><div class="save-bar-track"><button type="button" style="height:${Math.max(v?3:0,Math.round(v/maxCapital*100))}%;background:#1ba88f" onclick="saveSetMonth(${i})" aria-label="${months[i]} ${money(v)}"></button></div><span>${months[i]}</span></div>`).join('');
content(`<section class="card stack"><div class="row" style="align-items:center;gap:10px"><svg viewBox="0 0 24 24" width="35" height="35" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M12 8v8M8 12h8M5 18h3"/></svg><h2>Épargne</h2></div><div class="muted">Épargne totale</div><div class="exp-summary">${money(sum)}</div><div class="exp-dash-controls"><select class="field" aria-label="Année" onchange="saveSetYear(this.value)">${yearsOptions}</select><select class="field" aria-label="Support" onchange="saveSetFilter(this.value)"><option value="all">Tous les supports</option>${accounts.map(a=>`<option value="${a.id}" ${saveFilter===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="exp-dash-tabs"><button class="${saveMode==='monthly'?'active':''}" onclick="saveSetMode('monthly')">Mensuel</button><button class="${saveMode==='yearly'?'active':''}" onclick="saveSetMode('yearly')">Annuel</button></div><h3>Épargne par ${saveMode==='monthly'?'mois':'année'}</h3><div class="save-bars">${bars}</div><div class="muted">Net ${saveMode==='monthly'?months[saveMonth]+' '+saveYear:saveYear} : ${money(saveMode==='monthly'?chosen.in-chosen.out:chart[allYear.indexOf(saveYear)]||0)}</div>${saveMode==='monthly'?`<div class="muted">Versements ${money(chosen.in)} · Retraits ${money(chosen.out)}</div>`:''}<h3>Évolution du capital (${saveYear})</h3><div class="save-bars">${capitalBars}</div><div class="muted">Capital fin ${months[saveMonth]} : ${money(capital[saveMonth])}</div></section>
<section class="card stack"><h2>Répartition par support</h2><div class="muted">Total épargne : ${money(saveAllBalance(today))}</div>${accounts.map((a,i)=>{const balance=saveAccountBalance(a.id,today),total=saveAllBalance(today),pct=total>0?Math.max(0,balance/total*100):0,color=['#287de9','#1ba88f','#9868e8','#e6a23c','#e06a88','#27a6cc','#7d8ba2','#c17a4d'][i%8];return `<div class="save-allocation-item"><div class="save-allocation-heading"><span><span class="save-allocation-dot" style="background:${color}"></span><strong>${esc(a.name)}</strong><small class="muted">${esc(a.type)}</small></span><span class="save-allocation-amount">${money(balance)} <strong>${pct.toLocaleString('fr-FR',{maximumFractionDigits:1})} %</strong></span></div><div class="save-allocation-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,pct)}" aria-label="Part de ${esc(a.name)}"><div style="width:${Math.min(100,pct)}%;background:${color}"></div></div></div>`}).join('')||'<p class="muted">Crée ton premier support pour commencer.</p>'}</section>
<details class="card nexo-fold"><summary>＋ Créer un support</summary><div class="stack save-create-form"><label>Nom du support</label><input class="field" id="saveAccountName" placeholder="Ex. PEA"><label>Type de support</label><select class="field" id="saveAccountType">${SAVE_TYPES.map(t=>`<option>${esc(t)}</option>`).join('')}</select><label>Solde initial (€)</label><input class="field" type="number" id="saveAccountInitial" min="0" step="0.01" value="0"><label>Date du solde initial</label><input class="field save-date-field" type="date" id="saveAccountDate" value="${today}"><button class="btn primary" onclick="saveAddAccount()">Créer le support</button></div></details>
${accounts.length?`<details class="card nexo-fold"><summary>＋ Versement / retrait</summary><div class="stack"><label>Support</label><select class="field" id="saveMoveAccount">${options}</select><label>Opération</label><select class="field" id="saveMoveKind"><option value="deposit">Versement</option><option value="withdraw">Retrait</option></select><label>Montant (€)</label><input class="field" id="saveMoveAmount" type="number" min="0.01" step="0.01"><label>Date</label><input class="field save-date-field" id="saveMoveDate" type="date" value="${today}"><label>Note (facultatif)</label><input class="field" id="saveMoveNote"><button class="btn primary" onclick="saveAddMovement()">Enregistrer</button></div></details>
<details class="card nexo-fold"><summary>↔ Transfert entre supports</summary><div class="stack"><label>Depuis</label><select class="field" id="saveTransferFrom">${options}</select><label>Vers</label><select class="field" id="saveTransferTo">${options}</select><label>Montant (€)</label><input class="field" id="saveTransferAmount" type="number" min="0.01" step="0.01"><label>Date</label><input class="field save-date-field" id="saveTransferDate" type="date" value="${today}"><button class="btn primary" onclick="saveTransfer()">Transférer</button></div></details>
<details class="card nexo-fold"><summary>◷ Actualiser la valeur</summary><div class="stack"><label>Support</label><select class="field" id="saveValueAccount">${options}</select><label>Nouvelle valeur (€)</label><input class="field" id="saveValueAmount" type="number" min="0" step="0.01"><label>Date</label><input class="field save-date-field" id="saveValueDate" type="date" value="${today}"><button class="btn primary" onclick="saveValuation()">Actualiser</button></div></details>`:''}
<section class="card stack"><h2>Historique de l'épargne (${visible.length})</h2>${visible.map(m=>{const a=accounts.find(x=>x.id===m.accountId);return `<div class="exp-dash-op"><div class="grow"><strong>${esc(a?.name||'Support')} · ${esc(m.kind==='deposit'?'Versement':m.kind==='withdraw'?'Retrait':m.kind==='transfer'?'Transfert':'Valorisation')}</strong><small>${esc(nexoDisplayDate(m.date))} ${esc(m.note||'')}</small></div><strong>${money(m.amount)}</strong><button class="btn" onclick="saveEditMovement('${m.id}')">✎</button><button class="btn danger" onclick="saveDeleteMovement('${m.id}')">×</button></div>`}).join('')||'<p class="muted">Aucune opération sur cette période.</p>'}</section>`);
}
function expenses(){content(`<div id="expenseDashboard"></div><details class="card nexo-fold" id="expenseFold"><summary>↗ Dépenses</summary><div class="stack"><div class="card stack"><h2>Ajouter une dépense</h2><div class="two"><div><label>Montant (€)</label><input id="amount" class="field" type="number" min="0" step="0.01" inputmode="decimal" placeholder="12,50"></div><div><label>Catégorie</label><select id="expCategory" class="field"></select></div></div><label>Description</label><input id="expDesc" class="field" placeholder="Ex. café"><label>Date de la dépense</label><input id="expDate" type="date" class="field"><button class="btn primary" onclick="addExpense()">Ajouter la dépense</button></div><details class="card exp-category-details" id="expenseCategoryDetails" ontoggle="saveExpenseCategoryPanel(this.open)"><summary>Catégories <span class="exp-category-hint" style="font-size:12px;font-weight:500;color:#8190a2;margin-left:auto">Gérer</span></summary><div class="exp-category-body stack"><div class="row"><input id="newExpCategory" class="field grow" maxlength="45" placeholder="Nouvelle catégorie"><button class="btn" onclick="addExpenseCategory()">+ Ajouter</button></div><div id="categoryManager" class="category-manager"></div><p class="exp-muted">Une catégorie utilisée par une dépense ne peut pas être supprimée. Supprime ou reclasse d’abord les dépenses concernées.</p></div></details><div class="card stack"><h2>Mes dépenses</h2><label>Filtrer par catégorie</label><select id="expFilter" class="field" onchange="drawExpenses()"></select><div class="two"><div><label>Total affiché</label><div class="result" id="total"></div></div><div><label>Total général</label><div class="result" id="allTotal"></div></div></div><div id="categoryShare" class="category-share" aria-live="polite"></div><div class="exp-actions"><button class="btn" onclick="exportExpensesExcel()">⬇ Exporter Excel</button><button class="btn danger" onclick="clearExpenses()">Supprimer les dépenses affichées</button></div><p class="exp-muted">L’export inclut toutes les dépenses, même si un filtre est actif.</p></div><div class="card" id="explist"></div></div></details>`);$('#expenseCategoryDetails').open=get('expenseCategoryPanelOpen',false);refreshExpenseCategories();$('#expDate').value=expenseToday();drawExpenses()}
function saveExpenseCategoryPanel(open){put('expenseCategoryPanelOpen',open)}
function refreshExpenseCategories(){const cats=expenseCategories(),old=$('#expCategory')?.value||'Courses',filter=$('#expFilter')?.value||'all';$('#expCategory').innerHTML=cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('#expCategory').value=cats.includes(old)?old:cats[0];$('#expFilter').innerHTML='<option value="all">Toutes les catégories</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('#expFilter').value=cats.includes(filter)?filter:'all';drawCategoryManager()}
function addExpenseCategory(){const c=$('#newExpCategory').value.trim();if(!c)return toast('Saisis un nom de catégorie');if(expenseCategories().some(x=>x.toLocaleLowerCase('fr')===c.toLocaleLowerCase('fr')))return toast('Cette catégorie existe déjà');put('expenseCategories',[...get('expenseCategories',[]),c]);refreshExpenseCategories();$('#expCategory').value=c;$('#newExpCategory').value='';drawCategoryManager();toast('Catégorie ajoutée')}
function drawCategoryManager(){const host=$('#categoryManager');if(!host)return;const cats=expenseCategories(),used=get('expenses',[]);host.innerHTML=cats.map(c=>{const count=used.filter(x=>x.category===c).length;return `<div class="category-manage-row"><span>${esc(c)} <small>(${count} dépense${count>1?'s':''})</small></span><button class="btn danger" ${count?'disabled title="Catégorie utilisée"':''} data-delete-category="${esc(c)}" aria-label="Supprimer la catégorie ${esc(c)}">Supprimer</button></div>`}).join('');host.querySelectorAll('[data-delete-category]').forEach(btn=>btn.addEventListener('click',()=>deleteExpenseCategory(btn.dataset.deleteCategory)))}
function deleteExpenseCategory(c){if(expenseCategories().length<=1)return toast('Conserve au moins une catégorie');if(get('expenses',[]).some(x=>x.category===c))return toast('Catégorie utilisée : suppression impossible');if(!confirm(`Supprimer la catégorie « ${c} » ?`))return;put('expenseCategories',get('expenseCategories',[]).filter(x=>x!==c));if(defaultExpenseCategories.includes(c))put('removedExpenseCategories',[...new Set([...get('removedExpenseCategories',[]),c])]);refreshExpenseCategories();drawExpenses();toast('Catégorie supprimée')}
function addExpense(){let a=Number($('#amount').value);if(!Number.isFinite(a)||a<=0)return toast('Montant invalide');let items=get('expenses',[]);items.unshift({id:crypto.randomUUID(),amount:Math.round(a*100)/100,category:$('#expCategory').value,desc:$('#expDesc').value.trim(),date:expenseDateDisplay($('#expDate').value||expenseToday())});put('expenses',items);$('#amount').value='';$('#expDesc').value='';drawExpenses()}
function drawExpenses(){const all=get('expenses',[]),filter=$('#expFilter').value,items=all.filter(x=>(filter==='all'||x.category===filter)&&expensePeriodMatch(x));$('#total').textContent=money(items.reduce((s,x)=>s+Number(x.amount||0),0));$('#allTotal').textContent=money(all.reduce((s,x)=>s+Number(x.amount||0),0));const totalAll=all.reduce((sum,x)=>sum+Number(x.amount||0),0);const shareHost=$('#categoryShare');if(shareHost){const categories=expenseCategories();const values=categories.map(c=>({name:c,total:all.filter(x=>x.category===c).reduce((sum,x)=>sum+Number(x.amount||0),0)})).filter(x=>x.total>0);shareHost.innerHTML='<h3>Répartition des dépenses par catégorie</h3>'+(values.length?values.sort((a,b)=>b.total-a.total).map(x=>{const pct=totalAll>0?100*x.total/totalAll:0;return `<div class="share-row"><div class="share-heading"><span>${esc(x.name)}</span><strong>${fmt(pct)} % <small>· ${money(x.total)}</small></strong></div><div class="share-track"><div class="share-fill" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div></div>`}).join(''):'<p class="exp-muted">Aucune dépense enregistrée.</p>');}drawCategoryManager();renderExpenseDashboard();$('#explist').innerHTML=items.map(x=>`<div class="item"><div class="grow"><strong>${esc(x.desc||x.category)}</strong><div class="muted">${esc(x.category)} · ${esc(nexoDisplayDate(x.date))}</div></div><strong>${money(x.amount)}</strong><button class="btn danger" onclick="deleteExpense('${x.id}')">×</button></div>`).join('')||'<p>Aucune dépense pour cette sélection.</p>'}

let incomeListMonth=expenseToday().slice(0,7);
function incomeSetListMonth(v){incomeListMonth=v;renderExpenseDashboard()}
let expenseBudgetMonth=new Date().getMonth();
function expenseSetBudgetMonth(v){expenseBudgetMonth=Number(v);renderExpenseDashboard()}
let expenseViewMode='monthly',expenseViewYear=new Date().getFullYear(),expenseViewMonth='all',expenseViewCategory='all',expenseViewAnnualYear=new Date().getFullYear();
const expenseMonthNames=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
function expenseToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function expenseDateDisplay(iso){const a=String(iso).split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:iso}
function nexoDisplayDate(value){
 const v=String(value??'').trim();
 if(!v)return '';
 let m=v.match(/^(\d{4})-(\d{2})-(\d{2})(?:T.*)?$/);
 if(m)return `${m[3]}/${m[2]}/${m[1]}`;
 m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 if(m)return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[3]}`;
 return v;
}
function expenseDateISO(v){const s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return ''}
function expenseDateParts(x){const s=expenseDateISO(x.date);if(!s)return null;const y=Number(s.slice(0,4)),m=Number(s.slice(5,7))-1;if(m<0||m>11)return null;return {year:y,month:m}}
function expenseDashboardYears(){const years=[...get('expenses',[]),...get('incomeEntries',[])].map(expenseDateParts).filter(Boolean).map(x=>x.year);return [...new Set([...years,new Date().getFullYear()])].sort((a,b)=>b-a)}
function expensePeriodMatch(x){const d=expenseDateParts(x);return !!d&&d.year===expenseViewYear&&(expenseViewMonth==='all'||d.month===expenseViewMonth)}
function expensePeriodLabel(){return expenseViewMonth==='all'?String(expenseViewYear):expenseMonthNames[expenseViewMonth]+' '+expenseViewYear}
function expenseSetMode(mode){expenseViewMode=mode;expenseViewCategory='all';renderExpenseDashboard()}
function expenseSetYear(v){expenseViewYear=Number(v);expenseViewAnnualYear=expenseViewYear;expenseViewCategory='all';renderExpenseDashboard();if($('#explist'))drawExpenses()}
function expenseSetMonth(m){expenseViewMonth=m==='all'?'all':Number(m);if(expenseViewMonth!=='all')expenseBudgetMonth=expenseViewMonth;expenseViewCategory='all';renderExpenseDashboard();if($('#explist'))drawExpenses()}
function expenseSetAnnualYear(y){expenseViewAnnualYear=Number(y);expenseViewYear=expenseViewAnnualYear;expenseViewCategory='all';renderExpenseDashboard();if($('#explist'))drawExpenses()}
function expenseSetCategory(c){expenseViewCategory=c;renderExpenseDashboard()}
function expenseSetBudget(){const key=String(expenseViewYear)+'-'+String(expenseBudgetMonth+1).padStart(2,'0');const v=$('#expMonthlyBudget')?.value.trim().replace(',','.');if(v===''||!Number.isFinite(Number(v))||Number(v)<0)return toast('Budget invalide');const budgets=get('expenseMonthlyBudgets',{});budgets[key]=Number(v);put('expenseMonthlyBudgets',budgets);renderExpenseDashboard();toast('Budget mensuel enregistré')}
function incomeAdd(){const amount=Number($('#incomeAmount')?.value),date=$('#incomeDate')?.value,category=$('#incomeCategory')?.value,desc=$('#incomeDesc')?.value.trim();if(!Number.isFinite(amount)||amount<=0||!date)return toast('Vérifie le montant et la date');put('incomeEntries',[...get('incomeEntries',[]),{id:crypto.randomUUID(),amount:Math.round(amount*100)/100,date:expenseDateDisplay(date),category,desc}]);renderExpenseDashboard();toast('Entrée ajoutée')}
function incomeDelete(id){if(!confirm('Supprimer cette entrée ?'))return;put('incomeEntries',get('incomeEntries',[]).filter(x=>x.id!==id));renderExpenseDashboard()}
function clearIncomeDisplayed(){const all=get('incomeEntries',[]),period=expensePeriodLabel();const selected=all.filter(expensePeriodMatch);if(!selected.length)return toast('Aucune entrée affichée à supprimer');if(!confirm(`Supprimer définitivement les ${selected.length} entrées affichées (${period}) ? Les autres entrées seront conservées.`))return;const ids=new Set(selected.map(x=>x.id));put('incomeEntries',all.filter(x=>!ids.has(x.id)));renderExpenseDashboard();toast(`${selected.length} entrées affichées supprimées`)}

function dax(){daxCategory='Toutes';daxQuery='';content(`<section class="dax-hero"><div class="dax-mark"><svg class="brand-pbi" viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="20" width="6" height="15" rx="2" fill="#E4A900"/><rect x="12" y="13" width="7" height="22" rx="2" fill="#F2C811"/><rect x="21" y="5" width="7" height="30" rx="2" fill="#F2C811"/><rect x="30" y="12" width="6" height="23" rx="2" fill="#D2A800"/></svg></div><h2>Formules DAX</h2><p>Power BI · ${daxData.length} fonctions et modèles · Exemples concrets et constructeur interactif</p></section><input class="search dax-search" id="daxSearch" type="search" placeholder="⌕  Rechercher : CALCULATE, dates, filtre…" aria-label="Rechercher une formule DAX" autocomplete="off"><div class="dax-filter" id="daxFilters"></div><div class="dax-count" id="daxCount"></div><div id="daxResults"></div><p class="dax-note">Bibliothèque pratique, non exhaustive. DAX utilise les noms de fonctions anglais. Les exemples utilisent des virgules comme séparateurs ; selon les paramètres régionaux de Power BI, il peut falloir les remplacer par des points-virgules. Les tables et mesures sont fictives : adapte-les à ton modèle. Les fonctions peuvent nécessiter un contexte de ligne, de filtre ou une table de dates appropriée.</p>`);$('#daxSearch').addEventListener('input',e=>{daxQuery=e.target.value;drawDax()});drawDax()}
function daxSelectCategory(cat){daxCategory=cat;drawDax()}
function daxSplitArgs(body){let a=[],cur='',depth=0,quote=false;for(let i=0;i<body.length;i++){const c=body[i];if(c==='"'){if(quote&&body[i+1]==='"'){cur+='""';i++;continue}quote=!quote}if(!quote&&c==='(')depth++;if(!quote&&c===')')depth--;if(!quote&&c===','&&depth===0){a.push(cur.trim());cur='';continue}cur+=c}if(cur.trim())a.push(cur.trim());return a}
function daxParts(formula){const m=formula.match(/^([A-Za-z][A-Za-z0-9.]*)\((.*)\)$/s);return m?{name:m[1],args:daxSplitArgs(m[2])}:{name:'',args:[]}}
function daxDetail(i){const x=daxData[i],parts=daxParts(x[3]),labels=x[5];let fields=parts.args.map((a,j)=>`<label for="daxField-${i}-${j}">${j+1}. ${esc(labels[j]||'Argument '+(j+1))}</label><input id="daxField-${i}-${j}" data-daxarg="${j}" value="${esc(a)}" spellcheck="false" autocapitalize="off">`).join('');return `<details class="dax-detail"><summary>📖 Explication, arguments et exemple</summary><h4>À quoi sert cette fonction ?</h4><p>${esc(x[2])}</p><h4>Arguments</h4>${parts.args.length?parts.args.map((a,j)=>`<div class="dax-arg"><strong>${j+1}. ${esc(labels[j]||'Argument '+(j+1))}</strong><div><code>${esc(a)}</code></div></div>`).join(''):'<p class="dax-note">Cette fonction ne prend aucun argument.</p>'}<h4>Exemple concret</h4><div class="dax-scenario">${esc(x[4])}</div><div class="dax-builder"><strong>🛠️ Construire ma formule</strong><p class="dax-note">Modifie les arguments ci-dessous. Le constructeur assemble la syntaxe mais ne valide pas ton modèle Power BI.</p>${fields}<div class="dax-result" id="daxBuilt-${i}">${esc(x[3])}</div><button class="btn" type="button" data-daxcopy="${i}">⧉ Copier ma formule</button></div></details>`}
function daxBuild(i){const card=document.querySelector(`[data-dax-index="${i}"]`);if(!card)return '';const x=daxData[i],p=daxParts(x[3]);const args=[...card.querySelectorAll('[data-daxarg]')].map(n=>n.value);const result=p.name?p.name+'('+args.join(', ')+')':x[3];card.querySelector('#daxBuilt-'+i).textContent=result;return result}
function drawDax(){const q=excelNormalize(daxQuery.trim());const matches=daxData.map((x,i)=>({x,i})).filter(({x})=>(daxCategory==='Toutes'||x[0]===daxCategory)&&(!q||excelNormalize(x.slice(0,5).join(' ')).includes(q)));$('#daxFilters').innerHTML=daxCategories.map((c,i)=>`<button type="button" class="${c===daxCategory?'selected':''}" onclick="daxSelectCategory(daxCategories[${i}])">${esc(c)}</button>`).join('');$('#daxCount').textContent=`${matches.length} résultat${matches.length>1?'s':''} · ${daxData.length} entrées dans le répertoire`;$('#daxResults').innerHTML=matches.map(({x,i})=>`<article class="dax-card" data-dax-index="${i}"><div class="excel-top"><strong class="dax-name">${esc(x[1])}</strong><span class="dax-cat">${esc(x[0])}</span></div><p>${esc(x[2])}</p><code class="dax-code">${esc(x[3])}</code><button class="btn" type="button" data-daxformula="${esc(x[3])}">⧉ Copier l’exemple</button>${daxDetail(i)}</article>`).join('')||'<p class="dax-note">Aucun résultat. Essaie un autre mot-clé.</p>';$('#daxResults').querySelectorAll('[data-daxformula]').forEach(b=>b.addEventListener('click',()=>copyText(b.dataset.daxformula)));$('#daxResults').querySelectorAll('[data-dax-index]').forEach(card=>{const i=Number(card.dataset.daxIndex);card.querySelectorAll('[data-daxarg]').forEach(inp=>inp.addEventListener('input',()=>daxBuild(i)));card.querySelector('[data-daxcopy]').addEventListener('click',()=>copyText(daxBuild(i)))})}

function motoDistance(a,b){const R=6371,rad=x=>x*Math.PI/180,dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]),v=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(v)))}
function motoHistoryMarkup(){const h=motoHistory().slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));return h.map(x=>`<div class="moto-history-item"><div><strong>${esc(x.name)}</strong><div class="small">${x.date?nexoDisplayDate(x.date):'Date inconnue'} · ${x.km.toLocaleString('fr-FR',{maximumFractionDigits:1})} km${x.duration!=null?' · '+Math.round(x.duration/60)+' min':''}</div></div><div class="moto-history-actions"><button class="btn" onclick="motoHistoryOpen('${x.id}')">Voir</button><button class="btn danger" onclick="motoHistoryDelete('${x.id}')">×</button></div></div>`).join('')||'<p class="small">Aucune trace importée.</p>'}
async function motoImportGPX(input){const file=input.files?.[0];if(!file)return;if(file.size>12*1024*1024)return toast('Fichier GPX trop volumineux (12 Mo max)');try{const xml=new DOMParser().parseFromString(await file.text(),'application/xml');if(xml.querySelector('parsererror'))throw Error('GPX invalide');const named=tag=>Array.from(xml.getElementsByTagName('*')).filter(n=>n.localName===tag);if(!named('gpx').length)throw Error('Ce fichier n’est pas un GPX');const tracks=named('trkseg');const routes=named('rte');let segments=[];if(tracks.length){segments=tracks.map(seg=>Array.from(seg.children).filter(n=>n.localName==='trkpt'))}else if(routes.length){segments=routes.map(route=>Array.from(route.children).filter(n=>n.localName==='rtept'))}else{segments=[named('wpt')]}const parsed=segments.map(seg=>seg.map(node=>{const lat=Number(node.getAttribute('lat')),lng=Number(node.getAttribute('lon')),time=Array.from(node.children).find(n=>n.localName==='time')?.textContent||null;return {lat,lng,time}}).filter(pt=>Number.isFinite(pt.lat)&&Number.isFinite(pt.lng)&&Math.abs(pt.lat)<=90&&Math.abs(pt.lng)<=180)).filter(seg=>seg.length>0);const count=parsed.reduce((n,seg)=>n+seg.length,0);if(count<2)throw Error('Trace insuffisante : au moins deux positions nécessaires');let km=0,first=null,last=null;for(const seg of parsed){for(let i=0;i<seg.length;i++){const pt=seg[i];if(pt.time){const t=Date.parse(pt.time);if(Number.isFinite(t)){first=first===null? t:Math.min(first,t);last=last===null?t:Math.max(last,t)}}if(i){const prev=seg[i-1];const d=motoDistance([prev.lat,prev.lng],[pt.lat,pt.lng]);if(d<2)km+=d}}}if(km<=0)throw Error('Distance impossible à calculer');const stride=Math.max(1,Math.ceil(count/3500));let n=0;const geometry=parsed.flatMap((seg,i)=>{const a=seg.filter((pt,j)=>j%stride===0||j===seg.length-1).map(pt=>[pt.lat,pt.lng]);return i?[null,...a]:a});const name=(named('trk')[0]||named('rte')[0]);const title=Array.from(name?.children||[]).find(n=>n.localName==='name')?.textContent?.trim()||file.name.replace(/\.gpx$/i,'');const record={id:motoId(),name:title.slice(0,100),km:+km.toFixed(2),date:first?new Date(first).toISOString():new Date().toISOString(),duration:first!==null&&last!==null&&last>=first?(last-first)/1000:null,geometry,points:count};put('moto_gpx_history_v1',[record,...motoHistory()]);toast('Trace GPS importée');motoHome()}catch(e){toast(e.message||'Import GPX impossible')}finally{input.value=''}}
function motoHistoryDelete(id){if(!confirm('Supprimer cette trace de l’historique ?'))return;put('moto_gpx_history_v1',motoHistory().filter(x=>x.id!==id));motoHome()}
async function motoHistoryOpen(id){const r=motoHistory().find(x=>x.id===id);if(!r)return motoHome();setHead('Roadtrip Moto','Historique de balade');content(`<div class="bar"><button onclick="motoHome()">← Historique</button></div><div class="card stack"><h2>${esc(r.name)}</h2><p><strong>${r.km.toLocaleString('fr-FR',{maximumFractionDigits:1})} km</strong> · ${r.points} positions GPS${r.duration!=null?' · '+Math.round(r.duration/60)+' min':''}</p><div id="moto-history-map" class="moto-map">Chargement de la carte…</div><p class="small">Distance calculée à partir des positions du fichier GPX, sans correction routière. La précision dépend de l’enregistrement GPS.</p><button class="btn danger" onclick="motoHistoryDelete('${r.id}')">Supprimer cette trace</button></div>`);try{await motoLoadLeaflet();if(!document.getElementById('moto-history-map'))return;if(motoMap){motoMap.remove();motoMap=null}motoMap=L.map('moto-history-map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(motoMap);const segments=[];let segment=[];for(const pt of r.geometry){if(pt===null){if(segment.length)segments.push(segment);segment=[]}else segment.push(pt)}if(segment.length)segments.push(segment);const layer=L.polyline(segments,{color:'#2687ef',weight:5}).addTo(motoMap);motoMap.fitBounds(layer.getBounds().pad(.12));setTimeout(()=>motoMap?.invalidateSize(),100)}catch{const el=document.getElementById('moto-history-map');if(el)el.textContent='Carte indisponible : vérifiez votre connexion.'}}

function motoNew(){const r={id:motoId(),name:'Nouvelle balade',points:[],km:null,updated:Date.now()};put('moto_rides_v1',[r,...motoSaved()]);motoOpen(r.id)}
function motoGet(){return motoSaved().find(x=>x.id===motoSelected)}
function motoUpdate(fn){const rides=motoSaved(),r=rides.find(x=>x.id===motoSelected);if(!r)return;fn(r);r.updated=Date.now();put('moto_rides_v1',rides)}
function motoLoadLeaflet(){return new Promise((resolve,reject)=>{if(window.L)return resolve();if(document.querySelector('#moto-leaflet-js')){let count=0;const poll=setInterval(()=>{if(window.L){clearInterval(poll);resolve()}else if(++count>50){clearInterval(poll);reject(Error('Carte indisponible'))}},100);return}let css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);let script=document.createElement('script');script.id='moto-leaflet-js';script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.onload=resolve;script.onerror=()=>reject(Error('Carte indisponible'));document.head.appendChild(script)})}
function motoOpen(id){motoSelected=id;const r=motoGet();if(!r)return motoHome();setHead('Roadtrip Moto','Construire un itinéraire');content(`<div class="bar"><button onclick="motoHome()">← Mes balades</button></div><div class="card stack"><label>Nom de la balade</label><input class="field" id="moto-name" maxlength="100" value="${esc(r.name)}" onchange="motoRename(this.value)"><p class="moto-note">Touchez la carte pour placer des étapes dans l'ordre du trajet. Le tracé suit les routes lorsqu'un service de calcul est disponible.</p><div id="moto-map" class="moto-map"><div class="moto-map-fallback">Chargement de la carte…</div></div><div class="moto-form"><input class="field" id="moto-place" placeholder="Rechercher une ville ou une adresse" aria-label="Lieu à rechercher"><button class="btn" onclick="motoSearch()">Rechercher</button></div><div id="moto-info" class="moto-info" aria-live="polite"></div><div id="moto-stops"></div><div class="moto-actions"><button class="btn" onclick="motoUndo()">↶ Retirer le dernier point</button><button class="btn" onclick="motoReverse()">⇄ Inverser</button><button class="btn danger" onclick="motoClear()">Effacer les points</button></div><div class="moto-actions"><button class="btn primary" onclick="motoMaps()">↗ Ouvrir dans Google Maps</button><button class="btn" onclick="motoGPX()">Exporter GPX</button></div><p class="moto-note">Google Maps peut recalculer le parcours et limiter le nombre d'étapes. L'export GPX conserve les points et, si calculé, le tracé routier. Connexion Internet requise pour la carte et le calcul d'itinéraire.</p><button class="btn danger" onclick="motoDelete()">Supprimer cette balade</button></div>`);motoStartMap(id)}
function motoRename(v){motoUpdate(r=>r.name=v.trim()||'Nouvelle balade')}
async function motoStartMap(id){try{await motoLoadLeaflet();if(motoSelected!==id||!$('#moto-map'))return;if(motoMap){motoMap.remove();motoMap=null}motoMap=L.map('moto-map',{zoomControl:true}).setView([48.85,2.35],9);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(motoMap);motoLayer=L.layerGroup().addTo(motoMap);motoMap.on('click',e=>motoAdd(e.latlng.lat,e.latlng.lng));motoRefresh(true);setTimeout(()=>motoMap?.invalidateSize(),100)}catch(e){if($('#moto-map'))$('#moto-map').innerHTML='<div class="moto-map-fallback">Carte indisponible. Vérifiez votre connexion Internet et réessayez en rouvrant la balade.</div>';motoRefresh(false)}}
function motoAdd(lat,lng,label){if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const r=motoGet();if(!r||r.points.length>=35)return toast('35 points maximum');motoUpdate(r=>{r.points.push({lat:+lat.toFixed(6),lng:+lng.toFixed(6),label:label||'Point '+(r.points.length+1)});r.km=null;r.geometry=null});motoRefresh(true)}
function motoUndo(){motoUpdate(r=>{r.points.pop();r.km=null;r.geometry=null});motoRefresh(true)}
function motoReverse(){motoUpdate(r=>{r.points.reverse();r.km=null;r.geometry=null});motoRefresh(true)}
function motoClear(){if(!confirm('Effacer tous les points de la balade ?'))return;motoUpdate(r=>{r.points=[];r.km=null;r.geometry=null});motoRefresh(true)}
function motoRemove(i){motoUpdate(r=>{r.points.splice(i,1);r.km=null;r.geometry=null});motoRefresh(true)}
function motoRefresh(route){const r=motoGet();if(!r)return;const pts=r.points||[];const stops=$('#moto-stops');if(stops)stops.innerHTML=pts.map((p,i)=>`<div class="moto-stop"><strong>${i+1}.</strong><span>${esc(p.label||'Point '+(i+1))}<br><small>${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</small></span><button class="btn" aria-label="Supprimer le point ${i+1}" onclick="motoRemove(${i})">×</button></div>`).join('')||'<p class="small">Aucun point : touchez la carte pour commencer.</p>';const info=$('#moto-info');if(info)info.textContent=pts.length+' point(s)'+(r.km!=null?' · '+Math.round(r.km*10)/10+' km par la route':'');if(!motoMap||!motoLayer)return;motoLayer.clearLayers();pts.forEach((p,i)=>L.marker([p.lat,p.lng]).addTo(motoLayer).bindPopup(esc((i+1)+'. '+(p.label||'Étape'))));if(motoRoute){motoMap.removeLayer(motoRoute);motoRoute=null}if(pts.length){const bounds=L.latLngBounds(pts.map(p=>[p.lat,p.lng]));motoMap.fitBounds(bounds.pad(.25),{maxZoom:12})}if(route)motoCalculate();else if(r.geometry&&r.geometry.length>1)motoDrawRoute(r.geometry)}
function motoDrawRoute(coords){if(!motoMap||!coords||coords.length<2)return;motoRoute=L.polyline(coords,{color:'#2687ef',weight:5,opacity:.88}).addTo(motoMap)}
async function motoCalculate(){const r=motoGet();if(!r)return;const id=r.id,points=r.points.map(p=>({...p})),req=++motoRequest;if(points.length<2)return;const info=$('#moto-info');if(info)info.textContent='Calcul du trajet routier…';try{const coord=points.map(p=>p.lng+','+p.lat).join(';');const url='https://router.project-osrm.org/route/v1/driving/'+coord+'?overview=full&geometries=geojson&steps=false';const res=await fetch(url);if(!res.ok)throw Error('Routage indisponible');const data=await res.json();const route=data.routes?.[0];if(!route?.geometry?.coordinates?.length)throw Error('Aucun trajet trouvé');if(req!==motoRequest||motoSelected!==id)return;const geometry=route.geometry.coordinates.map(x=>[x[1],x[0]]);motoUpdate(r=>{r.km=route.distance/1000;r.geometry=geometry});motoRefresh(false)}catch(e){if(req!==motoRequest)return;const el=$('#moto-info');if(el)el.textContent=points.length+' points · Impossible de calculer la route actuellement. Réessayez en modifiant un point.'}}
async function motoSearch(){const input=$('#moto-place');const q=input?.value.trim();if(!q)return;try{const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept-Language':'fr'}});if(!res.ok)throw Error();const items=await res.json();if(!items.length)return toast('Lieu introuvable');const item=items[0],lat=Number(item.lat),lng=Number(item.lon);if(motoMap)motoMap.setView([lat,lng],12);if(confirm('Ajouter « '+item.display_name.split(',').slice(0,2).join(',')+' » comme étape ?'))motoAdd(lat,lng,item.display_name.split(',').slice(0,2).join(','));input.value=''}catch{toast('Recherche indisponible')}}
function motoMaps(){const r=motoGet(),pts=r?.points||[];if(pts.length<2)return toast('Ajoutez au moins 2 points');const fmt=p=>p.lat+','+p.lng;const mid=pts.slice(1,-1);if(mid.length>3){if(!confirm('Google Maps sur iPhone peut limiter les étapes et recalculer le parcours. Ouvrir les 5 premiers points ?'))return}const selected=pts.length>5?pts.slice(0,5):pts;const url='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+encodeURIComponent(fmt(selected[0]))+'&destination='+encodeURIComponent(fmt(selected.at(-1)))+(selected.length>2?'&waypoints='+encodeURIComponent(selected.slice(1,-1).map(fmt).join('|')):'');window.open(url,'_blank','noopener')}
function motoGPX(){const r=motoGet();if(!r||r.points.length<2)return toast('Ajoutez au moins 2 points');const xml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));const waypoints=r.points.map(p=>`<wpt lat="${p.lat}" lon="${p.lng}"><name>${xml(p.label||'Étape')}</name></wpt>`).join('');const track=r.geometry?.length?`<trk><name>${xml(r.name)}</name><trkseg>${r.geometry.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}"/>`).join('')}</trkseg></trk>`:'';const data='<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="NEXO" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>'+xml(r.name)+'</name></metadata>'+waypoints+track+'</gpx>';const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:'application/gpx+xml'}));a.href=u;a.download='nexo-balade-'+r.id+'.gpx';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

 const vals=['nutritionKcal','nutritionP','nutritionC','nutritionF'].map(id=>Number($('#'+id).value));

 const record={id:existing?.id||travelNewId(),created:existing?.created||new Date().toISOString(),date:existing?.date||nutritionDate,type:$('#nutritionType').value,name,grams,kcal:vals[0],p:vals[1],c:vals[2],f:vals[3]};
 put('nutritionMeals',existing?old.map(x=>x.id===record.id?record:x):[...old,record]);nutritionEditing=null;nutritionRender();toast('Repas enregistré hors ligne')

 const t=nutritionTargets();
 content(`<div class="bar"><button onclick="nutritionRender()">← Journal</button></div><div class="card stack nutrition-form"><h2>Objectifs quotidiens</h2>
 ${[['calories','Calories (kcal)'],['protein','Protéines (g)'],['carbs','Glucides (g)'],['fat','Lipides (g)']].map(([k,label])=>`<label>${label}<input class="field" type="number" id="nutritionGoal_${k}" min="1" max="10000" step="1" value="${t[k]}"></label>`).join('')}
 <p class="small">Valeurs initiales purement illustratives, à personnaliser selon tes besoins. NEXO ne calcule aucune dose d’insuline.</p>
 <button class="btn primary" onclick="nutritionSaveSettings()">Enregistrer les objectifs</button></div>`)
}
function nutritionSaveSettings(){const t={};for(const k of Object.keys(nutritionDefaults)){const n=Number($('#nutritionGoal_'+k).value);if(!Number.isFinite(n)||n<=0||n>10000)return toast('Objectif invalide');t[k]=n}put('nutritionTargets',t);nutritionRender();toast('Objectifs enregistrés')}

function sport(){const entries=get('sportSessions',[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));content(`<div class="card stack"><h2>Mes séances de sport</h2><div class="travel-form"><label>Activité<input id="sportName" class="field" maxlength="80" placeholder="Musculation, course, vélo…"></label><label>Date<input id="sportDate" class="field" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Durée (minutes)<input id="sportMinutes" class="field" type="number" min="1" max="1440" placeholder="45"></label><label>Notes (facultatif)<textarea id="sportNotes" class="field" rows="2" maxlength="300" placeholder="Exercices, sensations…"></textarea></label><button class="btn primary" onclick="sportAdd()">Enregistrer la séance</button></div></div><div class="card"><h2>Historique (${entries.length})</h2>${entries.map(x=>`<div class="sport-entry"><div><strong>${esc(x.name)}</strong><small>${esc(nexoDisplayDate(x.date))} · ${x.minutes} min${x.notes?' · '+esc(x.notes):''}</small></div><button class="btn danger" onclick="sportDelete('${x.id}')" aria-label="Supprimer la séance">×</button></div>`).join('')||'<p class="small">Aucune séance enregistrée.</p>'}</div>`)}
function sportAdd(){const name=$('#sportName')?.value.trim(),date=$('#sportDate')?.value,minutes=Number($('#sportMinutes')?.value),notes=$('#sportNotes')?.value.trim()||'';if(!name||!date||!Number.isInteger(minutes)||minutes<1||minutes>1440)return toast('Vérifie l’activité, la date et la durée');put('sportSessions',[...get('sportSessions',[]),{id:travelNewId(),name,date,minutes,notes}]);sport();toast('Séance enregistrée')}
function sportDelete(id){if(!confirm('Supprimer cette séance ?'))return;put('sportSessions',get('sportSessions',[]).filter(x=>x.id!==id));sport()}
function travelNewId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2)}
function travelDateDays(a,b){return Math.max(1,Math.min(180,Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)+1))}
function travelDateAt(t,i){let d=new Date(t.start+'T12:00:00');d.setDate(d.getDate()+i);return d.toLocaleDateString('fr-FR',{weekday:'short'})+' '+nexoDisplayDate(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}
function travelEscAttr(v){return esc(v==null?'':v)}
function travel(){travelId=null;travelTab='planning';travelList()}
function travelFilterList(query){
 const q=String(query||'').trim().toLocaleLowerCase('fr-FR');
 const cards=document.querySelectorAll('.travel-list-card[data-travel-search]');
 let visible=0;
 cards.forEach(card=>{const show=(card.getAttribute('data-travel-search')||'').includes(q);card.style.display=show?'':'none';if(show)visible++});
 const empty=document.getElementById('travel-search-empty');if(empty)empty.style.display=cards.length&&!visible?'block':'none';
}
function travelList(){setHead('Mes voyages','Planifiez vos aventures jour par jour');let trips=travelStore().slice().sort((a,b)=>String(b.start||'').localeCompare(String(a.start||'')));content(`<div class="travel-list-head"><h2><span class="travel-list-plane" aria-hidden="true">✈</span><span>Mes voyages</span></h2><button class="travel-plus" onclick="travelCreateForm()" aria-label="Créer un voyage">＋</button></div><input id="travel-search" class="travel-search" type="search" placeholder="Rechercher un voyage…" aria-label="Rechercher un voyage" oninput="travelFilterList(this.value)"><div id="travel-search-empty" class="card" style="display:none">Aucun voyage correspondant.</div>${trips.map(t=>{let n=travelDateDays(t.start,t.end);return `<section class="travel-list-card" data-travel-search="${esc((t.name+' '+(t.destination||'')).toLocaleLowerCase('fr-FR'))}" onclick="travelOpen('${t.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')travelOpen('${t.id}')">${travelCoverMarkup(t)}<h2>${esc(t.name)}</h2><p>${travelPrettyDate(t.start)} – ${travelPrettyDate(t.end)} · ${n} jours</p><p>⌖ ${esc(t.destination||'Destination à définir')}</p><div class="travel-metrics"><div><strong>${n}</strong><span>Jours</span></div><div><strong>${t.destination?t.destination.split(/[,·;]/).filter(Boolean).length:0}</strong><span>Destinations</span></div><div><strong>${t.bookings.length}</strong><span>Réservations</span></div></div></section>`}).join('')||'<div class="card">Aucun voyage pour le moment. Crée ton premier itinéraire !</div>'}<button class="btn travel-import" onclick="travelImportPrompt()">Importer un voyage (JSON)</button>`)}
function travelPrettyDate(d){return nexoDisplayDate(d)}
function travelCreateForm(){travelPendingCover='';setHead('Nouveau voyage');content(`<div class="card stack"><h2>Créer un voyage</h2><div class="travel-form"><label>Nom du voyage<input id="trName" class="field" placeholder="Thaïlande 2027" maxlength="90"></label><label>Destination(s)<input id="trDest" class="field" placeholder="Bangkok, Koh Kood…" maxlength="180"></label><label>Départ<input id="trStart" type="date" class="field" value="${travelToday()}"></label><label>Retour<input id="trEnd" type="date" class="field" value="${travelToday()}"></label><div class="travel-cover-picker"><label for="trCover">Photo de couverture (facultatif)</label><input id="trCover" type="file" accept="image/*" onchange="travelPreviewCover(this)"><img id="trCoverPreview" class="travel-cover-preview" style="display:none" alt="Aperçu de la couverture"></div><button class="btn primary" onclick="travelCreate()">Créer le voyage</button><button class="btn" onclick="travelList()">Annuler</button></div></div>`)}
let travelPendingCover='';
function travelPreviewCover(input){let f=input.files&&input.files[0];if(!f)return;travelReadCover(f).then(data=>{travelPendingCover=data;let img=$('#trCoverPreview');if(img){img.src=data;img.style.display='block'}}).catch(e=>alert('Photo non utilisable : '+e.message))}
function travelReadCover(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('Choisis une image.'));if(file.size>20*1024*1024)return reject(Error('Image trop volumineuse (20 Mo maximum).'));let reader=new FileReader();reader.onerror=()=>reject(Error('Lecture impossible'));reader.onload=()=>{let im=new Image();im.onerror=()=>reject(Error('Format non pris en charge'));im.onload=()=>{try{let scale=Math.min(1,1200/im.width,1200/im.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.76);if(data.length>1200000)throw Error('Photo trop lourde après compression');resolve(data)}catch(e){reject(e)}};im.src=reader.result};reader.readAsDataURL(file)})}
function travelCoverMarkup(t){return typeof t.cover==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(t.cover)?`<img class="travel-cover" src="${t.cover}" alt="Couverture du voyage">`:''}
function travelCreate(){let name=$('#trName').value.trim(),destination=$('#trDest').value.trim(),start=$('#trStart').value,end=$('#trEnd').value;if(!name||!start||!end||end<start||travelDateDays(start,end)>180){toast('Vérifie le nom et les dates (180 jours maximum)');return}let t={id:travelNewId(),name,destination,start,end,cover:travelPendingCover,dayPlaces:{},steps:[],bookings:[],budget:[],checklist:[]};let all=travelStore();all.push(t);try{travelSave(all)}catch(e){return alert('Stockage insuffisant : essaie une autre photo ou une image plus légère.')}travelPendingCover='';travelOpen(t.id)}
function travelFind(){return travelStore().find(t=>t.id===travelId)}
function travelMutate(fn){const selectedDay=travelDay;let all=travelStore(),t=all.find(t=>t.id===travelId);if(!t)return;fn(t);travelSave(all);travelDay=selectedDay;travelRender();travelRestoreSelectedDay()}
function travelRestoreSelectedDay(){const rail=document.querySelector('.travel-days'),active=rail?.querySelector('button.active');if(rail&&active){rail.scrollLeft=Math.max(0,active.offsetLeft-(rail.clientWidth-active.offsetWidth)/2)}}
function travelOpen(id){travelId=id;travelDay=0;travelTab='planning';travelRender()}
function travelRender(){let t=travelFind();if(!t)return travelList();setHead('Mes voyages');let n=travelDateDays(t.start,t.end);travelDay=Math.max(0,Math.min(n-1,travelDay));content(`<div class="bar"><button onclick="travelList()">← Mes voyages</button></div><section class="travel-detail-hero">${travelCoverMarkup(t)}<h2>${esc(t.name)}</h2><p>${travelPrettyDate(t.start)} – ${travelPrettyDate(t.end)} · ${n} jours</p><p>⌖ ${esc(t.destination||'Destination à définir')}</p><div class="travel-metrics"><div><strong>${n}</strong><span>Jours</span></div><div><strong>${t.destination?t.destination.split(/[,·;]/).filter(Boolean).length:0}</strong><span>Destinations</span></div><div><strong>${t.bookings.length}</strong><span>Réservations</span></div></div></section><div class="travel-tabs">${[['planning','Planning'],['budget','Budget'],['bookings','Réservations'],['checklist','Checklist'],['settings','Options']].map(([id,label])=>`<button class="${travelTab===id?'active':''}" onclick="travelTab='${id}';travelRender()">${label}</button>`).join('')}</div><div id="travelContent"></div>`);if(travelTab==='planning'){travelPlanning(t,n);travelRestoreSelectedDay()}else if(travelTab==='bookings')travelBookings(t);else if(travelTab==='budget')travelBudget(t);else if(travelTab==='checklist')travelChecklist(t);else travelOptions(t)}
function travelFormatComments(v){return esc(String(v||'').replace(/\r\n?/g,'\n'))}
function travelSelectDay(i){
 const t=travelFind();if(!t)return;
 const n=travelDateDays(t.start,t.end);
 travelDay=Math.max(0,Math.min(n-1,i));
 // Only refresh the planning section: preserve page vertical scroll and the
 // selected date's position instead of recreating the whole trip page.
 travelPlanning(t,n);
 const active=document.querySelector('.travel-days button.active');
 if(active){const rail=active.parentElement;const target=active.offsetLeft-(rail.clientWidth-active.offsetWidth)/2;rail.scrollLeft=Math.max(0,target)}
}
function travelPlanning(t,n){let d=t.start;$('#travelContent').innerHTML=`<div class="travel-section-title"><h2>Programme du voyage</h2><span>Jour ${travelDay+1} / ${n}</span></div><div class="travel-days">${Array.from({length:n},(_,i)=>`<button class="${travelDay===i?'active':''}" onclick="travelSelectDay(${i})"><span>Jour ${i+1}</span><strong>${travelDateAt(t,i).replace(/^\S+ /,'')}</strong><small>${esc(travelDayPlace(t,i))}</small></button>`).join('')}</div><div class="travel-day-location"><span>📍 ${esc(travelDayPlace(t,travelDay))}</span><button class="btn" onclick="travelDayLocationForm()">Modifier la localisation</button></div><div class="travel-timeline" id="travelSteps"></div><button class="btn primary travel-add-step" onclick="travelStepForm()">＋ Ajouter une étape</button>`;let steps=t.steps.filter(x=>x.day===travelDay).sort((a,b)=>a.time.localeCompare(b.time));$('#travelSteps').innerHTML=steps.map((x,i)=>`<div class="travel-step"><div class="travel-time">${esc(x.time||'—')}</div><div class="travel-step-body"><strong>${esc(x.title)}</strong><small>⌖ ${esc(x.place||x.type)}</small>${x.notes?`<small class="travel-step-comments">${travelFormatComments(x.notes)}</small>`:''}${x.url?`<small><a class="travel-link" target="_blank" rel="noopener noreferrer" href="${travelSafeUrl(x.url)}">Ouvrir le lien</a></small>`:''}<div class="travel-actions"><button onclick="travelStepForm('${x.id}')">Modifier</button><button onclick="travelMoveStep('${x.id}',-1)" ${i===0?'disabled':''}>↑</button><button onclick="travelMoveStep('${x.id}',1)" ${i===steps.length-1?'disabled':''}>↓</button><button class="travel-danger" onclick="travelRemove('steps','${x.id}')">Supprimer</button></div></div></div>`).join('')||'<p class="travel-empty">Aucune étape prévue pour cette journée. Ajoute ta première activité !</p>'}
function travelDayPlace(t,i){let custom=t.dayPlaces&&t.dayPlaces[String(i)];if(typeof custom==='string'&&custom.trim())return custom.trim();let steps=t.steps.filter(x=>x.day===i);return steps.find(x=>x.place)?.place||t.destination?.split(/[,·;]/)[0]?.trim()||'À organiser'}
function travelDayLocationForm(){let t=travelFind();if(!t)return;let current=t.dayPlaces&&t.dayPlaces[String(travelDay)]||'';$('#travelContent').innerHTML=`<div class="card stack"><h2>Localisation du jour ${travelDay+1}</h2><p class="muted">${esc(travelDateAt(t,travelDay))} · Choisis une ville, une île ou une région pour cette journée.</p><div class="travel-form"><label>Destination du jour<input class="field" id="travelDayLocation" maxlength="150" placeholder="Bangkok, Koh Kood…" value="${travelEscAttr(current)}"></label><button class="btn primary" onclick="travelSaveDayLocation()">Enregistrer la localisation</button><button class="btn" onclick="travelRender()">Annuler</button></div></div>`}
function travelSaveDayLocation(){let value=$('#travelDayLocation').value.trim();travelMutate(t=>{if(!t.dayPlaces||typeof t.dayPlaces!=='object')t.dayPlaces={};if(value)t.dayPlaces[String(travelDay)]=value;else delete t.dayPlaces[String(travelDay)]});toast('Localisation du jour enregistrée')}
function travelSafeUrl(url){try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?esc(u.href):'#'}catch{return '#'}}
function travelStepForm(id){let t=travelFind(),x=t.steps.find(s=>s.id===id)||{day:travelDay,time:'09:00',title:'',type:'Visite',place:'',notes:'',url:''};$('#travelContent').innerHTML=`<div class="card stack"><h2>${id?'Modifier':'Ajouter'} une étape</h2><div class="travel-form"><label>Heure<input class="field" type="time" id="tsTime" value="${travelEscAttr(x.time)}"></label><label>Activité / étape<input class="field" id="tsTitle" maxlength="140" value="${travelEscAttr(x.title)}" placeholder="Visite du Grand Palais"></label><label>Type<select class="field" id="tsType">${['Visite','Transport','Hébergement','Restaurant','Activité','Autre'].map(k=>`<option ${x.type===k?'selected':''}>${k}</option>`).join('')}</select></label><label>Lieu<input class="field" id="tsPlace" maxlength="200" value="${travelEscAttr(x.place)}"></label><label>Notes<textarea class="field" id="tsNotes" rows="3">${esc(x.notes)}</textarea></label><label>Lien (optionnel)<input class="field" type="url" id="tsUrl" value="${travelEscAttr(x.url)}" placeholder="https://..."></label><button class="btn primary" onclick="travelStepSave('${id||''}')">Enregistrer</button><button class="btn" onclick="travelRender()">Annuler</button></div></div>`}
function travelStepSave(id){
let title=$('#tsTitle').value.trim();
if(!title)return toast('Indique le nom de l’étape');
const data={day:travelDay,time:$('#tsTime').value,title,type:$('#tsType').value,place:$('#tsPlace').value.trim(),notes:$('#tsNotes').value.replace(/\r\n?/g,'\n').trim(),url:$('#tsUrl').value.trim()};
const all=travelStore(),trip=all.find(t=>t.id===travelId);
if(!trip)return toast('Voyage introuvable');
const step=trip.steps.find(x=>String(x.id)===String(id));
const savedId=step?step.id:travelNewId();
if(step)Object.assign(step,data);else trip.steps.push({id:savedId,...data});
try{
 travelSave(all);
 const persisted=travelStore().find(t=>t.id===travelId)?.steps.find(x=>String(x.id)===String(savedId));
 if(!persisted||persisted.notes!==data.notes)throw Error('La modification n’a pas été retrouvée dans le stockage.');
 travelRender();travelRestoreSelectedDay();
 toast('Étape et commentaire enregistrés');
}catch(e){alert('Impossible d’enregistrer la modification. Vérifie l’espace de stockage de ton iPhone, puis réessaie. '+(e?.message||''))}
}
function travelMoveStep(id,delta){travelMutate(t=>{let arr=t.steps.filter(x=>x.day===travelDay).sort((a,b)=>a.time.localeCompare(b.time)),i=arr.findIndex(x=>x.id===id),j=i+delta;if(j<0||j>=arr.length)return;let a=arr[i],b=arr[j];let old=a.time;a.time=b.time;b.time=old;if(a.time===b.time){a.time=String(Math.max(0,parseInt(a.time.slice(0,2))*60+parseInt(a.time.slice(3))+delta)).padStart(4,'0');a.time=a.time.slice(0,2)+':'+a.time.slice(2)}})}
function travelRemove(kind,id){if(!confirm('Supprimer cet élément ?'))return;travelMutate(t=>{t[kind]=t[kind].filter(x=>x.id!==id)})}
function travelBookings(t){$('#travelContent').innerHTML=`<section class="travel-summary"><h2 class="travel-summary-title">Suivi des réservations</h2>${t.bookings.map(x=>`<label class="travel-booking-line travel-check-line"><input class="travel-check-input" type="checkbox" aria-label="Confirmer ${travelEscAttr(x.title)}" ${x.done?'checked':''} onchange="travelToggle('bookings','${x.id}')"><span class="travel-booking-main"><strong>${esc(x.title)}</strong><small>${esc(x.type)}${x.date?' · '+esc(nexoDisplayDate(x.date)):''}${x.reference?' · Réf. '+esc(x.reference):''}</small>${x.url?`<a class="travel-link" target="_blank" rel="noopener noreferrer" href="${travelSafeUrl(x.url)}">Voir la confirmation ↗</a>`:''}</span><span class="travel-booking-status ${x.done?'ok':''}">${x.done?'Confirmé':'À réserver'}</span></label>`).join('')||'<p class="travel-empty">Aucune réservation pour ce voyage.</p>'}</section><details class="travel-manage"><summary>Gérer les réservations et en ajouter ＋</summary>${t.bookings.map(x=>`<div class="travel-row"><input type="checkbox" aria-label="Confirmer ${travelEscAttr(x.title)}" ${x.done?'checked':''} onchange="travelToggle('bookings','${x.id}')"><span>${esc(x.title)}</span><button class="btn danger" onclick="travelRemove('bookings','${x.id}')">Supprimer</button></div>`).join('')}<div class="travel-form"><label>Réservation<input id="tbTitle" class="field" placeholder="Hôtel Bangkok"></label><label>Type<select id="tbType" class="field"><option>Hôtel</option><option>Vol</option><option>Train</option><option>Ferry</option><option>Transfert</option><option>Activité</option><option>Autre</option></select></label><label>Date<input id="tbDate" class="field" type="date"></label><label>Référence<input id="tbRef" class="field" maxlength="100"></label><label>Lien de confirmation<input id="tbUrl" class="field" type="url" placeholder="https://..."></label><button class="btn primary" onclick="travelAddBooking()">Ajouter la réservation</button></div></details>`}

function travelAddBooking(){let title=$('#tbTitle').value.trim();if(!title)return toast('Indique une réservation');let x={id:travelNewId(),title,type:$('#tbType').value,date:$('#tbDate').value,reference:$('#tbRef').value.trim(),url:$('#tbUrl').value.trim(),done:false};travelMutate(t=>t.bookings.push(x))}
function travelToggle(kind,id){travelMutate(t=>{let x=t[kind].find(x=>x.id===id);if(x)x.done=!x.done})}
function travelBudgetSpent(t,categoryId){return (t.expenses||[]).filter(e=>e.categoryId===categoryId).reduce((n,e)=>n+(Number(e.amount)||0),0)}
function travelBudget(t){
const expenses=Array.isArray(t.expenses)?t.expenses:[];
const planned=t.budget.reduce((n,b)=>n+(Number(b.planned)||0),0);
const spent=t.budget.reduce((n,b)=>n+(Number(b.actual)||0)+travelBudgetSpent(t,b.id),0);
const categoryRows=t.budget.map(b=>{const actual=(Number(b.actual)||0)+travelBudgetSpent(t,b.id),limit=Number(b.planned)||0,percent=limit>0?Math.min(100,Math.max(0,actual/limit*100)):actual>0?100:0;return `<div class="travel-budget-line"><div class="travel-budget-label"><span>${esc(b.category)}</span><strong>${money(actual)} <small class="travel-budget-planned">/ ${money(limit)} prévus</small></strong></div><div class="travel-budget-track" role="progressbar" aria-label="Dépenses ${travelEscAttr(b.category)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(percent)}"><div class="travel-budget-fill" style="width:${percent}%"></div></div></div>`}).join('');
$('#travelContent').innerHTML=`<section class="travel-summary"><h2 class="travel-summary-title">Budget du voyage</h2><div class="travel-budget-total">${money(planned)}</div><p class="travel-summary-sub">Dépenses réelles par catégorie, comparées au budget prévu</p>${categoryRows||'<p class="travel-empty">Crée une catégorie pour commencer.</p>'}<div class="travel-summary-extra"><div><span>Dépensé</span><strong>${money(spent)}</strong></div><div><span>Reste disponible</span><strong>${money(planned-spent)}</strong></div></div></section>
<details class="travel-manage" open><summary>Ajouter une dépense ＋</summary><div class="travel-form"><label>Catégorie<select id="teCategory" class="field">${t.budget.map(b=>`<option value="${travelEscAttr(b.id)}">${esc(b.category)}</option>`).join('')}</select></label><label>Description<input id="teTitle" class="field" maxlength="120" placeholder="Billet de train, hôtel…"></label><label>Montant dépensé (€)<input id="teAmount" class="field" type="number" min="0.01" step="0.01" placeholder="0,00"></label><label>Date<input id="teDate" class="field" type="date" value="${travelToday()}"></label><button class="btn primary" onclick="travelAddExpense()" ${t.budget.length?'':'disabled'}>Enregistrer la dépense</button></div></details>
<details class="travel-manage"><summary>Historique des dépenses (${expenses.length})</summary>${expenses.slice().reverse().map(e=>{let b=t.budget.find(x=>x.id===e.categoryId);return `<div class="travel-expense-item"><div><strong>${esc(e.title||'Dépense')}</strong><small>${esc(b?.category||'Catégorie supprimée')} · ${esc(nexoDisplayDate(e.date)||'Sans date')}</small></div><strong>${money(e.amount)}</strong><button class="btn danger" onclick="travelDeleteExpense('${e.id}')" aria-label="Supprimer la dépense">×</button></div>`}).join('')||'<p class="travel-empty">Aucune dépense enregistrée.</p>'}</details>
<details class="travel-manage"><summary>Gérer les budgets par catégorie ＋</summary>${t.budget.map(b=>`<div class="travel-row"><span><strong>${esc(b.category)}</strong><br><small>Budget : ${money(b.planned)}</small></span><button class="btn" onclick="travelEditBudget('${b.id}')">Modifier</button><button class="btn danger" onclick="travelRemoveBudget('${b.id}')">Supprimer</button></div>`).join('')}<div class="travel-form"><label>Nouvelle catégorie<input id="tbuCategory" class="field" placeholder="Hébergement"></label><label>Budget prévu (€)<input id="tbuPlanned" type="number" min="0" step="0.01" class="field" value="0"></label><button class="btn primary" onclick="travelAddBudget()">Créer la catégorie</button></div></details>`;
}
function travelAddBudget(){const category=$('#tbuCategory').value.trim(),planned=Number($('#tbuPlanned').value);if(!category||!Number.isFinite(planned)||planned<0)return toast('Vérifie le nom et le budget');travelMutate(t=>t.budget.push({id:travelNewId(),category,planned,actual:0}));toast('Catégorie ajoutée')}

// Sauvegarde complète : toutes les clés persistantes appartenant à NEXO.
const BACKUP_FORMAT='digital-toolbox-full-backup';
function backupKeys(){return Object.keys(localStorage).filter(k=>k.startsWith('tb_')).sort()}
function backupAllData(){
 try{
  const data={};for(const key of backupKeys())data[key]=localStorage.getItem(key);
  const payload={format:BACKUP_FORMAT,version:'10.1',createdAt:new Date().toISOString(),data};
  const date=new Date().toISOString().slice(0,10);
  travelDownload('digital-toolbox-sauvegarde-complete-'+date+'.json',JSON.stringify(payload,null,2));
  toast('Sauvegarde téléchargée : conserve-la dans Fichiers ou iCloud Drive');
 }catch(e){alert('Impossible de créer la sauvegarde : '+e.message)}
}
function restoreAllData(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{
  const file=input.files&&input.files[0];if(!file)return;
  try{
   if(file.size>15*1024*1024)throw Error('Fichier trop volumineux (15 Mo maximum).');
   const payload=JSON.parse(await file.text());
   if(!payload||payload.format!==BACKUP_FORMAT||!payload.data||typeof payload.data!=='object'||Array.isArray(payload.data))throw Error('Ce fichier n’est pas une sauvegarde complète NEXO.');
   const entries=Object.entries(payload.data);
   if(!entries.length)throw Error('Sauvegarde vide.');
   for(const [key,value] of entries){
    if(!/^tb_[A-Za-z0-9_-]{1,100}$/.test(key)||typeof value!=='string')throw Error('Contenu de sauvegarde non valide.');
    JSON.parse(value);
   }
   if(!confirm('Restaurer '+entries.length+' éléments de stockage depuis la sauvegarde du '+(payload.createdAt?new Date(payload.createdAt).toLocaleDateString('fr-FR'):'date inconnue')+' ?\n\nLes données actuelles de NEXO seront remplacées. Cette action est irréversible sans sauvegarde préalable.'))return;
   const previous={};for(const key of backupKeys())previous[key]=localStorage.getItem(key);
   try{
    for(const key of backupKeys())localStorage.removeItem(key);
    for(const [key,value] of entries)localStorage.setItem(key,value);
   }catch(err){
    for(const key of backupKeys())localStorage.removeItem(key);
    for(const [key,value] of Object.entries(previous))localStorage.setItem(key,value);
    throw Error('Espace insuffisant ou stockage indisponible. Les données précédentes ont été rétablies.');
   }
   alert('Restauration terminée ! NEXO va se recharger.');location.reload();
  }catch(e){alert('Restauration impossible : '+e.message)}
 };
 input.click();
}

// Garage & entretien V1 — données locales, aucune connexion réseau.
let garageSelected=null,garageTab='maintenance',garageYear=new Date().getFullYear();
let garageMode='auto';function garageAuto(){garageMode='auto';garage()}function garageMoto(){garageMode='moto';garage()}function garageInMode(v){return garageMode==='moto'?v.type==='moto'||v.type==='scooter':v.type!=='moto'&&v.type!=='scooter'}function garageModeTitle(){return garageMode==='moto'?'Ma Moto':'Mon Auto'}function garageModeType(){return garageMode==='moto'?'moto':'voiture'}
const GARAGE_PRESETS={
 moto:['Vidange moteur','Filtre à huile','Filtre à air','Bougies','Pneumatiques','Plaquettes de frein','Liquide de frein','Liquide de refroidissement','Graissage / tension chaîne','Kit chaîne','Batterie','Contrôle technique'],
 voiture:['Vidange moteur','Filtre à huile','Filtre à air','Filtre habitacle','Bougies','Pneumatiques','Plaquettes de frein','Disques de frein','Liquide de frein','Liquide de refroidissement','Distribution','Batterie','Contrôle technique'],
 scooter:['Vidange moteur','Filtre à air','Bougies','Pneumatiques','Plaquettes de frein','Liquide de frein','Courroie / transmission','Batterie','Contrôle technique']};
const garageVehicles=()=>get('garageVehicles',[]);
const garageRecords=()=>get('garageRecords',[]);
const garagePlans=()=>get('garagePlans',[]);
const garageUid=()=>crypto.randomUUID();
const garageToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function garageDatePlus(d,months){if(!d||!months)return '';const [y,m,day]=d.split('-').map(Number);const x=new Date(y,m-1+months,1),max=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(Math.min(day,max)).padStart(2,'0')}`;}
function garageSave(k,data){try{put(k,data);return true}catch(e){alert('Stockage insuffisant : impossible d’enregistrer. '+e.message);return false}}
function garageFind(){return garageVehicles().find(v=>v.id===garageSelected)}
function garagePhoto(v){return v.photo?`<img src="${v.photo}" alt="Photo de ${esc(v.name)}" class="garage-photo">`:`<div class="garage-photo garage-placeholder">${v.type==='moto'?'🏍️':v.type==='scooter'?'🛵':'🚙'}</div>`}
function garagePlansFor(id){return garagePlans().filter(p=>p.vehicleId===id)}
function garageRecordsFor(id){return garageRecords().filter(r=>r.vehicleId===id)}
function garageStatus(p,v){const rec=garageRecordsFor(v.id).filter(r=>r.planId===p.id).sort((a,b)=>b.date.localeCompare(a.date))[0];const date=p.nextDate||(rec&&p.months?garageDatePlus(rec.date,p.months):'');const km=p.nextKm||(rec&&p.kmInterval?Number(rec.km)+Number(p.kmInterval):0);const now=garageToday(),cur=Number(v.km)||0;
const due=(date&&date<=now)||(km&&cur>=km);
const soon=(date&&date<=garageDatePlus(now,1))||(km&&cur>=km-1000);
return {date,km,state:due?'late':soon?'soon':'ok'};}
function garage(){garageSelected=null;garageHome()}
function garageHome(){setHead(garageModeTitle(),garageMode==='moto'?'Vos motos et leurs entretiens':'Vos voitures et leurs entretiens');const vs=garageVehicles().filter(garageInMode),ids=new Set(vs.map(v=>v.id)),rs=garageRecords().filter(r=>ids.has(r.vehicleId)),alerts=vs.reduce((n,v)=>n+garagePlansFor(v.id).filter(p=>garageStatus(p,v).state!=='ok').length,0),total=rs.filter(r=>r.date.startsWith(String(new Date().getFullYear()))).reduce((n,r)=>n+Number(r.cost||0),0);
content(`<div class="garage-top"><h2>${garageModeTitle()}</h2><button class="btn primary" onclick="garageVehicleForm()">+ ${garageMode==='moto'?'Moto':'Auto'}</button></div><div class="garage-grid">${vs.map(v=>`<button class="garage-vehicle" onclick="garageOpen('${v.id}')">${garagePhoto(v)}<strong>${esc(v.name)}</strong><small>${esc(v.type)} · ${esc(v.year||'—')} · ${fmt(v.km||0)} km</small><span class="garage-alert">${garagePlansFor(v.id).filter(p=>garageStatus(p,v).state!=='ok').length} entretien(s) à prévoir</span></button>`).join('')}</div>${!vs.length?'<div class="card">Ajoutez votre premier véhicule pour commencer votre carnet d’entretien.</div>':''}<div class="garage-kpis"><div><strong>${vs.length}</strong><small>Véhicules</small></div><div><strong>${alerts}</strong><small>À prévoir</small></div><div><strong>${money(total)}</strong><small>Coûts cette année</small></div></div>`)}
function garageVehicleForm(id=''){const v=garageVehicles().find(x=>x.id===id)||{type:garageModeType(),km:0};garageSelected=id||null;content(`<div class="card stack"><h2>${id?'Modifier le véhicule':'Ajouter un véhicule'}</h2><label>Nom du véhicule</label><input class="field" id="gvName" value="${esc(v.name||'')}" placeholder="Ex. Honda CBR500R"><label>Type</label><select class="field" id="gvType">${(garageMode==='moto'?['moto','scooter']:['voiture']).map(x=>`<option value="${x}" ${v.type===x?'selected':''}>${x}</option>`).join('')}</select><div class="two"><div><label>Marque</label><input class="field" id="gvBrand" value="${esc(v.brand||'')}"></div><div><label>Modèle</label><input class="field" id="gvModel" value="${esc(v.model||'')}"></div></div><div class="two"><div><label>Année</label><input class="field" id="gvYear" type="number" min="1900" max="2100" value="${esc(v.year||'')}"></div><div><label>Kilométrage</label><input class="field" id="gvKm" type="number" min="0" value="${esc(v.km||0)}"></div></div><label>Immatriculation (facultative)</label><input class="field" id="gvPlate" value="${esc(v.plate||'')}"><label>Date d'achat</label><input class="field" id="gvBought" type="date" value="${esc(v.bought||'')}"><label>Photo depuis l'iPhone (facultative)</label><input class="field" type="file" accept="image/*" id="gvPhoto" onchange="garageReadPhoto(this)"><div id="gvPhotoPreview">${v.photo?garagePhoto(v):''}</div><label>Notes</label><textarea class="field" id="gvNotes" rows="3">${esc(v.notes||'')}</textarea><button class="btn primary" onclick="garageSaveVehicle('${id}')">Enregistrer</button><button class="btn" onclick="${id?`garageOpen('${id}')`:'garageHome()'}">Annuler</button>${id?`<button class="btn danger" onclick="garageDeleteVehicle('${id}')">Supprimer ce véhicule</button>`:''}</div>`);garagePhotoPending=v.photo||''}
let garagePhotoPending='';
function garageReadPhoto(input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('Choisis une image');if(file.size>12*1024*1024)return toast('Image trop volumineuse');const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,900/img.width,900/img.height);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);garagePhotoPending=c.toDataURL('image/jpeg',.7);$('#gvPhotoPreview').innerHTML=`<img class="garage-photo" alt="Aperçu" src="${garagePhotoPending}">`};img.onerror=()=>toast('Image illisible');img.src=reader.result};reader.readAsDataURL(file)}
function garageSaveVehicle(id){const name=$('#gvName').value.trim(),km=Number($('#gvKm').value);if(!name||!Number.isFinite(km)||km<0)return toast('Vérifie le nom et le kilométrage');const vs=garageVehicles(),old=vs.find(v=>v.id===id),type=$('#gvType').value;const v={id:id||garageUid(),name,type,brand:$('#gvBrand').value.trim(),model:$('#gvModel').value.trim(),year:$('#gvYear').value,km,plate:$('#gvPlate').value.trim(),bought:$('#gvBought').value,notes:$('#gvNotes').value,photo:garagePhotoPending};if(old)Object.assign(old,v);else vs.push(v);if(!garageSave('garageVehicles',vs))return;
if(!old){const plans=garagePlans();GARAGE_PRESETS[type].forEach(name=>plans.push({id:garageUid(),vehicleId:v.id,name,months:0,kmInterval:0,nextDate:'',nextKm:0}));garageSave('garagePlans',plans)}
